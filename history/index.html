<script>

/* =========================================================
   GEN-Z.AI
   HISTORY AUTO STATUS SYNC
   ---------------------------------------------------------
   PERBAIKAN:
   - Generation yang masih processing/pending akan meminta
     backend /api/generate-status untuk mengecek provider.
   - Backend kemudian melakukan reconciliation ke
     generation_history.
   - Setelah itu History membaca ulang data Supabase.
   - Polling setiap 5 detik.
   - Silent, tidak menyebabkan halaman berkedip.
   - Berhenti otomatis ketika tidak ada generation aktif.
   - Tidak mengubah renderer thumbnail yang sudah bekerja.
========================================================= */


/* =========================================================
   GLOBAL STATE
========================================================= */

let supabaseClient = null;

let currentUser = null;

let currentProfile = null;

let historyData = [];

let currentFilter = "all";


/* =========================================================
   HISTORY AUTO REFRESH
========================================================= */

let historyAutoRefreshTimer = null;


/*
 * Mencegah loadHistory berjalan bersamaan.
 */
let historyLoadInProgress = false;


/*
 * Mencegah dua proses status synchronization berjalan
 * bersamaan.
 */
let historyStatusSyncInProgress = false;


/*
 * Interval auto status check.
 */
const HISTORY_AUTO_REFRESH_INTERVAL = 5000;


/*
 * Endpoint backend yang menjadi sumber status provider.
 *
 * JANGAN query API provider langsung dari browser.
 * API key provider tetap berada di backend.
 */
const HISTORY_STATUS_ENDPOINT =
    "/api/generate-status";


/* =========================================================
   ELEMENTS
========================================================= */

const menuButton =
    document.getElementById("menuButton");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");

const navigation =
    document.getElementById("navigation");

const logoutButton =
    document.getElementById("logoutButton");

const refreshButton =
    document.getElementById("refreshButton");

const loadingState =
    document.getElementById("loadingState");

const tableWrap =
    document.getElementById("tableWrap");

const historyBody =
    document.getElementById("historyBody");

const emptyState =
    document.getElementById("emptyState");

const historyCount =
    document.getElementById("historyCount");

const historySubtitle =
    document.getElementById("historySubtitle");

const message =
    document.getElementById("message");

const detailModal =
    document.getElementById("detailModal");

const modalBody =
    document.getElementById("modalBody");

const closeModal =
    document.getElementById("closeModal");

const creditBalance =
    document.getElementById("creditBalance");

const sidebarEmail =
    document.getElementById("sidebarEmail");

const sidebarRole =
    document.getElementById("sidebarRole");

const userColumnHeader =
    document.getElementById("userColumnHeader");


/* =========================================================
   ROLE
========================================================= */

function normalizeRole(role) {

    return String(
        role || ""
    )
        .trim()
        .toUpperCase();

}


function isAdminOrOwner() {

    const role =
        normalizeRole(
            currentProfile?.role
        );

    return (
        role === "ADMIN" ||
        role === "OWNER"
    );

}


/* =========================================================
   SIDEBAR
========================================================= */

menuButton.addEventListener(
    "click",
    function () {

        const isOpen =
            sidebar.classList.contains(
                "open"
            );

        if (isOpen) {

            closeSidebar();

        } else {

            sidebar.classList.add(
                "open"
            );

            overlay.classList.add(
                "active"
            );

            menuButton.setAttribute(
                "aria-expanded",
                "true"
            );

        }

    }
);


overlay.addEventListener(
    "click",
    closeSidebar
);


function closeSidebar() {

    sidebar.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "active"
    );

    menuButton.setAttribute(
        "aria-expanded",
        "false"
    );

}

   BUILD NAVIGATION
========================================================= */

function buildNavigation() {

        return;

    }


    const role =
        normalizeRole(
            currentProfile.role
        );


    let html = "";


    if (role === "USER") {

        html = `

            <a
                href="../user/dashboard.html"
            >

            </a>

            <a
                href="../generate/index.html"
            >
                Generate
            </a>

            <a
                href="../history/index.html"

            >
                History
            </a>

            <a
                href="../user/topup.html"
            >
                Top Up
            </a>

            <a

            >
                Hub Admin
            </a>

        `;

    } else if (
        role === "ADMIN" ||
        role === "OWNER"
    ) {

        html = `

            <a
                href="../admin/dashboard.html"
            >
                Dashboard
            </a>

            <a
                href="../generate/index.html"
            >
                Generate
            </a>

                href="../history/index.html"

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "info"
) {

    message.textContent =
        text;

    message.className =
        "message show " + type;

}


function hideMessage() {

    message.textContent =
        "";

    message.className =
        "message";

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value) {

    if (!value) {

        return "-";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(
        "id-ID",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function normalizeStatus(status) {

    const value =
        String(
            status || "pending"
        )
            .trim()
            .toLowerCase();


    /*
     * Database generation_history:
     *
     * queued
     * processing
     * success
     * failed
     * cancelled
     *
     * Legacy:
     * completed
     */

    if (
        value === "completed"
    ) {

        return "success";

    }


    if (
        value === "queued"
    ) {

        return "pending";

    }


    return value;

}


function statusLabel(status) {

    const value =
        normalizeStatus(status);


    const labels = {

        success:
            "SUCCESS",

        processing:
            "PROSES",

        failed:
            "GAGAL",

        pending:
            "PENDING",

        cancelled:
            "DIBATALKAN"

    };


    return labels[value] ||
        value.toUpperCase();

}


function statusClass(status) {

    const value =
        normalizeStatus(status);


    const allowed = [

        "success",

        "processing",

        "failed",

        "pending",

        "cancelled"

    ];


    return allowed.includes(value)

        ? value

        : "pending";

}


/* =========================================================
   CREDIT
========================================================= */

function getCreditCost(item) {

    const raw =
        item?.credit_cost;


    if (
        raw === null ||
        raw === undefined ||
        raw === ""
    ) {

        return 0;

    }


    const value =
        Number(raw);


    return Number.isFinite(value)

        ? value

        : 0;

}


function formatCredit(value) {

    const numeric =
        Number(value);


    if (
        !Number.isFinite(numeric)
    ) {

        return "0";

    }


    return numeric.toLocaleString(
        "id-ID",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   URL SAFETY
========================================================= */

function getSafeMediaUrl(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    const raw =
        String(value).trim();


    if (!raw) {

        return "";

    }


    try {

        const url =
            new URL(
                raw,
                window.location.href
            );


        if (
            url.protocol !== "https:" &&
            url.protocol !== "http:"
        ) {

            return "";

        }


        return url.href;

    } catch {

        return "";

    }

}


/* =========================================================
   NAVIGATION
========================================================= */

function goToGenerate() {

    window.location.href =
        "../generate/index.html";

}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile() {

    const {
        data: profile,
        error
    } =
        await supabaseClient

            .from("profiles")

            .select(
                "id,email,name,role,credits,status"
            )

            .eq(
                "id",
                currentUser.id
            )

            .single();


    if (
        error ||
        !profile
    ) {

        console.error(
            "Profile error:",
            error
        );

        throw new Error(
            "Profil pengguna tidak ditemukan."
        );

    }


    const role =
        normalizeRole(
            profile.role
        );


    if (
        ![
            "USER",
            "ADMIN",
            "OWNER"
        ].includes(role)
    ) {

        await supabaseClient
            .auth
            .signOut();


        window.location.replace(
            "../login.html"
        );


        return false;

    }


    if (
        profile.status !== "active"
    ) {

        await supabaseClient
            .auth
            .signOut();


        window.location.replace(
            "../login.html"
        );


        return false;

    }


    currentProfile =
        profile;


    creditBalance.textContent =
        Number(
            profile.credits || 0
        ).toLocaleString(
            "id-ID"
        );


    sidebarEmail.textContent =
        profile.email ||
        currentUser.email ||
        "User";


    sidebarRole.textContent =
        role;


    buildNavigation();


    if (isAdminOrOwner()) {

        historySubtitle.textContent =
            "Riwayat generate seluruh aplikasi.";


        userColumnHeader.style.display =
            "table-cell";

    } else {

        historySubtitle.textContent =
            "Riwayat generate yang terkait dengan akun kamu.";


        userColumnHeader.style.display =
            "none";

    }


    return true;

}


/* =========================================================
   AUTH ACCESS TOKEN
========================================================= */

async function getHistoryAccessToken() {

    if (
        !supabaseClient
    ) {

        return "";

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if (
        error
    ) {

        console.error(
            "History session error:",
            error
        );

        return "";

    }


    return (
        data?.session?.access_token ||
        ""
    );

}


/* =========================================================
   ACTIVE GENERATION
========================================================= */

function isActiveHistoryItem(item) {

    const status =
        normalizeStatus(
            item?.status
        );


    return (
        status === "processing" ||
        status === "pending"
    );

}


/* =========================================================
   HISTORY STATUS SYNC
   ---------------------------------------------------------
   INI BAGIAN UTAMA PERBAIKAN.

   Sebelumnya History hanya:

       SELECT generation_history

   Sekarang:

       History
          ↓
       /api/generate-status
          ↓
       provider
          ↓
       backend update generation_history
          ↓
       SELECT generation_history
          ↓
       render

   Dengan begitu status provider benar-benar diperiksa.
========================================================= */

async function syncHistoryItemStatus(
    item,
    accessToken
) {

    if (
        !item ||
        !isActiveHistoryItem(item)
    ) {

        return {

            skipped: true,

            reason:
                "not_active"

        };

    }


    const taskId =
        String(
            item?.task_id ||
            ""
        ).trim();


    const modelId =
        String(
            item?.model_id ||
            ""
        ).trim();


    /*
     * Tanpa task_id kita tidak dapat meminta backend
     * mengecek provider.
     */
    if (!taskId) {

        console.warn(
            "[GEN-Z.AI] History item aktif tidak memiliki task_id.",
            item
        );


        return {

            skipped: true,

            reason:
                "missing_task_id",

            history_id:
                item?.id || null

        };

    }


    /*
     * /api/generate-status memang membutuhkan model_id.
     */
    if (!modelId) {

        console.warn(
            "[GEN-Z.AI] History item aktif tidak memiliki model_id.",
            item
        );


        return {

            skipped: true,

            reason:
                "missing_model_id",

            task_id:
                taskId

        };

    }


    if (!accessToken) {

        return {

            skipped: true,

            reason:
                "missing_access_token",

            task_id:
                taskId

        };

    }


    let response;


    try {

        response =
            await fetch(
                HISTORY_STATUS_ENDPOINT,
                {
                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json",

                        "Authorization":
                            `Bearer ${accessToken}`,

                        "Cache-Control":
                            "no-cache"

                    },

                    body:
                        JSON.stringify({

                            task_id:
                                taskId,

                            model_id:
                                modelId

                        })

                }
            );

    } catch (
        error
    ) {

        console.error(
            "[GEN-Z.AI] History status network error:",
            {
                task_id:
                    taskId,

                model_id:
                    modelId,

                error

            }
        );


        return {

            success:
                false,

            task_id:
                taskId,

            model_id:
                modelId,

            error:
                error?.message ||
                "Network error"

        };

    }


    let data = null;


    try {

        data =
            await response.json();

    } catch {

        data = {};

    }


    if (
        !response.ok
    ) {

        console.error(
            "[GEN-Z.AI] History status API error:",
            {
                task_id:
                    taskId,

                model_id:
                    modelId,

                status:
                    response.status,

                data

            }
        );


        return {

            success:
                false,

            task_id:
                taskId,

            model_id:
                modelId,

            status:
                response.status,

            data

        };

    }


    /*
     * Jangan memaksa frontend mengubah status sendiri.
     *
     * Backend adalah sumber kebenaran.
     *
     * Backend akan:
     * - query provider
     * - normalize state
     * - update generation_history
     * - return history_updated
     */
    return {

        success:
            data?.success !== false,

        task_id:
            data?.task_id ||
            data?.taskId ||
            taskId,

        model_id:
            data?.model_id ||
            data?.modelId ||
            modelId,

        provider_state:
            data?.provider_state ||
            data?.state ||
            null,

        history_updated:
            data?.history_updated === true,

        history_status:
            data?.history_status ||
            null,

        history_reason:
            data?.history_reason ||
            null,

        result_urls:
            Array.isArray(
                data?.result_urls
            )
                ? data.result_urls
                : [],

        data

    };

}


/* =========================================================
   SYNC ALL ACTIVE HISTORY
========================================================= */

async function syncActiveHistoryStatuses() {

    /*
     * Jangan jalankan dua batch synchronization sekaligus.
     */
    if (
        historyStatusSyncInProgress
    ) {

        return {

            skipped:
                true

        };

    }


    const activeItems =
        historyData.filter(
            item =>
                isActiveHistoryItem(
                    item
                )
        );


    if (
        activeItems.length === 0
    ) {

        return {

            skipped:
                true,

            reason:
                "no_active_items",

            checked:
                0

        };

    }


    historyStatusSyncInProgress =
        true;


    try {

        const accessToken =
            await getHistoryAccessToken();


        if (!accessToken) {

            console.warn(
                "[GEN-Z.AI] Tidak ada access token untuk status synchronization."
            );


            return {

                success:
                    false,

                reason:
                    "missing_access_token",

                checked:
                    0

            };

        }


        /*
         * Jangan menjalankan request tanpa batas.
         *
         * Kita gunakan Promise.allSettled supaya satu task
         * error tidak menghentikan task lainnya.
         */
        const results =
            await Promise.allSettled(

                activeItems.map(
                    item =>
                        syncHistoryItemStatus(
                            item,
                            accessToken
                        )
                )

            );


        let updatedCount =
            0;


        let checkedCount =
            0;


        results.forEach(
            (result, index) => {

                const item =
                    activeItems[index];


                if (
                    result.status ===
                    "fulfilled"
                ) {

                    checkedCount += 1;


                    if (
                        result.value?.history_updated === true
                    ) {

                        updatedCount += 1;

                    }

                    return;

                }


                console.error(
                    "[GEN-Z.AI] Status sync item gagal:",
                    {
                        history_id:
                            item?.id ||
                            null,

                        task_id:
                            item?.task_id ||
                            null,

                        reason:
                            result.reason

                    }
                );

            }
        );


        return {

            success:
                true,

            checked:
                checkedCount,

            active:
                activeItems.length,

            updated:
                updatedCount

        };

    } finally {

        historyStatusSyncInProgress =
            false;

    }

}


/* =========================================================
   HISTORY AUTO REFRESH HELPERS
========================================================= */

function stopHistoryAutoRefresh() {

    if (
        historyAutoRefreshTimer !== null
    ) {

        clearTimeout(
            historyAutoRefreshTimer
        );

        historyAutoRefreshTimer =
            null;

    }

}


/* =========================================================
   HAS ACTIVE GENERATION
========================================================= */

function hasActiveGeneration() {

    return historyData.some(
        item =>
            isActiveHistoryItem(
                item
            )
    );

}


/* =========================================================
   SCHEDULE AUTO REFRESH
========================================================= */

function scheduleHistoryAutoRefresh() {

    stopHistoryAutoRefresh();


    if (
        !hasActiveGeneration()
    ) {

        return;

    }


    historyAutoRefreshTimer =
        setTimeout(
            async function () {

                historyAutoRefreshTimer =
                    null;


                try {

                    /*
                     * STEP 1
                     *
                     * Minta backend mengecek provider.
                     *
                     * Ini yang sebelumnya tidak dilakukan
                     * oleh History.
                     */

                    await syncActiveHistoryStatuses();


                    /*
                     * STEP 2
                     *
                     * Setelah backend selesai mengecek provider,
                     * baca ulang generation_history.
                     *
                     * Jika backend mengubah:
                     *
                     * processing → success
                     *
                     * atau:
                     *
                     * processing → failed
                     *
                     * renderer akan otomatis memakai thumbnail
                     * success / failed.
                     */

                    await loadHistory({
                        silent:
                            true,

                        skipStatusSync:
                            true

                    });

                } catch (
                    error
                ) {

                    console.error(
                        "[GEN-Z.AI] History auto refresh error:",
                        error
                    );


                    /*
                     * Tetap lanjut polling jika masih aktif.
                     */
                    if (
                        hasActiveGeneration()
                    ) {

                        scheduleHistoryAutoRefresh();

                    }

                }

            },
            HISTORY_AUTO_REFRESH_INTERVAL
        );

}


/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadHistory(
    options = {}
) {

    const silent =
        options.silent === true;


    const skipStatusSync =
        options.skipStatusSync === true;


    /*
     * Mencegah query bertumpuk.
     */
    if (
        historyLoadInProgress
    ) {

        return;

    }


    historyLoadInProgress =
        true;


    try {

        if (!silent) {

            loadingState.style.display =
                "block";


            tableWrap.style.display =
                "none";


            emptyState.style.display =
                "none";


            hideMessage();

        }


        /*
         * =====================================================
         * STATUS SYNC
         * =====================================================
         *
         * Jangan melakukan status synchronization ketika
         * loadHistory dipanggil dari syncActiveHistoryStatuses().
         *
         * Ini mencegah:
         *
         * loadHistory()
         *    ↓
         * syncActiveHistoryStatuses()
         *    ↓
         * loadHistory()
         *    ↓
         * syncActiveHistoryStatuses()
         *
         * alias recursive loop.
         */

        if (
            !skipStatusSync
        ) {

            /*
             * Jika historyData sudah memiliki active task,
             * backend dipanggil terlebih dahulu.
             *
             * Pada initial load historyData masih kosong,
             * sehingga query awal dilakukan dulu.
             */

            if (
                historyData.length > 0 &&
                hasActiveGeneration()
            ) {

                await syncActiveHistoryStatuses();

            }

        }


        let query =
            supabaseClient

                .from(
                    "generation_history"
                )

                .select("*")

                .order(
                    "created_at",
                    {
                        ascending:
                            false
                    }
                );


        /*
         * USER hanya melihat history miliknya.
         *
         * ADMIN / OWNER melihat seluruh history.
         */
        if (
            !isAdminOrOwner()
        ) {

            query =
                query.eq(
                    "user_id",
                    currentUser.id
                );

        }


        const {
            data,
            error
        } =
            await query;


        if (
            error
        ) {

            console.error(
                "History query error:",
                error
            );


            throw new Error(
                "Gagal mengambil generation history: " +
                error.message
            );

        }


        historyData =
            Array.isArray(data)
                ? data
                : [];


        /*
         * Render tetap memakai renderer lama.
         */
        renderHistory();

    } finally {

        historyLoadInProgress =
            false;

    }

}


/* =========================================================
   USER DISPLAY
========================================================= */

function getHistoryUser(item) {

    return (
        item?.user_email ||
        item?.user_id ||
        "-"
    );

}


/* =========================================================
   MODEL / PROVIDER
========================================================= */

function getProviderName(item) {

    return (
        item?.provider_name ||
        item?.provider_id ||
        "-"
    );

}


function getModelName(item) {

    return (
        item?.model_name ||
        item?.model_id ||
        "-"
    );

}


/* =========================================================
   PROMPT
========================================================= */

function getPrompt(item) {

    if (
        item?.prompt !== null &&
        item?.prompt !== undefined &&
        String(
            item.prompt
        ).trim() !== ""
    ) {

        return String(
            item.prompt
        );

    }


    return "-";

}


/* =========================================================
   THUMBNAIL HELPERS
========================================================= */

function getResultUrl(item) {

    return getSafeMediaUrl(
        item?.result_url
    );

}


/* =========================================================
   PROCESSING THUMBNAIL
========================================================= */

function getProcessingThumbnailHtml() {

    return `

        <div
            class="history-thumbnail thumbnail-processing"
            aria-label="Video sedang diproses"
        >

            <div
                class="thumbnail-loader"
                aria-hidden="true"
            ></div>

            <div
                class="thumbnail-processing-label"
            >
                GENERATING
            </div>

        </div>

    `;

}


/* =========================================================
   SUCCESS THUMBNAIL
========================================================= */

function getSuccessThumbnailHtml(item) {

    const resultUrl =
        getResultUrl(item);


    if (!resultUrl) {

        return `

            <div
                class="history-thumbnail thumbnail-empty"
                aria-label="Hasil video belum tersedia"
                title="Hasil video belum tersedia"
            >

                <span>
                    🎬
                </span>

            </div>

        `;

    }


    const safeUrl =
        escapeHtml(
            resultUrl
        );


    return `

        <div
            class="history-thumbnail video-ready"
            data-video-url="${safeUrl}"
            role="button"
            tabindex="0"
            aria-label="Buka hasil video"
            title="Klik untuk membuka video"
        >

            <video
                src="${safeUrl}"
                muted
                playsinline
                preload="metadata"
                aria-hidden="true"
            ></video>

            <span
                class="thumbnail-play"
                aria-hidden="true"
            >
                ▶
            </span>

            <span
                class="thumbnail-success"
            >
                SUCCESS
            </span>

        </div>

    `;

}


/* =========================================================
   FAILED THUMBNAIL
========================================================= */

function getFailedThumbnailHtml(item) {

    /*
     * Failed tetap menggunakan tampilan GAGAL.
     * Tidak mengubah renderer yang sudah bekerja.
     */

    return `

        <div
            class="history-thumbnail thumbnail-failed"
            aria-label="Generation gagal"
            title="Generation gagal"
        >

            <div
                class="thumbnail-failed-icon"
            >
                !
            </div>

        </div>

    `;

}


/* =========================================================
   PENDING / CANCELLED / UNKNOWN THUMBNAIL
========================================================= */

function getEmptyThumbnailHtml(status) {

    const normalized =
        normalizeStatus(
            status
        );


    let label =
        "Belum ada preview";


    if (
        normalized === "cancelled"
    ) {

        label =
            "Generation dibatalkan";

    }


    return `

        <div
            class="history-thumbnail thumbnail-empty"
            aria-label="${escapeHtml(label)}"
            title="${escapeHtml(label)}"
        >

            <span>
                🎬
            </span>

        </div>

    `;

}


/* =========================================================
   MAIN THUMBNAIL RENDERER
========================================================= */

function getThumbnailHtml(item) {

    const status =
        normalizeStatus(
            item?.status
        );


    if (
        status === "processing"
    ) {

        return getProcessingThumbnailHtml();

    }


    if (
        status === "success"
    ) {

        return getSuccessThumbnailHtml(
            item
        );

    }


    if (
        status === "failed"
    ) {

        return getFailedThumbnailHtml(
            item
        );

    }


    return getEmptyThumbnailHtml(
        status
    );

}


/* =========================================================
   VIDEO THUMBNAIL EVENTS
========================================================= */

function openVideoUrl(url) {

    const safeUrl =
        getSafeMediaUrl(
            url
        );


    if (!safeUrl) {

        return;

    }


    window.open(
        safeUrl,
        "_blank",
        "noopener,noreferrer"
    );

}


function bindThumbnailEvents(
    container
) {

    container
        .querySelectorAll(
            ".history-thumbnail.video-ready"
        )
        .forEach(
            thumbnail => {

                const url =
                    thumbnail.dataset.videoUrl;


                const video =
                    thumbnail.querySelector(
                        "video"
                    );


                if (video) {

                    video.addEventListener(
                        "loadeddata",
                        function () {

                            try {

                                video.currentTime =
                                    0.05;

                            } catch {

                                /* noop */

                            }

                        },
                        {
                            once:
                                true
                        }
                    );

                }


                thumbnail.addEventListener(
                    "click",
                    function () {

                        openVideoUrl(
                            url
                        );

                    }
                );


                thumbnail.addEventListener(
                    "keydown",
                    function (event) {

                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {

                            event.preventDefault();

                            openVideoUrl(
                                url
                            );

                        }

                    }
                );

            }
        );

}


/* =========================================================
   STATUS HTML
========================================================= */

function getStatusHtml(
    status
) {

    const normalized =
        normalizeStatus(
            status
        );


    const className =
        statusClass(
            normalized
        );


    if (
        normalized === "processing"
    ) {

        return `

            <span
                class="status processing"
                aria-label="Sedang diproses"
            >

                <span
                    class="status-dot"
                ></span>

                <span
                    class="processing-label"
                >
                    PROSES

                    <span
                        class="processing-indicator"
                        aria-hidden="true"
                    >

                        <span></span>
                        <span></span>
                        <span></span>

                    </span>

                </span>

            </span>

        `;

    }


    return `

        <span
            class="status ${className}"
        >

            <span
                class="status-dot"
            ></span>

            <span>
                ${escapeHtml(
                    statusLabel(
                        normalized
                    )
                )}
            </span>

        </span>

    `;

}


/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory() {

    loadingState.style.display =
        "none";


    const filtered =
        currentFilter === "all"

            ? historyData

            : historyData.filter(
                item =>
                    normalizeStatus(
                        item.status
                    ) ===
                    currentFilter
            );


    historyCount.textContent =
        `${filtered.length.toLocaleString(
            "id-ID"
        )} riwayat`;


    if (
        filtered.length === 0
    ) {

        tableWrap.style.display =
            "none";


        emptyState.style.display =
            "block";


        if (
            historyData.length > 0 &&
            currentFilter !== "all"
        ) {

            emptyState
                .querySelector("h3")
                .textContent =
                "Tidak ada hasil";


            emptyState
                .querySelector("p")
                .textContent =
                "Tidak ada history dengan status tersebut.";


            emptyState
                .querySelector(
                    ".generate-button"
                )
                .style.display =
                "none";

        } else {

            emptyState
                .querySelector("h3")
                .textContent =
                "Belum ada riwayat";


            emptyState
                .querySelector("p")
                .textContent =
                isAdminOrOwner()

                    ? "Belum ada aktivitas generate di aplikasi."

                    : "Kamu belum melakukan generate video.";


            emptyState
                .querySelector(
                    ".generate-button"
                )
                .style.display =
                isAdminOrOwner()

                    ? "none"

                    : "inline-block";

        }


        scheduleHistoryAutoRefresh();


        return;

    }


    emptyState.style.display =
        "none";


    tableWrap.style.display =
        "block";


    historyBody.innerHTML =
        "";


    filtered.forEach(
        item => {

            const provider =
                getProviderName(
                    item
                );


            const model =
                getModelName(
                    item
                );


            const prompt =
                getPrompt(
                    item
                );


            const credits =
                getCreditCost(
                    item
                );


            const status =
                normalizeStatus(
                    item.status
                );


            const row =
                document.createElement(
                    "tr"
                );


            const userCell =
                isAdminOrOwner()

                    ? `

                        <td class="user-cell">

                            <strong
                                title="${escapeHtml(
                                    getHistoryUser(
                                        item
                                    )
                                )}"
                            >

                                ${escapeHtml(
                                    getHistoryUser(
                                        item
                                    )
                                )}

                            </strong>

                            ${
                                item.user_id

                                    ? escapeHtml(
                                        String(
                                            item.user_id
                                        ).slice(
                                            0,
                                            8
                                        ) + "..."
                                    )

                                    : ""
                            }

                        </td>

                    `

                    : "";


            row.innerHTML = `

                <td class="thumbnail-cell">

                    ${getThumbnailHtml(
                        item
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        formatDate(
                            item.created_at
                        )
                    )}

                </td>


                ${userCell}


                <td>

                    <span class="provider">

                        ${escapeHtml(
                            provider
                        )}

                    </span>

                </td>


                <td>

                    <span class="model">

                        ${escapeHtml(
                            model
                        )}

                    </span>

                </td>


                <td class="prompt-cell">

                    <div
                        class="prompt-text"
                        title="${escapeHtml(
                            prompt
                        )}"
                    >

                        ${escapeHtml(
                            prompt
                        )}

                    </div>

                </td>


                <td>

                    <span class="credits">

                        ${escapeHtml(
                            formatCredit(
                                credits
                            )
                        )}

                    </span>

                </td>


                <td>

                    ${getStatusHtml(
                        status
                    )}

                </td>


                <td>

                    <button
                        class="view-button"
                        type="button"
                    >
                        DETAIL
                    </button>

                </td>

            `;


            const button =
                row.querySelector(
                    ".view-button"
                );


            button.addEventListener(
                "click",
                function () {

                    showDetail(
                        item
                    );

                }
            );


            historyBody.appendChild(
                row
            );

        }
    );


    bindThumbnailEvents(
        historyBody
    );


    scheduleHistoryAutoRefresh();

}

/* =========================================================

========================================================= */

closeModal.addEventListener(
    "click",

        detailModal.classList.remove(
            "show"
        );

    }
);


detailModal.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            detailModal
        ) {

            detailModal.classList.remove(
                "show"
            );

        }

    }
);


document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Escape"
        ) {

            detailModal.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================================
   FILTER
========================================================= */

document
    .querySelectorAll(
        ".filter-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(
                            ".filter-button"
                        )
                        .forEach(
                            item => {

                                item.classList.remove(
                                    "active"
                                );

                            }
                        );


                    this.classList.add(
                        "active"
                    );


                    currentFilter =
                        this.dataset.filter ||
                        "all";


                    renderHistory();

                }
            );

        }
    );


/* =========================================================
   REFRESH
========================================================= */

refreshButton.addEventListener(
    "click",
    async function () {

        try {

            stopHistoryAutoRefresh();


            refreshButton.disabled =
                true;


            refreshButton.textContent =
                "MEMUAT...";


            await loadProfile();


            /*
             * Manual refresh:
             * loadHistory akan melakukan status sync
             * jika sebelumnya sudah ada active task.
             */
            await loadHistory();

        } catch (
            error
        ) {

            console.error(
                "Refresh error:",
                error
            );


            showMessage(
                error.message ||
                "Gagal memuat history.",
                "error"
            );

        } finally {

            refreshButton.disabled =
                false;


            refreshButton.textContent =
                "↻ REFRESH";

        }

    }
);


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    async function () {

        stopHistoryAutoRefresh();


        try {

            if (
                supabaseClient
            ) {

                await supabaseClient
                    .auth
                    .signOut();

            }

        } catch (
            error
        ) {

            console.error(
                "Logout error:",
                error
            );

        } finally {

            window.location.replace(
                "../login.html"
            );

        }

    }
);


/* =========================================================
   INIT
========================================================= */

async function init() {

    try {

        if (
            !window.supabase
        ) {

            window.location.replace(
                "../login.html"
            );

            return;

        }


        if (
            !window.GENZ_CONFIG ||
            !GENZ_CONFIG.SUPABASE_URL ||
            !GENZ_CONFIG.SUPABASE_KEY
        ) {

            window.location.replace(
                "../login.html"
            );

            return;

        }


        supabaseClient =
            window.supabase.createClient(
                GENZ_CONFIG.SUPABASE_URL,
                GENZ_CONFIG.SUPABASE_KEY
            );


        const {
            data: {
                session
            },
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if (
            error ||
            !session
        ) {

            window.location.replace(
                "../login.html"
            );

            return;

        }


        currentUser =
            session.user;


        const profileOK =
            await loadProfile();


        if (!profileOK) {

            return;

        }


        /*
         * Initial load:
         *
         * 1. Query generation_history.
         * 2. Render.
         * 3. Jika ada processing/pending,
         *    scheduleHistoryAutoRefresh()
         *    akan memanggil backend setelah 5 detik.
         */

        await loadHistory();

    } catch (
        error
    ) {

        console.error(
            "GEN-Z.AI History Error:",
            error
        );


        stopHistoryAutoRefresh();


        loadingState.style.display =
            "none";


        showMessage(
            error.message ||
            "Gagal memuat halaman history.",
            "error"
        );

    }

}


init();

</script>
