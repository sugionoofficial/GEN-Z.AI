<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GEN-Z.AI</title>

    <meta
        name="description"
        content="GEN-Z.AI AI Video Generation Platform"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8fafc 0%,
                    #eef2f6 50%,
                    #e5e7eb 100%
                );

            color: #111827;
        }

        .terminal {
            width: 100%;
            max-width: 420px;

            padding: 40px 24px;

            text-align: center;
        }

        .logo {
            font-size: 38px;

            font-weight: 900;

            letter-spacing: -0.06em;

            color: #111827;
        }

        .status {
            margin-top: 12px;

            font-size: 12px;

            color: #667085;

            letter-spacing: 0.08em;

            text-transform: uppercase;
        }

        .loader {
            width: 30px;
            height: 30px;

            margin:
                28px auto 0;

            border:
                3px solid #e5e7eb;

            border-top-color:
                #111827;

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }

        .footer {
            margin-top: 24px;

            font-size: 10px;

            color: #98a2b3;
        }

        @media (max-width: 480px) {

            .logo {
                font-size: 32px;
            }

            .terminal {
                padding:
                    30px 20px;
            }

        }
    </style>
</head>

<body>

    <main class="terminal">

        <div class="logo">
            GEN-Z.AI
        </div>

        <div class="status">
            Initializing AI Platform...
        </div>

        <div class="loader"></div>

        <div class="footer">
            AI Video Generation Platform
        </div>

    </main>


    <script>
        /*
         * GEN-Z.AI
         * Terminal / Entry Point
         *
         * Fungsi:
         * 1. Menjadi halaman awal
         * 2. Mengarahkan pengguna ke login
         *
         * Authentication tidak dilakukan di sini.
         */

        window.setTimeout(function () {

            window.location.replace("login.html");

        }, 500);

    </script>

</body>
</html>
