<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users - GEN-Z.AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>

    <style>
        <link rel="stylesheet" href="../assets/css/admin-premium.css">
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e9edf2);
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            padding: 22px 16px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .brand-sub {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .nav a {
            text-decoration: none;
            color: #374151;
            padding: 12px 13px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover {
            background: #f3f4f6;
        }

        .nav a.active {
            background: #111827;
            color: #fff;
        }

        .logout {
            margin-top: 25px;
            width: 100%;
            border: 0;
            background: #f3f4f6;
            color: #111827;
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .page-subtitle {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .user-info {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, .05);
        }

        .stat-label {
            color: #6b7280;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 800;
        }

        .card {
            background: rgba(255, 255, 255, .96);
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, .05);
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .card-title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .card-subtitle {
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
        }

        .toolbar {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search {
            flex: 1;
            max-width: 400px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .search:focus {
            border-color: #111827;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-dark {
            background: #111827;
            color: #fff;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .message {
            margin: 18px 20px 0;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #eef0f3;
            font-size: 13px;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 11px;
            letter-spacing: .5px;
            font-weight: 800;
        }

        tr:hover td {
            background: #fafafa;
        }

        .email {
            font-weight: 700;
        }

        .role {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: #f3f4f6;
            font-size: 10px;
            font-weight: 800;
        }

        .role.owner {
            background: #ede9fe;
            color: #6d28d9;
        }

        .role.admin {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .role.user {
            background: #f3f4f6;
            color: #4b5563;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.suspended {
            background: #fef3c7;
            color: #92400e;
        }

        .status.banned {
            background: #fee2e2;
            color: #991b1b;
        }

        .credit {
            font-weight: 800;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: #6b7280;
        }

        .empty strong {
            display: block;
            color: #111827;
            margin-bottom: 8px;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #e5e7eb;
            }

            .nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                max-width: none;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">GEN-Z.AI</div>
        <div class="brand-sub">ADMIN CONTROL</div>

        <nav class="nav">
            <a href="dashboard.html">DASHBOARD</a>
            <a href="generate.html">GENERATE</a>
            <a href="history.html">HISTORY</a>
            <a href="admin-panel.html">ADMIN PANEL</a>
            <a href="users.html" class="active">USERS</a>
            <a href="models.html">MODELS</a>
            <a href="providers.html">PROVIDERS</a>
            <a href="credit.html">CREDIT</a>
        </nav>

        <button class="logout" onclick="logout()">
            LOG OUT
        </button>

    </aside>

    <main class="main">

        <div class="topbar">

            <div>
                <h1 class="page-title">
                    USER MANAGEMENT
                </h1>

                <div class="page-subtitle">
                    Daftar pengguna dan status akun GEN-Z.AI
                </div>
            </div>

            <div
                class="user-info"
                id="userInfo"
            >
                Memuat...
            </div>

        </div>

        <div class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    TOTAL USERS
                </div>

                <div
                    class="stat-value"
                    id="totalUsers"
                >
                    0
                </div>

            </div>

            <div class="stat-card">

                <div class="stat-label">
                    ACTIVE USERS
                </div>

                <div
                    class="stat-value"
                    id="activeUsers"
                >
                    0
                </div>

            </div>

            <div class="stat-card">

                <div class="stat-label">
                    ADMIN / OWNER
                </div>

                <div
                    class="stat-value"
                    id="adminUsers"
                >
                    0
                </div>

            </div>

        </div>

        <section class="card">

            <div class="card-header">

                <div>

                    <h2 class="card-title">
                        USERS
                    </h2>

                    <div class="card-subtitle">
                        Data akun pengguna yang tersimpan di GEN-Z.AI
                    </div>

                </div>

                <button
                    class="btn btn-dark"
                    id="refreshButton"
                    onclick="loadUsers()"
                >
                    REFRESH
                </button>

            </div>

            <div class="toolbar">

                <input
                    type="text"
                    id="searchInput"
                    class="search"
                    placeholder="Cari email, nama, atau role..."
                    oninput="filterUsers()"
                >

            </div>

            <div
                id="message"
                class="message"
            ></div>

            <div id="userContainer">

                <div class="loading">
                    Memuat users...
                </div>

            </div>

        </section>

    </main>

</div>

<script>

const supabaseClient = supabase.createClient(
    GENZ_CONFIG.SUPABASE_URL,
    GENZ_CONFIG.SUPABASE_KEY
);

let currentUser = null;
let allUsers = [];

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}

function clearMessage() {

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className =
        "message";

}

async function checkAuth() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (
        !session ||
        !session.user
    ) {

        window.location.href =
            "../index.html";

        return false;

    }

    currentUser =
        session.user;

    const {
        data: profile,
        error
    } = await supabaseClient
        .from("profiles")
        .select(
            "id,email,name,role,status,credits"
        )
        .eq(
            "id",
            currentUser.id
        )
        .single();

    if (
        error ||
        !profile
    ) {

        await supabaseClient.auth.signOut();

        window.location.href =
            "../index.html";

        return false;

    }

    if (
        !["ADMIN", "OWNER"].includes(
            profile.role
        ) ||
        profile.status !== "active"
    ) {

        window.location.href =
            "../user/dashboard.html";

        return false;

    }

    document.getElementById(
        "userInfo"
    ).textContent =
        profile.email +
        " • " +
        profile.role;

    return true;

}

async function loadUsers() {

    clearMessage();

    const container =
        document.getElementById(
            "userContainer"
        );

    const refreshButton =
        document.getElementById(
            "refreshButton"
        );

    container.innerHTML = `
        <div class="loading">
            Memuat users...
        </div>
    `;

    refreshButton.disabled = true;
    refreshButton.textContent =
        "LOADING...";

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(
                "id,email,name,role,credits,status,created_at"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

        if (error) {

            throw error;

        }

        allUsers =
            data || [];

        updateStats();

        renderUsers(
            allUsers
        );

    } catch (error) {

        console.error(
            "USERS ERROR:",
            error
        );

        container.innerHTML = `
            <div class="empty">

                <strong>
                    GAGAL MEMUAT USERS
                </strong>

                <span>
                    ${escapeHtml(
                        error.message ||
                        "Terjadi kesalahan."
                    )}
                </span>

            </div>
        `;

        showMessage(
            "Gagal mengambil data users dari database.",
            "error"
        );

    } finally {

        refreshButton.disabled = false;
        refreshButton.textContent =
            "REFRESH";

    }

}

function updateStats() {

    const total =
        allUsers.length;

    const active =
        allUsers.filter(
            user =>
                user.status === "active"
        ).length;

    const admin =
        allUsers.filter(
            user =>
                user.role === "ADMIN" ||
                user.role === "OWNER"
        ).length;

    document.getElementById(
        "totalUsers"
    ).textContent =
        total.toLocaleString(
            "id-ID"
        );

    document.getElementById(
        "activeUsers"
    ).textContent =
        active.toLocaleString(
            "id-ID"
        );

    document.getElementById(
        "adminUsers"
    ).textContent =
        admin.toLocaleString(
            "id-ID"
        );

}

function filterUsers() {

    const keyword =
        document.getElementById(
            "searchInput"
        ).value
            .trim()
            .toLowerCase();

    if (!keyword) {

        renderUsers(
            allUsers
        );

        return;

    }

    const filtered =
        allUsers.filter(
            user => {

                const email =
                    String(
                        user.email || ""
                    ).toLowerCase();

                const name =
                    String(
                        user.name || ""
                    ).toLowerCase();

                const role =
                    String(
                        user.role || ""
                    ).toLowerCase();

                const status =
                    String(
                        user.status || ""
                    ).toLowerCase();

                return (
                    email.includes(keyword) ||
                    name.includes(keyword) ||
                    role.includes(keyword) ||
                    status.includes(keyword)
                );

            }
        );

    renderUsers(
        filtered
    );

}

function renderUsers(users) {

    const container =
        document.getElementById(
            "userContainer"
        );

    if (
        !users ||
        users.length === 0
    ) {

        container.innerHTML = `
            <div class="empty">

                <strong>
                    USER TIDAK DITEMUKAN
                </strong>

                <span>
                    Tidak ada akun yang sesuai dengan pencarian.
                </span>

            </div>
        `;

        return;

    }

    let html = `
        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>EMAIL</th>
                        <th>NAMA</th>
                        <th>ROLE</th>
                        <th>CREDIT</th>
                        <th>STATUS</th>
                    </tr>

                </thead>

                <tbody>
    `;

    users.forEach(user => {

        const role =
            String(
                user.role ||
                "USER"
            ).toLowerCase();

        const status =
            String(
                user.status ||
                "active"
            ).toLowerCase();

        html += `
            <tr>

                <td>
                    <div class="email">
                        ${escapeHtml(
                            user.email || "-"
                        )}
                    </div>
                </td>

                <td>
                    ${escapeHtml(
                        user.name || "-"
                    )}
                </td>

                <td>

                    <span
                        class="role ${role}"
                    >
                        ${escapeHtml(
                            user.role || "USER"
                        )}
                    </span>

                </td>

                <td>

                    <span class="credit">
                        ${Number(
                            user.credits || 0
                        ).toLocaleString(
                            "id-ID"
                        )}
                    </span>

                </td>

                <td>

                    <span
                        class="status ${status}"
                    >
                        ${escapeHtml(
                            status
                        )}
                    </span>

                </td>

            </tr>
        `;

    });

    html += `
                </tbody>

            </table>

        </div>
    `;

    container.innerHTML =
        html;

}

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "../index.html";

}

async function init() {

    const authenticated =
        await checkAuth();

    if (!authenticated) {

        return;

    }

    await loadUsers();

}

init();

</script>

</body>
</html>
