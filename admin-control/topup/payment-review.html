<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Review - GEN-Z.AI</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- GEN-Z.AI Config -->
    <script src="../../assets/js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #080b12;
            color: #f5f7fb;
        }

        body {
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 28px;
        }

        .container {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .header-left h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-left p {
            margin: 7px 0 0;
            color: #8f99aa;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            border: 1px solid #252c39;
            background: #121722;
            color: #f4f7fb;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 700;
            transition: 0.18s ease;
        }

        .btn:hover {
            background: #1a202c;
            border-color: #343d4d;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .btn-success {
            background: #15803d;
            border-color: #15803d;
            color: white;
        }

        .btn-success:hover {
            background: #166534;
            border-color: #166534;
        }

        .btn-danger {
            background: #b91c1c;
            border-color: #b91c1c;
            color: white;
        }

        .btn-danger:hover {
            background: #991b1b;
            border-color: #991b1b;
        }

        /* =========================================================
           STATS
        ========================================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #10141d;
            border: 1px solid #202733;
            border-radius: 14px;
            padding: 18px;
        }

        .stat-label {
            color: #8e98aa;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 25px;
            font-weight: 800;
        }

        /* =========================================================
           FILTER
        ========================================================= */

        .filter-card {
            background: #10141d;
            border: 1px solid #202733;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 18px;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .search {
            flex: 1;
            min-width: 240px;
        }

        .input,
        .select {
            width: 100%;
            border: 1px solid #29313e;
            background: #0b0f17;
            color: #f4f7fb;
            border-radius: 10px;
            padding: 11px 13px;
            outline: none;
        }

        .input:focus,
        .select:focus {
            border-color: #3b82f6;
        }

        .select-wrap {
            width: 170px;
        }

        /* =========================================================
           TABLE
        ========================================================= */

        .table-card {
            width: 100%;
            background: #10141d;
            border: 1px solid #202733;
            border-radius: 14px;
            overflow: hidden;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1050px;
            border-collapse: collapse;
        }

        thead {
            background: #0c1017;
        }

        th {
            padding: 14px 16px;
            text-align: left;
            color: #8e98aa;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #202733;
            white-space: nowrap;
        }

        td {
            padding: 15px 16px;
            border-bottom: 1px solid #1d2430;
            font-size: 13px;
            vertical-align: middle;
        }

        tbody tr:hover {
            background: #121823;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .user-name {
            font-weight: 700;
            color: #f4f7fb;
        }

        .user-email {
            margin-top: 3px;
            color: #7e899b;
            font-size: 11px;
        }

        .package-name {
            font-weight: 700;
        }

        .credit {
            font-weight: 800;
            color: #60a5fa;
        }

        .amount {
            font-weight: 800;
        }

        .method {
            display: inline-flex;
            align-items: center;
            border: 1px solid #29313e;
            border-radius: 8px;
            padding: 5px 9px;
            background: #0c1017;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 800;
            text-transform: capitalize;
        }

        .status-pending {
            background: rgba(234, 179, 8, 0.12);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.22);
        }

        .status-approved {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.22);
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.22);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid #29313e;
            background: #0c1017;
            color: #e9edf4;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 800;
        }

        .action-btn:hover {
            background: #1a202c;
        }

        .action-btn.approve {
            color: #86efac;
            border-color: rgba(34, 197, 94, 0.3);
        }

        .action-btn.reject {
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .action-btn.proof {
            color: #93c5fd;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .empty {
            padding: 55px 20px;
            text-align: center;
            color: #7e899b;
        }

        .loading {
            padding: 55px 20px;
            text-align: center;
            color: #8e98aa;
        }

        /* =========================================================
           MODAL
        ========================================================= */

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal {
            width: min(850px, 100%);
            max-height: 92vh;
            overflow: hidden;
            background: #10141d;
            border: 1px solid #2a3240;
            border-radius: 16px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 16px 18px;
            border-bottom: 1px solid #202733;
        }

        .modal-title {
            margin: 0;
            font-size: 17px;
            font-weight: 800;
        }

        .modal-close {
            width: 34px;
            height: 34px;
            border: 1px solid #29313e;
            background: #0b0f17;
            color: #e8edf5;
            border-radius: 9px;
            font-size: 18px;
        }

        .modal-body {
            padding: 18px;
            max-height: calc(92vh - 70px);
            overflow: auto;
        }

        .proof-info {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .info-box {
            background: #0b0f17;
            border: 1px solid #202733;
            border-radius: 10px;
            padding: 11px;
        }

        .info-label {
            color: #7e899b;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .info-value {
            color: #f1f5f9;
            font-size: 13px;
            font-weight: 700;
            word-break: break-word;
        }

        .proof-image-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 250px;
            padding: 10px;
            background: #070a0f;
            border: 1px solid #202733;
            border-radius: 12px;
        }

        .proof-image {
            display: block;
            max-width: 100%;
            max-height: 62vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .proof-error {
            color: #fca5a5;
            text-align: center;
            padding: 30px;
        }

        /* =========================================================
           TOAST
        ========================================================= */

        .toast-container {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 20000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(390px, calc(100vw - 40px));
        }

        .toast {
            padding: 13px 15px;
            border-radius: 11px;
            border: 1px solid #29313e;
            background: #111722;
            color: #f5f7fb;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
            font-size: 13px;
            line-height: 1.45;
            animation: toastIn 0.2s ease;
        }

        .toast.success {
            border-color: rgba(34, 197, 94, 0.35);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.35);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 900px) {
            .page {
                padding: 18px;
            }

            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .proof-info {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            .search,
            .select-wrap {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <div class="container">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="header">

            <div class="header-left">
                <h1>Payment Review</h1>
                <p>
                    Pemeriksaan bukti pembayaran Top Up Credit
                </p>
            </div>

            <div class="header-actions">
                <button
                    type="button"
                    class="btn"
                    id="refreshBtn"
                >
                    ↻ Refresh
                </button>

                <button
                    type="button"
                    class="btn"
                    id="backBtn"
                >
                    ← Kembali
                </button>
            </div>

        </div>

        <!-- =====================================================
             STATS
        ====================================================== -->

        <div class="stats">

            <div class="stat-card">
                <div class="stat-label">
                    Total Request
                </div>

                <div
                    class="stat-value"
                    id="statTotal"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Pending
                </div>

                <div
                    class="stat-value"
                    id="statPending"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Approved
                </div>

                <div
                    class="stat-value"
                    id="statApproved"
                >
                    0
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-label">
                    Rejected
                </div>

                <div
                    class="stat-value"
                    id="statRejected"
                >
                    0
                </div>
            </div>

        </div>

        <!-- =====================================================
             FILTER
        ====================================================== -->

        <div class="filter-card">

            <div class="filter-row">

                <div class="search">
                    <input
                        id="searchInput"
                        class="input"
                        type="search"
                        placeholder="Cari user, email, paket..."
                        autocomplete="off"
                    >
                </div>

                <div class="select-wrap">
                    <select
                        id="statusFilter"
                        class="select"
                    >
                        <option value="all">
                            Semua Status
                        </option>

                        <option value="pending">
                            Pending
                        </option>

                        <option value="approved">
                            Approved
                        </option>

                        <option value="rejected">
                            Rejected
                        </option>
                    </select>
                </div>

            </div>

        </div>

        <!-- =====================================================
             TABLE
        ====================================================== -->

        <div class="table-card">

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Paket</th>
                            <th>Credit</th>
                            <th>Nominal</th>
                            <th>Metode</th>
                            <th>Bukti</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="paymentTableBody">

                        <tr>
                            <td colspan="8">
                                <div class="loading">
                                    Memuat data pembayaran...
                                </div>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>
</div>


<!-- ============================================================
     PROOF MODAL
============================================================= -->

<div
    id="proofModal"
    class="modal-backdrop"
    aria-hidden="true"
>

    <div class="modal">

        <div class="modal-header">

            <h2
                class="modal-title"
                id="proofModalTitle"
            >
                Bukti Pembayaran
            </h2>

            <button
                type="button"
                class="modal-close"
                id="proofModalClose"
                aria-label="Tutup"
            >
                ×
            </button>

        </div>

        <div class="modal-body">

            <div class="proof-info">

                <div class="info-box">

                    <div class="info-label">
                        User
                    </div>

                    <div
                        class="info-value"
                        id="proofUser"
                    >
                        -
                    </div>

                </div>

                <div class="info-box">

                    <div class="info-label">
                        Paket
                    </div>

                    <div
                        class="info-value"
                        id="proofPackage"
                    >
                        -
                    </div>

                </div>

                <div class="info-box">

                    <div class="info-label">
                        Credit
                    </div>

                    <div
                        class="info-value"
                        id="proofCredit"
                    >
                        -
                    </div>

                </div>

                <div class="info-box">

                    <div class="info-label">
                        Metode
                    </div>

                    <div
                        class="info-value"
                        id="proofMethod"
                    >
                        -
                    </div>

                </div>

            </div>

            <div
                class="proof-image-wrap"
                id="proofImageWrap"
            >
                <div class="loading">
                    Memuat bukti pembayaran...
                </div>
            </div>

        </div>

    </div>

</div>


<!-- ============================================================
     TOAST
============================================================= -->

<div
    id="toastContainer"
    class="toast-container"
></div>


<script>
(function () {

    "use strict";

    /* =========================================================
       CONFIG
    ========================================================= */

    const STORAGE_BUCKET = "topup-proofs";

    const SIGNED_URL_EXPIRE_SECONDS = 600;

    let supabaseClient = null;
    let currentUser = null;

    let allRows = [];
    let filteredRows = [];

    let isLoading = false;
    let isProcessing = false;


    /* =========================================================
       DOM
    ========================================================= */

    const tableBody =
        document.getElementById("paymentTableBody");

    const searchInput =
        document.getElementById("searchInput");

    const statusFilter =
        document.getElementById("statusFilter");

    const refreshBtn =
        document.getElementById("refreshBtn");

    const backBtn =
        document.getElementById("backBtn");

    const statTotal =
        document.getElementById("statTotal");

    const statPending =
        document.getElementById("statPending");

    const statApproved =
        document.getElementById("statApproved");

    const statRejected =
        document.getElementById("statRejected");

    const proofModal =
        document.getElementById("proofModal");

    const proofModalClose =
        document.getElementById("proofModalClose");

    const proofModalTitle =
        document.getElementById("proofModalTitle");

    const proofUser =
        document.getElementById("proofUser");

    const proofPackage =
        document.getElementById("proofPackage");

    const proofCredit =
        document.getElementById("proofCredit");

    const proofMethod =
        document.getElementById("proofMethod");

    const proofImageWrap =
        document.getElementById("proofImageWrap");

    const toastContainer =
        document.getElementById("toastContainer");


    /* =========================================================
       HELPERS
    ========================================================= */

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function formatNumber(value) {

        const number = Number(value || 0);

        return new Intl.NumberFormat("id-ID")
            .format(number);
    }


    function formatCurrency(value) {

        const number = Number(value || 0);

        return new Intl.NumberFormat(
            "id-ID",
            {
                style: "currency",
                currency: "IDR",
                maximumFractionDigits: 0
            }
        ).format(number);
    }


    function normalizeStatus(status) {

        return String(status || "")
            .trim()
            .toLowerCase();
    }


    function formatMethod(method) {

        const value =
            String(method || "")
                .trim()
                .toLowerCase();

        const labels = {
            bca: "BCA",
            dana: "DANA",
            seabank: "SeaBank",
            qris: "QRIS"
        };

        return labels[value] || value || "-";
    }


    function showToast(message, type) {

        const toast =
            document.createElement("div");

        toast.className =
            "toast " + (type || "");

        toast.textContent =
            message;

        toastContainer.appendChild(toast);

        setTimeout(function () {

            toast.style.opacity = "0";

            toast.style.transform =
                "translateY(8px)";

            setTimeout(function () {

                toast.remove();

            }, 200);

        }, 3500);
    }


    function getSupabaseClient() {

        if (
            window.GENZ_SUPABASE &&
            typeof window.GENZ_SUPABASE.from === "function"
        ) {
            return window.GENZ_SUPABASE;
        }

        if (
            window.supabaseClient &&
            typeof window.supabaseClient.from === "function"
        ) {
            return window.supabaseClient;
        }

        if (
            window.supabase &&
            typeof window.supabase.createClient === "function"
        ) {

            const config =
                window.GENZ_SUPABASE_CONFIG ||
                window.SUPABASE_CONFIG;

            if (
                config &&
                config.url &&
                config.anonKey
            ) {
                return window.supabase.createClient(
                    config.url,
                    config.anonKey
                );
            }
        }

        return null;
    }


    /* =========================================================
       AUTH
    ========================================================= */

    async function loadCurrentUser() {

        const {
            data,
            error
        } = await supabaseClient.auth.getUser();

        if (error) {
            throw error;
        }

        if (!data || !data.user) {
            throw new Error(
                "Session admin tidak ditemukan."
            );
        }

        currentUser =
            data.user;

        return currentUser;
    }


    /* =========================================================
       ADMIN CHECK
    ========================================================= */

    async function verifyAdminAccess() {

        if (
            typeof supabaseClient.rpc !== "function"
        ) {
            return true;
        }

        try {

            const {
                data,
                error
            } = await supabaseClient.rpc(
                "is_admin_or_owner"
            );

            if (!error) {

                if (data === true) {
                    return true;
                }

                if (
                    data &&
                    (
                        data.success === true ||
                        data.is_admin === true
                    )
                ) {
                    return true;
                }

                if (data === false) {
                    throw new Error(
                        "Akses admin diperlukan."
                    );
                }
            }

        } catch (error) {

            /*
             * Jangan memblokir halaman hanya karena
             * function helper admin berbeda di project.
             *
             * RLS Supabase tetap menjadi lapisan keamanan.
             */
        }

        return true;
    }


    /* =========================================================
       LOAD TOPUP REQUESTS
    ========================================================= */

    async function loadTopupRequests() {

        const {
            data,
            error
        } = await supabaseClient
            .from("topup_requests")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

        if (error) {
            throw error;
        }

        return data || [];
    }


    /* =========================================================
       LOAD PAYMENT RECORDS
    ========================================================= */

    async function loadPaymentRecords() {

        const {
            data,
            error
        } = await supabaseClient
            .from("topup_payments")
            .select(
                [
                    "id",
                    "topup_request_id",
                    "user_id",
                    "payment_method",
                    "payment_proof_url",
                    "created_at",
                    "updated_at"
                ].join(",")
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

        if (error) {
            throw error;
        }

        return data || [];
    }


    /* =========================================================
       LOAD USER PROFILES
    ========================================================= */

    async function loadProfiles(userIds) {

        if (!userIds.length) {
            return [];
        }

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(
                "id,email,full_name,name,username"
            )
            .in("id", userIds);

        if (error) {

            /*
             * Jangan gagalkan seluruh halaman jika
             * schema profiles berbeda.
             */
            return [];
        }

        return data || [];
    }


    /* =========================================================
       COMBINE DATA
    ========================================================= */

    async function loadAllPayments() {

        const [
            requests,
            payments
        ] = await Promise.all([
            loadTopupRequests(),
            loadPaymentRecords()
        ]);

        const userIds = [
            ...new Set(
                requests
                    .map(function (row) {
                        return row.user_id;
                    })
                    .filter(Boolean)
            )
        ];

        const profiles =
            await loadProfiles(userIds);

        const paymentMap =
            new Map();

        payments.forEach(function (payment) {

            paymentMap.set(
                payment.topup_request_id,
                payment
            );
        });

        const profileMap =
            new Map();

        profiles.forEach(function (profile) {

            profileMap.set(
                profile.id,
                profile
            );
        });

        return requests.map(function (request) {

            const payment =
                paymentMap.get(request.id) || null;

            const profile =
                profileMap.get(request.user_id) || null;

            return {
                request: request,
                payment: payment,
                profile: profile
            };

        });
    }


    /* =========================================================
       USER DISPLAY
    ========================================================= */

    function getUserDisplay(row) {

        const profile =
            row.profile || {};

        const request =
            row.request || {};

        const name =
            profile.full_name ||
            profile.name ||
            profile.username ||
            request.user_name ||
            "User";

        const email =
            profile.email ||
            request.email ||
            request.user_email ||
            request.user_id ||
            "-";

        return {
            name: name,
            email: email
        };
    }


    /* =========================================================
       RENDER STATS
    ========================================================= */

    function renderStats(rows) {

        let pending = 0;
        let approved = 0;
        let rejected = 0;

        rows.forEach(function (row) {

            const status =
                normalizeStatus(
                    row.request.status
                );

            if (status === "pending") {
                pending++;
            } else if (status === "approved") {
                approved++;
            } else if (status === "rejected") {
                rejected++;
            }
        });

        statTotal.textContent =
            formatNumber(rows.length);

        statPending.textContent =
            formatNumber(pending);

        statApproved.textContent =
            formatNumber(approved);

        statRejected.textContent =
            formatNumber(rejected);
    }


    /* =========================================================
       FILTER
    ========================================================= */

    function applyFilters() {

        const search =
            String(
                searchInput.value || ""
            )
                .trim()
                .toLowerCase();

        const status =
            normalizeStatus(
                statusFilter.value
            );

        filteredRows =
            allRows.filter(function (row) {

                const request =
                    row.request || {};

                const user =
                    getUserDisplay(row);

                const packageName =
                    String(
                        request.package_name || ""
                    ).toLowerCase();

                const email =
                    String(
                        user.email || ""
                    ).toLowerCase();

                const name =
                    String(
                        user.name || ""
                    ).toLowerCase();

                const userId =
                    String(
                        request.user_id || ""
                    ).toLowerCase();

                const currentStatus =
                    normalizeStatus(
                        request.status
                    );

                const matchesSearch =
                    !search ||
                    name.includes(search) ||
                    email.includes(search) ||
                    packageName.includes(search) ||
                    userId.includes(search);

                const matchesStatus =
                    status === "all" ||
                    currentStatus === status;

                return (
                    matchesSearch &&
                    matchesStatus
                );
            });

        renderTable(
            filteredRows
        );
    }


    /* =========================================================
       RENDER TABLE
    ========================================================= */

    function renderTable(rows) {

        if (!rows.length) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="8">
                        <div class="empty">
                            Tidak ada data pembayaran.
                        </div>
                    </td>
                </tr>
            `;

            return;
        }

        tableBody.innerHTML =
            rows.map(function (row) {

                return renderRow(row);

            }).join("");
    }


    function renderRow(row) {

        const request =
            row.request || {};

        const payment =
            row.payment || {};

        const user =
            getUserDisplay(row);

        const status =
            normalizeStatus(
                request.status
            );

        const hasProof =
            Boolean(
                payment.payment_proof_url
            );

        const statusClass =
            status === "approved"
                ? "status-approved"
                : status === "rejected"
                    ? "status-rejected"
                    : "status-pending";

        const proofButton =
            hasProof
                ? `
                    <button
                        type="button"
                        class="action-btn proof"
                        data-action="proof"
                        data-id="${escapeHtml(request.id)}"
                    >
                        Lihat Bukti
                    </button>
                `
                : `
                    <span
                        style="color:#6f7b8d;font-size:11px;"
                    >
                        Tidak ada
                    </span>
                `;

        let actionButtons = "";

        if (status === "pending") {

            actionButtons = `
                <button
                    type="button"
                    class="action-btn approve"
                    data-action="approve"
                    data-id="${escapeHtml(request.id)}"
                >
                    Approve
                </button>

                <button
                    type="button"
                    class="action-btn reject"
                    data-action="reject"
                    data-id="${escapeHtml(request.id)}"
                >
                    Reject
                </button>
            `;

        } else {

            actionButtons = `
                <span
                    style="
                        color:#6f7b8d;
                        font-size:11px;
                    "
                >
                    Selesai
                </span>
            `;
        }

        return `
            <tr>

                <td>
                    <div class="user-name">
                        ${escapeHtml(user.name)}
                    </div>

                    <div class="user-email">
                        ${escapeHtml(user.email)}
                    </div>
                </td>

                <td>
                    <div class="package-name">
                        ${escapeHtml(
                            request.package_name || "-"
                        )}
                    </div>
                </td>

                <td>
                    <span class="credit">
                        ${formatNumber(
                            request.credits
                        )}
                    </span>
                </td>

                <td>
                    <span class="amount">
                        ${formatCurrency(
                            request.amount
                        )}
                    </span>
                </td>

                <td>
                    <span class="method">
                        ${escapeHtml(
                            formatMethod(
                                payment.payment_method
                            )
                        )}
                    </span>
                </td>

                <td>
                    ${proofButton}
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${escapeHtml(
                            status || "pending"
                        )}
                    </span>
                </td>

                <td>
                    <div class="actions">
                        ${actionButtons}
                    </div>
                </td>

            </tr>
        `;
    }


    /* =========================================================
       SIGNED URL
    ========================================================= */

    async function createProofSignedUrl(
        proofPath
    ) {

        if (!proofPath) {
            throw new Error(
                "Path bukti pembayaran tidak tersedia."
            );
        }

        /*
         * payment_proof_url pada sistem kita
         * sebenarnya menyimpan PATH Storage,
         * bukan public URL.
         */

        let cleanPath =
            String(proofPath).trim();

        /*
         * Jika suatu saat database berisi URL
         * penuh, coba ambil path setelah
         * /object/(sign|public)/bucket/
         */

        if (
            cleanPath.startsWith("http://") ||
            cleanPath.startsWith("https://")
        ) {

            const marker =
                "/storage/v1/object/";

            const markerIndex =
                cleanPath.indexOf(marker);

            if (markerIndex >= 0) {

                let storagePath =
                    cleanPath.slice(
                        markerIndex + marker.length
                    );

                storagePath =
                    storagePath.replace(
                        /^sign\/[^/]+\//,
                        ""
                    );

                storagePath =
                    storagePath.replace(
                        /^public\/[^/]+\//,
                        ""
                    );

                cleanPath =
                    storagePath;
            }
        }

        const {
            data,
            error
        } = await supabaseClient
            .storage
            .from(STORAGE_BUCKET)
            .createSignedUrl(
                cleanPath,
                SIGNED_URL_EXPIRE_SECONDS
            );

        if (error) {
            throw error;
        }

        if (
            !data ||
            !data.signedUrl
        ) {
            throw new Error(
                "Signed URL bukti pembayaran tidak berhasil dibuat."
            );
        }

        return data.signedUrl;
    }


    /* =========================================================
       SHOW PROOF
    ========================================================= */

    async function showProof(row) {

        const payment =
            row.payment || {};

        const request =
            row.request || {};

        const user =
            getUserDisplay(row);

        if (
            !payment.payment_proof_url
        ) {

            showToast(
                "Bukti pembayaran belum tersedia.",
                "error"
            );

            return;
        }

        proofModalTitle.textContent =
            "Bukti Pembayaran";

        proofUser.textContent =
            user.name +
            " • " +
            user.email;

        proofPackage.textContent =
            request.package_name || "-";

        proofCredit.textContent =
            formatNumber(
                request.credits
            ) +
            " credit";

        proofMethod.textContent =
            formatMethod(
                payment.payment_method
            );

        proofImageWrap.innerHTML = `
            <div class="loading">
                Membuat akses aman ke bukti pembayaran...
            </div>
        `;

        openProofModal();

        try {

            const signedUrl =
                await createProofSignedUrl(
                    payment.payment_proof_url
                );

            proofImageWrap.innerHTML = "";

            const image =
                document.createElement("img");

            image.className =
                "proof-image";

            image.alt =
                "Bukti pembayaran";

            image.src =
                signedUrl;

            image.addEventListener(
                "error",
                function () {

                    proofImageWrap.innerHTML = `
                        <div class="proof-error">
                            Bukti pembayaran tidak dapat ditampilkan.
                        </div>
                    `;
                }
            );

            proofImageWrap.appendChild(
                image
            );

        } catch (error) {

            console.error(
                "Gagal membuka bukti:",
                error
            );

            proofImageWrap.innerHTML = `
                <div class="proof-error">
                    Gagal membuka bukti pembayaran.<br><br>
                    ${escapeHtml(
                        error.message ||
                        "Storage error"
                    )}
                </div>
            `;

            showToast(
                "Bukti pembayaran gagal dibuka.",
                "error"
            );
        }
    }


    /* =========================================================
       MODAL
    ========================================================= */

    function openProofModal() {

        proofModal.classList.add("show");

        proofModal.setAttribute(
            "aria-hidden",
            "false"
        );
    }


    function closeProofModal() {

        proofModal.classList.remove("show");

        proofModal.setAttribute(
            "aria-hidden",
            "true"
        );

        proofImageWrap.innerHTML = "";
    }


    /* =========================================================
       APPROVAL
       ---------------------------------------------------------
       Tetap memakai RPC yang sudah berhasil.
    ========================================================= */

    async function approveTopup(
        topupId
    ) {

        if (isProcessing) {
            return false;
        }

        const row =
            allRows.find(function (item) {

                return (
                    item.request &&
                    item.request.id === topupId
                );

            });

        if (!row) {

            showToast(
                "Data top up tidak ditemukan.",
                "error"
            );

            return false;
        }

        const request =
            row.request;

        if (
            normalizeStatus(
                request.status
            ) !== "pending"
        ) {

            showToast(
                "Top up ini sudah diproses.",
                "error"
            );

            return false;
        }

        const confirmed =
            window.confirm(
                "Approve top up " +
                formatNumber(request.credits) +
                " credit untuk user ini?"
            );

        if (!confirmed) {
            return false;
        }

        isProcessing = true;

        try {

            const {
                data,
                error
            } = await supabaseClient.rpc(
                "approve_topup",
                {
                    p_topup_id: topupId
                }
            );

            if (error) {
                throw error;
            }

            if (
                data &&
                typeof data === "object" &&
                data.success === false
            ) {

                throw new Error(
                    data.message ||
                    "Approval gagal."
                );
            }

            showToast(
                "Top up berhasil disetujui dan credit telah ditambahkan.",
                "success"
            );

            await loadData();

            return true;

        } catch (error) {

            console.error(
                "approve_topup error:",
                error
            );

            showToast(
                error.message ||
                "Gagal menyetujui top up.",
                "error"
            );

            return false;

        } finally {

            isProcessing = false;
        }
    }


    /* =========================================================
       REJECT
       ---------------------------------------------------------
       Reject tidak menggunakan approve_topup.
       Hanya mengubah status request.
    ========================================================= */

    async function rejectTopup(
        topupId
    ) {

        if (isProcessing) {
            return false;
        }

        const row =
            allRows.find(function (item) {

                return (
                    item.request &&
                    item.request.id === topupId
                );

            });

        if (!row) {

            showToast(
                "Data top up tidak ditemukan.",
                "error"
            );

            return false;
        }

        if (
            normalizeStatus(
                row.request.status
            ) !== "pending"
        ) {

            showToast(
                "Top up ini sudah diproses.",
                "error"
            );

            return false;
        }

        const confirmed =
            window.confirm(
                "Tolak pembayaran top up ini?"
            );

        if (!confirmed) {
            return false;
        }

        isProcessing = true;

        try {

            const {
                error
            } = await supabaseClient
                .from("topup_requests")
                .update({
                    status: "rejected"
                })
                .eq(
                    "id",
                    topupId
                )
                .eq(
                    "status",
                    "pending"
                );

            if (error) {
                throw error;
            }

            showToast(
                "Top up berhasil ditolak.",
                "success"
            );

            await loadData();

            return true;

        } catch (error) {

            console.error(
                "rejectTopup error:",
                error
            );

            showToast(
                error.message ||
                "Gagal menolak top up.",
                "error"
            );

            return false;

        } finally {

            isProcessing = false;
        }
    }


    /* =========================================================
       EVENT TABLE
    ========================================================= */

    tableBody.addEventListener(
        "click",
        async function (event) {

            const button =
                event.target.closest(
                    "[data-action]"
                );

            if (!button) {
                return;
            }

            const action =
                button.dataset.action;

            const id =
                button.dataset.id;

            if (!id) {
                return;
            }

            const row =
                allRows.find(function (item) {

                    return (
                        item.request &&
                        item.request.id === id
                    );

                });

            if (!row) {

                showToast(
                    "Data tidak ditemukan.",
                    "error"
                );

                return;
            }

            if (action === "proof") {

                await showProof(row);

                return;
            }

            if (action === "approve") {

                await approveTopup(id);

                return;
            }

            if (action === "reject") {

                await rejectTopup(id);

                return;
            }
        }
    );


    /* =========================================================
       LOAD DATA
    ========================================================= */

    async function loadData() {

        if (isLoading) {
            return;
        }

        isLoading = true;

        tableBody.innerHTML = `
            <tr>
                <td colspan="8">
                    <div class="loading">
                        Memuat data pembayaran...
                    </div>
                </td>
            </tr>
        `;

        try {

            allRows =
                await loadAllPayments();

            renderStats(
                allRows
            );

            applyFilters();

        } catch (error) {

            console.error(
                "Payment review load error:",
                error
            );

            tableBody.innerHTML = `
                <tr>
                    <td colspan="8">
                        <div class="empty">
                            Gagal memuat data pembayaran.<br><br>
                            ${escapeHtml(
                                error.message ||
                                "Unknown error"
                            )}
                        </div>
                    </td>
                </tr>
            `;

            showToast(
                "Gagal memuat data pembayaran.",
                "error"
            );

        } finally {

            isLoading = false;
        }
    }


    /* =========================================================
       FILTER EVENTS
    ========================================================= */

    searchInput.addEventListener(
        "input",
        function () {
            applyFilters();
        }
    );


    statusFilter.addEventListener(
        "change",
        function () {
            applyFilters();
        }
    );


    /* =========================================================
       REFRESH
    ========================================================= */

    refreshBtn.addEventListener(
        "click",
        async function () {

            if (isLoading) {
                return;
            }

            await loadData();
        }
    );


    /* =========================================================
       BACK
    ========================================================= */

    backBtn.addEventListener(
        "click",
        function () {

            window.location.href =
                "./index.html";
        }
    );


    /* =========================================================
       MODAL EVENTS
    ========================================================= */

    proofModalClose.addEventListener(
        "click",
        function () {
            closeProofModal();
        }
    );


    proofModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                proofModal
            ) {
                closeProofModal();
            }
        }
    );


    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape"
            ) {
                closeProofModal();
            }
        }
    );


    /* =========================================================
       INIT
    ========================================================= */

    async function init() {

        try {

            supabaseClient =
                getSupabaseClient();

            if (!supabaseClient) {

                throw new Error(
                    "Supabase client tidak ditemukan."
                );
            }

            window.supabaseClient =
                supabaseClient;

            window.GENZ_SUPABASE =
                supabaseClient;

            await loadCurrentUser();

            await verifyAdminAccess();

            await loadData();

        } catch (error) {

            console.error(
                "Payment Review init error:",
                error
            );

            tableBody.innerHTML = `
                <tr>
                    <td colspan="8">
                        <div class="empty">
                            Halaman Payment Review tidak dapat dibuka.<br><br>
                            ${escapeHtml(
                                error.message ||
                                "Unknown error"
                            )}
                        </div>
                    </td>
                </tr>
            `;

            showToast(
                error.message ||
                "Gagal membuka Payment Review.",
                "error"
            );
        }
    }


    /* =========================================================
       PUBLIC API
    ========================================================= */

    window.GENZ_PAYMENT_REVIEW = {
        load: loadData,
        approve: approveTopup,
        reject: rejectTopup,
        showProof: showProof
    };


    init();

})();
</script>
