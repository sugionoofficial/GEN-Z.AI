<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit - GEN-Z.AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e9edf2);
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            padding: 22px 16px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .brand-sub {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .nav a {
            text-decoration: none;
            color: #374151;
            padding: 12px 13px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover {
            background: #f3f4f6;
        }

        .nav a.active {
            background: #111827;
            color: #fff;
        }

        .logout {
            margin-top: 25px;
            width: 100%;
            border: 0;
            background: #f3f4f6;
            color: #111827;
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .page-subtitle {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .user-info {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
        }

        .stat-label {
            color: #6b7280;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
        }

        .card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .card-title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .card-subtitle {
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-dark {
            background: #111827;
            color: #fff;
        }

        .btn-add {
            background: #dcfce7;
            color: #166534;
        }

        .btn-remove {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .message {
            margin: 18px 20px 0;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #eef0f3;
            font-size: 13px;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 11px;
            letter-spacing: .5px;
            font-weight: 800;
        }

        tr:hover td {
            background: #fafafa;
        }

        .credit {
            font-weight: 800;
            font-size: 15px;
        }

        .role {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #f3f4f6;
            font-size: 10px;
            font-weight: 800;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.suspended {
            background: #fef3c7;
            color: #92400e;
        }

        .status.banned {
            background: #fee2e2;
            color: #991b1b;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: #6b7280;
        }

        .empty strong {
            display: block;
            color: #111827;
            margin-bottom: 8px;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #e5e7eb;
            }

            .layout {
                display: block;
            }

            .nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">GEN-Z.AI</div>

        <div class="brand-sub">
            ADMIN CONTROL
        </div>

        <nav class="nav">

            <a href="admin-panel.html">
                DASHBOARD
            </a>

            <a href="../generate/index.html">
                GENERATE
            </a>

            <a href="../history/index.html">
                HISTORY
            </a>

        </nav>

        <button
            class="logout"
            onclick="logout()"
        >
            LOG OUT
        </button>

    </aside>

    <main class="main">

        <div class="topbar">

            <div>

                <h1 class="page-title">
                    CREDIT MANAGEMENT
                </h1>

                <div class="page-subtitle">
                    Kelola saldo kredit pengguna GEN-Z.AI
                </div>

            </div>

            <div
                class="user-info"
                id="userInfo"
            >
                Memuat...
            </div>

        </div>

        <div class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    TOTAL USERS
                </div>

                <div
                    class="stat-value"
                    id="totalUsers"
                >
                    0
                </div>

            </div>

            <div class="stat-card">

                <div class="stat-label">
                    TOTAL CREDIT
                </div>

                <div
                    class="stat-value"
                    id="totalCredits"
                >
                    0
                </div>

            </div>

        </div>

        <section class="card">

            <div class="card-header">

                <div>

                    <h2 class="card-title">
                        USER CREDIT
                    </h2>

                    <div class="card-subtitle">
                        Tambah atau kurangi kredit pengguna.
                    </div>

                </div>

                <button
                    class="btn btn-dark"
                    id="refreshButton"
                    onclick="loadCredit()"
                >
                    REFRESH
                </button>

            </div>

            <div
                id="message"
                class="message"
            ></div>

            <div id="creditContainer">

                <div class="loading">
                    Memuat data kredit...
                </div>

            </div>

        </section>

    </main>

</div>

<script>

const supabaseClient = supabase.createClient(
    GENZ_CONFIG.SUPABASE_URL,
    GENZ_CONFIG.SUPABASE_KEY
);

let currentUser = null;

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}

function clearMessage() {

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className =
        "message";

}

async function checkAuth() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (
        !session ||
        !session.user
    ) {

        window.location.href =
            "../index.html";

        return false;
    }

    currentUser =
        session.user;

    const {
        data: profile,
        error
    } = await supabaseClient
        .from("profiles")
        .select(
            "id,email,name,role,status,credits"
        )
        .eq(
            "id",
            currentUser.id
        )
        .single();

    if (
        error ||
        !profile
    ) {

        await supabaseClient.auth.signOut();

        window.location.href =
            "../index.html";

        return false;
    }

    if (
        !["ADMIN", "OWNER"].includes(
            profile.role
        ) ||
        profile.status !== "active"
    ) {

        window.location.href =
            "../user/dashboard.html";

        return false;
    }

    document.getElementById(
        "userInfo"
    ).textContent =
        profile.email +
        " • " +
        profile.role;

    return true;
}

async function loadCredit() {

    clearMessage();

    const container =
        document.getElementById(
            "creditContainer"
        );

    const refreshButton =
        document.getElementById(
            "refreshButton"
        );

    container.innerHTML = `
        <div class="loading">
            Memuat data kredit...
        </div>
    `;

    refreshButton.disabled = true;

    refreshButton.textContent =
        "LOADING...";

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(
                "id,email,name,role,credits,status"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

        if (error) {

            throw error;

        }

        const users =
            data || [];

        const totalUsers =
            users.length;

        const totalCredits =
            users.reduce(
                (total, user) =>
                    total +
                    Number(
                        user.credits || 0
                    ),
                0
            );

        document.getElementById(
            "totalUsers"
        ).textContent =
            totalUsers.toLocaleString(
                "id-ID"
            );

        document.getElementById(
            "totalCredits"
        ).textContent =
            totalCredits.toLocaleString(
                "id-ID"
            );

        if (users.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <strong>
                        BELUM ADA USER
                    </strong>

                    <span>
                        Belum ada data pengguna.
                    </span>

                </div>
            `;

            return;
        }

        let html = `
            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>EMAIL</th>
                            <th>NAMA</th>
                            <th>ROLE</th>
                            <th>CREDIT</th>
                            <th>STATUS</th>
                            <th>ACTION</th>
                        </tr>

                    </thead>

                    <tbody>
        `;

        users.forEach(user => {

            const status =
                String(
                    user.status ||
                    "active"
                ).toLowerCase();

            html += `
                <tr>

                    <td>
                        ${escapeHtml(
                            user.email || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            user.name || "-"
                        )}
                    </td>

                    <td>

                        <span class="role">

                            ${escapeHtml(
                                user.role || "USER"
                            )}

                        </span>

                    </td>

                    <td>

                        <span class="credit">

                            ${Number(
                                user.credits || 0
                            ).toLocaleString(
                                "id-ID"
                            )}

                        </span>

                    </td>

                    <td>

                        <span
                            class="status ${status}"
                        >

                            ${escapeHtml(
                                status
                            )}

                        </span>

                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="btn btn-add"
                                onclick="addCredit('${user.id}')"
                            >
                                + CREDIT
                            </button>

                            <button
                                class="btn btn-remove"
                                onclick="removeCredit('${user.id}')"
                            >
                                - CREDIT
                            </button>

                        </div>

                    </td>

                </tr>
            `;

        });

        html += `
                    </tbody>

                </table>

            </div>
        `;

        container.innerHTML =
            html;

    } catch (error) {

        console.error(
            "CREDIT ERROR:",
            error
        );

        container.innerHTML = `
            <div class="empty">

                <strong>
                    GAGAL MEMUAT CREDIT
                </strong>

                <span>
                    ${escapeHtml(
                        error.message ||
                        "Terjadi kesalahan."
                    )}
                </span>

            </div>
        `;

        showMessage(
            "Gagal mengambil data kredit dari database.",
            "error"
        );

    } finally {

        refreshButton.disabled =
            false;

        refreshButton.textContent =
            "REFRESH";

    }

}

async function addCredit(userId) {

    const value =
        window.prompt(
            "Masukkan jumlah kredit yang ingin ditambahkan:"
        );

    if (
        value === null ||
        value.trim() === ""
    ) {

        return;
    }

    const amount =
        Number(value);

    if (
        !Number.isInteger(amount) ||
        amount <= 0
    ) {

        showMessage(
            "Jumlah kredit harus berupa angka bulat lebih dari 0.",
            "error"
        );

        return;
    }

    clearMessage();

    try {

        const {
            error
        } = await supabaseClient
            .rpc(
                "add_credit",
                {
                    p_user_id: userId,
                    p_amount: amount,
                    p_type: "admin_add",
                    p_description:
                        "Penambahan kredit oleh admin GEN-Z.AI"
                }
            );

        if (error) {

            throw error;

        }

        showMessage(
            "Kredit berhasil ditambahkan.",
            "success"
        );

        await loadCredit();

    } catch (error) {

        console.error(
            "ADD CREDIT ERROR:",
            error
        );

        showMessage(
            "Gagal menambahkan kredit: " +
            (
                error.message ||
                "Terjadi kesalahan."
            ),
            "error"
        );

    }

}

async function removeCredit(userId) {

    const value =
        window.prompt(
            "Masukkan jumlah kredit yang ingin dikurangi:"
        );

    if (
        value === null ||
        value.trim() === ""
    ) {

        return;
    }

    const amount =
        Number(value);

    if (
        !Number.isInteger(amount) ||
        amount <= 0
    ) {

        showMessage(
            "Jumlah kredit harus berupa angka bulat lebih dari 0.",
            "error"
        );

        return;
    }

    clearMessage();

    try {

        const {
            error
        } = await supabaseClient
            .rpc(
                "admin_remove_credit",
                {
                    p_user_id: userId,
                    p_amount: amount,
                    p_description:
                        "Pengurangan kredit oleh admin GEN-Z.AI"
                }
            );

        if (error) {

            throw error;

        }

        showMessage(
            "Kredit berhasil dikurangi.",
            "success"
        );

        await loadCredit();

    } catch (error) {

        console.error(
            "REMOVE CREDIT ERROR:",
            error
        );

        showMessage(
            "Gagal mengurangi kredit: " +
            (
                error.message ||
                "Terjadi kesalahan."
            ),
            "error"
        );

    }

}

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "../index.html";

}

async function init() {

    const authenticated =
        await checkAuth();

    if (!authenticated) {

        return;

    }

    await loadCredit();

}

init();

</script>

</body>
</html>
