<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Models - GEN-Z.AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #e7e7e7;
            --bg-white: #ffffff;
            --bg-dark: #111111;
            --bg-dark-2: #181818;

            --text-main: #171717;
            --text-muted: #777777;
            --text-light: #ffffff;

            --border: rgba(0, 0, 0, 0.08);

            --red: #ff0033;
            --red-dark: #c90028;
            --red-light: #ff3157;

            --green: #18a957;
            --yellow: #e0a800;

            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --red-glow:
                0 0 4px rgba(255, 0, 51, 0.95),
                0 0 12px rgba(255, 0, 51, 0.65),
                0 0 25px rgba(255, 0, 51, 0.30);
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #d7d7d7 0%,
                    #eeeeee 42%,
                    #ffffff 100%
                );

            color: var(--text-main);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================================================
           LAYOUT
           ========================================================= */

        .admin-layout {
            min-height: 100vh;
            display: flex;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */

        .sidebar {
            width: 250px;
            min-width: 250px;
            min-height: 100vh;

            background:
                linear-gradient(
                    180deg,
                    #0c0c0c 0%,
                    #151515 50%,
                    #0b0b0b 100%
                );

            color: #ffffff;

            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;

            z-index: 100;

            display: flex;
            flex-direction: column;

            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-logo {
            height: 80px;

            display: flex;
            align-items: center;

            padding: 0 24px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-logo strong {
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .sidebar-logo span {
            color: var(--red);
        }

        .sidebar-nav {
            padding: 18px 12px;
            flex: 1;
        }

        .nav-section-title {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666666;

            padding: 12px 12px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;

            width: 100%;

            padding: 12px 14px;
            margin-bottom: 5px;

            color: #aaaaaa;
            text-decoration: none;

            border-radius: 10px;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            transform: translateX(2px);
        }

        .nav-item.active {
            background:
                linear-gradient(
                    90deg,
                    rgba(255, 0, 51, 0.20),
                    rgba(255, 0, 51, 0.05)
                );

            color: #ffffff;

            border-left: 3px solid var(--red);

            box-shadow:
                inset 0 0 15px rgba(255, 0, 51, 0.05);
        }

        .nav-icon {
            width: 22px;
            min-width: 22px;

            text-align: center;

            font-size: 16px;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logout-btn {
            width: 100%;

            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);

            color: #bbbbbb;

            padding: 11px 14px;
            border-radius: 9px;

            font-size: 13px;
            font-weight: 700;

            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 0, 51, 0.12);
            border-color: rgba(255, 0, 51, 0.35);
            color: #ffffff;
        }

        /* =========================================================
           MAIN
           ========================================================= */

        .main-content {
            margin-left: 250px;
            width: calc(100% - 250px);
            min-height: 100vh;

            padding: 28px;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;
        }

        .page-title h1 {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.7px;

            margin-bottom: 6px;
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* =========================================================
           BUTTONS
           ========================================================= */

        .btn {
            border: 0;
            border-radius: 9px;

            padding: 10px 16px;

            font-size: 13px;
            font-weight: 800;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--red);
            color: #ffffff;

            box-shadow:
                0 5px 16px rgba(255, 0, 51, 0.20);
        }

        .btn-primary:hover {
            background: var(--red-dark);

            box-shadow:
                0 7px 22px rgba(255, 0, 51, 0.30);
        }

        .btn-secondary {
            background: #ffffff;
            color: #333333;

            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        /* =========================================================
           STATS
           ========================================================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 22px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.90);

            border: 1px solid rgba(0, 0, 0, 0.06);

            border-radius: 14px;

            padding: 18px;

            box-shadow: var(--shadow);
        }

        .stat-label {
            color: #777777;
            font-size: 11px;

            text-transform: uppercase;
            letter-spacing: 1px;

            font-weight: 800;

            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 900;

            line-height: 1;
        }

        .stat-value.red {
            color: var(--red);
        }

        .stat-value.green {
            color: var(--green);
        }

        /* =========================================================
           TOOLBAR
           ========================================================= */

        .toolbar {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;

            height: 44px;

            padding:
                0 14px 0 42px;

            border:
                1px solid rgba(0, 0, 0, 0.10);

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.95);

            outline: none;

            color: #222222;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-box input:focus {
            border-color: rgba(255, 0, 51, 0.45);

            box-shadow:
                0 0 0 3px rgba(255, 0, 51, 0.08);
        }

        .search-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            color: #888888;

            font-size: 16px;
        }

        .filter-select {
            height: 44px;

            min-width: 150px;

            padding: 0 35px 0 13px;

            border:
                1px solid rgba(0, 0, 0, 0.10);

            border-radius: 10px;

            background: #ffffff;

            color: #333333;

            outline: none;

            font-size: 13px;
            font-weight: 600;
        }

        /* =========================================================
           MODELS AREA
           ========================================================= */

        .models-wrapper {
            width: 100%;
        }

        .models-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(330px, 1fr)
                );

            gap: 20px;

            width: 100%;
        }

        /* =========================================================
           MODEL CARD
           ========================================================= */

        .model-card {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #f2f2f2 55%,
                    #ffffff 100%
                );

            border: 2px solid var(--red);

            border-radius: 18px;

            padding: 20px;

            box-shadow: var(--red-glow);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .model-card::before {
            content: "";

            position: absolute;

            top: -80px;
            right: -80px;

            width: 170px;
            height: 170px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 0, 51, 0.12),
                    transparent 70%
                );

            pointer-events: none;
        }

        .model-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 0 5px rgba(255, 0, 51, 1),
                0 0 16px rgba(255, 0, 51, 0.75),
                0 0 32px rgba(255, 0, 51, 0.35);
        }

        .model-card-header {
            position: relative;

            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 18px;
        }

        .model-title-wrap {
            min-width: 0;
        }

        .model-name {
            font-size: 18px;
            font-weight: 900;

            line-height: 1.25;

            color: #111111;

            margin-bottom: 7px;

            word-break: break-word;
        }

        .model-id {
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 11px;

            color: #777777;

            word-break: break-all;
        }

        /* =========================================================
           STATUS
           ========================================================= */

        .status-badge {
            flex-shrink: 0;

            display: inline-flex;
            align-items: center;

            gap: 6px;

            padding: 6px 9px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 900;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge::before {
            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;
        }

        .status-active {
            background: rgba(24, 169, 87, 0.10);
            color: #118044;
        }

        .status-active::before {
            background: #18a957;

            box-shadow:
                0 0 7px rgba(24, 169, 87, 0.70);
        }

        .status-inactive {
            background: rgba(100, 100, 100, 0.10);
            color: #777777;
        }

        .status-inactive::before {
            background: #999999;
        }

        /* =========================================================
           PROVIDER
           ========================================================= */

        .model-provider {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 10px 12px;

            background: rgba(0, 0, 0, 0.035);

            border-radius: 9px;

            margin-bottom: 14px;
        }

        .provider-label {
            color: #888888;
            font-size: 11px;
            font-weight: 700;
        }

        .provider-name {
            color: #222222;
            font-size: 12px;
            font-weight: 900;
        }

        /* =========================================================
           DESCRIPTION
           ========================================================= */

        .model-description {
            color: #666666;

            font-size: 12px;

            line-height: 1.55;

            min-height: 38px;

            margin-bottom: 15px;
        }

        /* =========================================================
           PRICING
           ========================================================= */

        .pricing-box {
            background: #ffffff;

            border:
                1px solid rgba(255, 0, 51, 0.15);

            border-radius: 12px;

            padding: 13px;

            margin-bottom: 15px;
        }

        .pricing-title {
            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;

            font-weight: 900;

            color: #999999;

            margin-bottom: 10px;
        }

        .pricing-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 6px;

            font-size: 12px;
        }

        .pricing-row:last-child {
            margin-bottom: 0;
        }

        .pricing-label {
            color: #777777;
        }

        .pricing-value {
            color: #222222;

            font-weight: 800;

            text-align: right;
        }

        .pricing-final {
            color: var(--red);

            font-size: 15px;

            font-weight: 900;
        }

        .discount-value {
            color: var(--green);

            font-weight: 900;
        }

        /* =========================================================
           PARAMETERS
           ========================================================= */

        .parameters-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 8px;

            margin-bottom: 16px;
        }

        .parameter-item {
            background:
                rgba(0, 0, 0, 0.035);

            border-radius: 9px;

            padding: 10px 8px;

            text-align: center;

            min-width: 0;
        }

        .parameter-label {
            display: block;

            color: #999999;

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            font-weight: 800;

            margin-bottom: 5px;
        }

        .parameter-value {
            display: block;

            color: #222222;

            font-size: 11px;

            font-weight: 900;

            overflow-wrap: anywhere;
        }

        /* =========================================================
           ACTIONS
           ========================================================= */

        .model-actions {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding-top: 3px;
        }

        .model-actions .btn {
            min-width: 82px;
        }

        /* =========================================================
           EMPTY / LOADING / ERROR
           ========================================================= */

        .models-empty {
            grid-column: 1 / -1;

            padding: 60px 25px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.82);

            border:
                1px dashed rgba(0, 0, 0, 0.15);

            border-radius: 16px;
        }

        .models-empty-icon {
            font-size: 38px;

            margin-bottom: 13px;
        }

        .models-empty-title {
            font-size: 17px;

            font-weight: 900;

            margin-bottom: 6px;
        }

        .models-empty-text {
            color: #777777;

            font-size: 13px;
        }

        /* =========================================================
           TOAST
           ========================================================= */

        .toast-container {
            position: fixed;

            right: 22px;
            bottom: 22px;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .toast {
            min-width: 280px;
            max-width: 390px;

            background: #171717;

            color: #ffffff;

            border-radius: 11px;

            padding: 13px 16px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.25);

            font-size: 13px;

            animation:
                toastIn 0.25s ease;
        }

        .toast.success {
            border-left: 4px solid var(--green);
        }

        .toast.error {
            border-left: 4px solid var(--red);
        }

        .toast.warning {
            border-left: 4px solid var(--yellow);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           LOADING OVERLAY
           ========================================================= */

        .page-loading {
            position: fixed;

            inset: 0;

            background:
                rgba(255, 255, 255, 0.72);

            backdrop-filter: blur(3px);

            z-index: 9998;

            display: none;

            align-items: center;
            justify-content: center;
        }

        .page-loading.show {
            display: flex;
        }

        .loading-box {
            background: #ffffff;

            border-radius: 14px;

            padding: 22px 28px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.12);

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 13px;

            font-weight: 700;
        }

        .spinner {
            width: 20px;
            height: 20px;

            border:
                3px solid #eeeeee;

            border-top-color: var(--red);

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================================
           HIDDEN COMPATIBILITY CONTAINER
           ========================================================= */

        #modelTableBody {
            display: none !important;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 1100px) {
            .sidebar {
                width: 220px;
                min-width: 220px;
            }

            .main-content {
                margin-left: 220px;
                width: calc(100% - 220px);
            }

            .stats-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 800px) {
            .sidebar {
                position: static;

                width: 100%;
                min-width: 0;

                min-height: auto;
            }

            .admin-layout {
                display: block;
            }

            .sidebar-nav {
                display: flex;

                overflow-x: auto;

                padding: 10px;
            }

            .nav-section-title {
                display: none;
            }

            .nav-item {
                white-space: nowrap;

                width: auto;

                margin-bottom: 0;
            }

            .sidebar-footer {
                display: none;
            }

            .main-content {
                margin-left: 0;

                width: 100%;

                padding: 18px;
            }

            .page-header {
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                flex: 1;
            }
        }

        @media (max-width: 560px) {
            .main-content {
                padding: 13px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;

                gap: 9px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-value {
                font-size: 21px;
            }

            .models-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 0;
            }

            .filter-select {
                width: 100%;
            }

            .model-card {
                padding: 16px;
            }

            .page-title h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="admin-layout">

    <!-- =========================================================
         SIDEBAR
         ========================================================= -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            <strong>
                GEN-Z<span>.AI</span>
            </strong>
        </div>

        <nav class="sidebar-nav">

            <div class="nav-section-title">
                Main
            </div>

            <a
                href="./index.html"
                class="nav-item"
            >
                <span class="nav-icon">⌂</span>
                <span>Dashboard</span>
            </a>

            <a
                href="./users.html"
                class="nav-item"
            >
                <span class="nav-icon">◉</span>
                <span>Users</span>
            </a>

            <a
                href="./providers.html"
                class="nav-item"
            >
                <span class="nav-icon">◈</span>
                <span>Providers</span>
            </a>

            <a
                href="./models.html"
                class="nav-item active"
            >
                <span class="nav-icon">▣</span>
                <span>Models</span>
            </a>

            <a
                href="./credit.html"
                class="nav-item"
            >
                <span class="nav-icon">◆</span>
                <span>Credit</span>
            </a>

        </nav>

        <div class="sidebar-footer">

            <button
                type="button"
                id="logoutBtn"
                class="logout-btn"
            >
                Keluar
            </button>

        </div>

    </aside>

    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <main class="main-content">

        <!-- HEADER -->

        <header class="page-header">

            <div class="page-title">

                <h1>Models</h1>

                <p>
                    Model yang tersedia dari folder model di repository GEN-Z.AI
                </p>

            </div>

            <div class="header-actions">

                <button
                    type="button"
                    id="refreshModelsBtn"
                    class="btn btn-secondary"
                >
                    ↻ Refresh
                </button>

            </div>

        </header>


        <!-- =====================================================
             STATS
             ===================================================== -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-label">
                    Total Model
                </div>

                <div
                    id="totalModels"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Model Aktif
                </div>

                <div
                    id="activeModels"
                    class="stat-value green"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Model Nonaktif
                </div>

                <div
                    id="inactiveModels"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Provider
                </div>

                <div
                    id="totalProviders"
                    class="stat-value red"
                >
                    0
                </div>

            </div>

        </section>


        <!-- =====================================================
             SEARCH / FILTER
             ===================================================== -->

        <section class="toolbar">

            <div class="search-box">

                <span class="search-icon">
                    ⌕
                </span>

                <input
                    type="search"
                    id="modelSearch"
                    autocomplete="off"
                    placeholder="Cari model, model ID, provider..."
                >

            </div>


            <select
                id="modelStatusFilter"
                class="filter-select"
            >
                <option value="all">
                    Semua Status
                </option>

                <option value="active">
                    Aktif
                </option>

                <option value="inactive">
                    Nonaktif
                </option>
            </select>


            <select
                id="modelProviderFilter"
                class="filter-select"
            >
                <option value="all">
                    Semua Provider
                </option>
            </select>

        </section>


        <!-- =====================================================

<!-- =============================================================
     PAGE BOOTSTRAP
     ============================================================= -->

<script type="module">

    const sleep = (ms) =>
        new Promise(resolve => setTimeout(resolve, ms));


    function showToast(
        message,
        type = "success"
    ) {

        const container =
            document.getElementById("toastContainer");

        if (!container) {
            return;
        }

        const toast =
            document.createElement("div");

        toast.className =
            `toast ${type}`;

        toast.textContent =
            String(message || "");

        container.appendChild(toast);

        setTimeout(() => {

            toast.style.opacity = "0";

            toast.style.transform =
                "translateY(8px)";

            toast.style.transition =
                "opacity .2s ease, transform .2s ease";

            setTimeout(() => {

                toast.remove();

            }, 220);

        }, 3500);
    }


    function setLoading(show) {

        const element =
            document.getElementById("pageLoading");

        if (!element) {
            return;
        }

        element.classList.toggle(
            "show",
            Boolean(show)
        );
    }


    function updateStats(models) {

        const list =
            Array.isArray(models)
                ? models
                : [];

        const total =
            list.length;

        const active =
            list.filter(model => {

                return String(
                    model?.status || ""
                ).toLowerCase() === "active";

            }).length;

        const inactive =
            total - active;

        const providers =
            new Set(
                list
                    .map(model =>
                        String(
                            model?.provider_id ||
                            model?.providerId ||
                            model?.provider ||
                            ""
                        ).trim()
                    )
                    .filter(Boolean)
            ).size;


        const totalElement =
            document.getElementById(
                "totalModels"
            );

        const activeElement =
            document.getElementById(
                "activeModels"
            );

        const inactiveElement =
            document.getElementById(
                "inactiveModels"
            );

        const providersElement =
            document.getElementById(
                "totalProviders"
            );


        if (totalElement) {
            totalElement.textContent =
                String(total);
        }

        if (activeElement) {
            activeElement.textContent =
                String(active);
        }

        if (inactiveElement) {
            inactiveElement.textContent =
                String(inactive);
        }

        if (providersElement) {
            providersElement.textContent =
                String(providers);
        }
    }


    async function waitForModules() {

        const maxAttempts = 100;

        for (
            let attempt = 0;
            attempt < maxAttempts;
            attempt++
        ) {

            if (
                window.GENZModelsData &&
                window.GENZModelsUI
            ) {
                return true;
            }

            await sleep(50);
        }

        return false;
    }


    async function initializePage() {

        setLoading(true);

        try {

            const ready =
                await waitForModules();

            if (!ready) {

                throw new Error(
                    "Module Models GEN-Z.AI belum siap."
                );
            }


            /*
             * models-ui menjadi coordinator utama.
             * Data model tetap berasal dari model registry.
             */

            if (
                typeof window
                    .GENZModelsUI
                    .initialize === "function"
            ) {

                await window
                    .GENZModelsUI
                    .initialize();

            }
            else {

                /*
                 * Fallback apabila initialize()
                 * tidak tersedia pada modul UI.
                 */

                let models = [];

                if (
                    typeof window
                        .GENZModelsData
                        .loadModels === "function"
                ) {

                    models =
                        await window
                            .GENZModelsData
                            .loadModels({
                                force: true,
                                activeOnly: false
                            });

                }


                if (
                    window.GENZModelTable &&
                    typeof window
                        .GENZModelTable
                        .setModels === "function"
                ) {

                    window
                        .GENZModelTable
                        .setModels(models);

                }

                updateStats(models);
            }


            /*
             * Ambil data terakhir dari table module
             * untuk memastikan statistik sinkron.
             */

            if (
                window.GENZModelTable &&
                typeof window
                    .GENZModelTable
                    .getModels === "function"
            ) {

                updateStats(
                    window
                        .GENZModelTable
                        .getModels()
                );

            }

        }
        catch (error) {

            console.error(
                "[Models] initialization error:",
                error
            );

            showToast(
                error?.message ||
                "Gagal memuat model.",
                "error"
            );

        }
        finally {

            setLoading(false);
        }
    }


    /* =========================================================
       REFRESH
       ========================================================= */

    const refreshButton =
        document.getElementById(
            "refreshModelsBtn"
        );

    if (refreshButton) {

        refreshButton.addEventListener(
            "click",
            async () => {

                setLoading(true);

                try {

                    if (
                        window.GENZModelsData &&
                        typeof window
                            .GENZModelsData
                            .loadModels === "function"
                    ) {

                        const models =
                            await window
                                .GENZModelsData
                                .loadModels({
                                    force: true,
                                    activeOnly: false
                                });


                        if (
                            window.GENZModelTable &&
                            typeof window
                                .GENZModelTable
                                .setModels === "function"
                        ) {

                            window
                                .GENZModelTable
                                .setModels(models);

                        }


                        updateStats(models);


                        if (
                            window.GENZModelsUI &&
                            typeof window
                                .GENZModelsUI
                                .syncSearch === "function"
                        ) {

                            window
                                .GENZModelsUI
                                .syncSearch(models);

                        }


                        showToast(
                            `${models.length} model berhasil dimuat.`,
                            "success"
                        );

                    }
                    else {

                        await initializePage();

                    }

                }
                catch (error) {

                    console.error(
                        "[Models] refresh error:",
                        error
                    );

                    showToast(
                        error?.message ||
                        "Gagal memperbarui model.",
                        "error"
                    );

                }
                finally {

                    setLoading(false);
                }
            }
        );

    }


    /* =========================================================
       LOGOUT
       ========================================================= */

    const logoutButton =
        document.getElementById(
            "logoutBtn"
        );

    if (logoutButton) {

        logoutButton.addEventListener(
            "click",
            async () => {

                try {

                    const supabase =
                        window.supabaseClient ||
                        window.supabase ||
                        null;


                    if (
                        supabase &&
                        supabase.auth &&
                        typeof supabase
                            .auth
                            .signOut === "function"
                    ) {

                        await supabase
                            .auth
                            .signOut();

                    }

                }
                catch (error) {

                    console.error(
                        "[Models] logout error:",
                        error
                    );

                }


                window.location.href =
                    "./login.html";
            }
        );

    }


    /* =========================================================
       AUTH GUARD
       ========================================================= */

    async function checkAdminAccess() {

        /*
         * Beri waktu supabase.js membuat client.
         */

        for (
            let attempt = 0;
            attempt < 80;
            attempt++
        ) {

            const client =
                window.supabaseClient ||
                window.supabase ||
                null;

            if (
                client &&
                client.auth &&
                typeof client
                    .auth
                    .getUser === "function"
            ) {

                try {

                    const {
                        data,
                        error
                    } =
                        await client
                            .auth
                            .getUser();


                    if (error) {
                        console.warn(
                            "[Models] auth check:",
                            error
                        );
                    }


                    if (!data?.user) {

                        /*
                         * Jangan langsung redirect bila
                         * auth belum selesai diinisialisasi.
                         */

                        return true;
                    }


                    /*
                     * Role guard utama biasanya juga dilakukan
                     * oleh masing-masing halaman/module.
                     *
                     * Di sini kita hanya memastikan user
                     * sudah memiliki session.
                     */

                    return true;

                }
                catch (error) {

                    console.warn(
                        "[Models] auth check failed:",
                        error
                    );

                    return true;
                }
            }

            await sleep(50);
        }

        return true;
    }


    /* =========================================================
       START
       ========================================================= */

    (async () => {

        await checkAdminAccess();

        await initializePage();

    })();

</script>
