<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Models - GEN-Z.AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #07090d;
            --bg-soft: #0d1118;
            --bg-white: #ffffff;
            --bg-dark: #111111;
            --bg-dark-2: #181818;

            --text-main: #171717;
            --text-muted: #777777;
            --text-light: #ffffff;

            --border: rgba(0, 0, 0, 0.08);

            --red: #ff1744;
            --red-dark: #c90028;
            --red-light: #ff4567;

            --green: #18a957;
            --yellow: #e0a800;

            --shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            --red-glow:
                0 0 4px rgba(255, 23, 68, 0.95),
                0 0 12px rgba(255, 23, 68, 0.65),
                0 0 25px rgba(255, 23, 68, 0.30);
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(255, 23, 68, 0.09),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(255, 69, 103, 0.05),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(255, 23, 68, 0.04),
                    transparent 35%
                ),
                var(--bg-main);

            color: var(--text-main);

            overflow-x: hidden;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =========================================================
           MAIN
           ========================================================= */

        .main-content {
            width: min(1500px, 100%);

            min-height: 100vh;

            margin: 0 auto;

            padding:
                105px
                28px
                45px;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .page-header {
            display: flex;

            align-items: flex-start;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 25px;
        }

        .page-title h1 {
            color: #ffffff;

            font-size: 30px;
            font-weight: 900;

            letter-spacing: -0.7px;

            margin-bottom: 6px;
        }

        .page-title p {
            color: #8d96a5;

            font-size: 14px;
        }

        .header-actions {
            display: flex;

            gap: 10px;

            align-items: center;
        }

        /* =========================================================
           BUTTONS
           ========================================================= */

        .btn {
            border: 0;

            border-radius: 9px;

            padding: 10px 16px;

            font-size: 13px;
            font-weight: 800;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .btn:hover {
            transform:
                translateY(-1px);
        }

        .btn-primary {
            background:
                var(--red);

            color: #ffffff;

            box-shadow:
                0 5px 16px
                rgba(255, 23, 68, 0.20);
        }

        .btn-primary:hover {
            background:
                var(--red-dark);

            box-shadow:
                0 7px 22px
                rgba(255, 23, 68, 0.30);
        }

        .btn-secondary {
            background:
                rgba(255, 255, 255, 0.95);

            color: #333333;

            border:
                1px solid
                rgba(0, 0, 0, 0.10);
        }

        .btn-secondary:hover {
            background:
                #ffffff;

            box-shadow:
                0 7px 22px
                rgba(255, 23, 68, 0.12);
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
        }

        /* =========================================================
           STATS
           ========================================================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 15px;

            margin-bottom: 22px;
        }

        .stat-card {
            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #f1f1f1 60%,
                    #ffffff 100%
                );

            border:
                1px solid
                rgba(255, 23, 68, 0.18);

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                var(--shadow);
        }

        .stat-label {
            color: #777777;

            font-size: 11px;

            text-transform:
                uppercase;

            letter-spacing: 1px;

            font-weight: 800;

            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 26px;

            font-weight: 900;

            line-height: 1;
        }

        .stat-value.red {
            color: var(--red);
        }

        .stat-value.green {
            color: var(--green);
        }

        /* =========================================================
           TOOLBAR
           ========================================================= */

        .toolbar {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .search-box {
            position: relative;

            flex: 1;

            min-width: 240px;
        }

        .search-box input {
            width: 100%;

            height: 44px;

            padding:
                0 14px 0 42px;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.96);

            outline: none;

            color: #222222;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search-box input:focus {
            border-color:
                rgba(255, 23, 68, 0.55);

            box-shadow:
                0 0 0 3px
                rgba(255, 23, 68, 0.10);
        }

        .search-icon {
            position: absolute;

            left: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #888888;

            font-size: 16px;

            pointer-events: none;
        }

        .filter-select {
            height: 44px;

            min-width: 150px;

            padding:
                0 35px 0 13px;

            border:
                1px solid
                rgba(0, 0, 0, 0.10);

            border-radius: 10px;

            background:
                #ffffff;

            color: #333333;

            outline: none;

            font-size: 13px;
            font-weight: 600;
        }

        .filter-select:focus {
            border-color:
                rgba(255, 23, 68, 0.45);

            box-shadow:
                0 0 0 3px
                rgba(255, 23, 68, 0.08);
        }

        /* =========================================================
           MODELS AREA
           ========================================================= */

        .models-wrapper {
            width: 100%;
        }

        .models-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(330px, 1fr)
                );

            gap: 20px;

            width: 100%;
        }

        /* =========================================================
           MODEL CARD
           ========================================================= */

        .model-card {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #f2f2f2 55%,
                    #ffffff 100%
                );

            border:
                2px solid
                var(--red);

            border-radius: 18px;

            padding: 20px;

            box-shadow:
                var(--red-glow);

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .model-card::before {
            content: "";

            position: absolute;

            top: -80px;
            right: -80px;

            width: 170px;
            height: 170px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 23, 68, 0.12),
                    transparent 70%
                );

            pointer-events: none;
        }

        .model-card:hover {
            transform:
                translateY(-4px);

            box-shadow:
                0 0 5px
                rgba(255, 23, 68, 1),

                0 0 16px
                rgba(255, 23, 68, 0.75),

                0 0 32px
                rgba(255, 23, 68, 0.35);
        }

        .model-top {
            position: relative;

            display: flex;

            align-items: flex-start;

            gap: 12px;

            margin-bottom: 18px;
        }

        .model-icon {
            width: 44px;
            height: 44px;

            min-width: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #111111,
                    #2b2b2b
                );

            color: var(--red);

            border:
                1px solid
                rgba(255, 23, 68, 0.35);

            box-shadow:
                0 0 12px
                rgba(255, 23, 68, 0.20);

            font-size: 17px;
        }

        .model-title {
            min-width: 0;
            flex: 1;
        }

        .model-name {
            font-size: 18px;

            font-weight: 900;

            line-height: 1.25;

            color: #111111;

            margin-bottom: 7px;

            word-break: break-word;
        }

        .model-id {
            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 11px;

            color: #777777;

            word-break: break-all;
        }

        /* =========================================================
           PREMIUM
           ========================================================= */

        .premium-badge {
            position: absolute;

            top: 12px;
            right: 12px;

            z-index: 2;

            padding:
                5px 9px;

            border-radius: 999px;

            background:
                rgba(255, 23, 68, 0.08);

            color:
                var(--red);

            border:
                1px solid
                rgba(255, 23, 68, 0.35);

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 0.8px;

            text-transform:
                uppercase;

            box-shadow:
                0 0 9px
                rgba(255, 23, 68, 0.15);
        }

        /* =========================================================
           DESCRIPTION
           ========================================================= */

        .model-description {
            color: #666666;

            font-size: 12px;

            line-height: 1.55;

            min-height: 38px;

            margin-bottom: 15px;
        }

        /* =========================================================
           META
           ========================================================= */

        .model-meta {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 8px;

            margin-bottom: 15px;
        }

        .meta-item {
            background:
                rgba(0, 0, 0, 0.035);

            border-radius: 9px;

            padding: 10px;
        }

        .meta-label {
            color: #999999;

            font-size: 9px;

            text-transform:
                uppercase;

            letter-spacing: 0.6px;

            font-weight: 800;

            margin-bottom: 4px;
        }

        .meta-value {
            color: #222222;

            font-size: 11px;

            font-weight: 900;

            overflow-wrap: anywhere;
        }

        /* =========================================================
           PRICING
           ========================================================= */

        .pricing-box {
            background:
                #ffffff;

            border:
                1px solid
                rgba(255, 23, 68, 0.15);

            border-radius: 12px;

            padding: 13px;

            margin-bottom: 15px;
        }

        .pricing-title {
            font-size: 10px;

            text-transform:
                uppercase;

            letter-spacing: 1px;

            font-weight: 900;

            color: #999999;

            margin-bottom: 10px;
        }

        .price-row {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            margin-bottom: 6px;

            font-size: 12px;
        }

        .price-row:last-child {
            margin-bottom: 0;
        }

        .price-row span {
            color: #777777;
        }

        .price-row strong {
            color: #222222;

            font-weight: 900;

            text-align: right;
        }

        .price-final {
            padding-top: 8px;

            margin-top: 8px;

            border-top:
                1px solid
                rgba(0, 0, 0, 0.06);
        }

        .price-final span {
            color: #555555;

            font-weight: 800;
        }

        .price-final strong {
            color: var(--red);

            font-size: 15px;
        }

        .discount-value {
            color:
                var(--green) !important;
        }

        /* =========================================================
           PARAMETERS
           ========================================================= */

        .parameter-section {
            margin-bottom: 13px;
        }

        .parameter-title {
            font-size: 10px;

            text-transform:
                uppercase;

            letter-spacing: 0.8px;

            color: #999999;

            font-weight: 900;

            margin-bottom: 7px;
        }

        .chips {
            display: flex;

            flex-wrap: wrap;

            gap: 6px;
        }

        .chip {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 25px;

            padding:
                5px 8px;

            border-radius: 7px;

            background:
                rgba(0, 0, 0, 0.045);

            border:
                1px solid
                rgba(0, 0, 0, 0.07);

            color: #333333;

            font-size: 10px;

            font-weight: 800;
        }

        /* =========================================================
           STATUS
           ========================================================= */

        .status-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 8px;

            margin-top: 5px;

            margin-bottom: 15px;

            flex-wrap: wrap;
        }

        .status-badge {
            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding:
                6px 9px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 900;

            text-transform:
                uppercase;

            letter-spacing: 0.5px;
        }

        .status-badge::before {
            content: "";

            width: 7px;
            height: 7px;

            border-radius: 50%;
        }

        .status-active {
            background:
                rgba(24, 169, 87, 0.10);

            color:
                #118044;
        }

        .status-active::before {
            background:
                #18a957;

            box-shadow:
                0 0 7px
                rgba(24, 169, 87, 0.70);
        }

        .status-inactive {
            background:
                rgba(100, 100, 100, 0.10);

            color:
                #777777;
        }

        .status-inactive::before {
            background:
                #999999;
        }

        .status-maintenance {
            background:
                rgba(224, 168, 0, 0.10);

            color:
                #9a7200;
        }

        .status-maintenance::before {
            background:
                #e0a800;
        }

        /* =========================================================
           ACTIONS
           ========================================================= */

        .model-actions {
            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding-top: 3px;
        }

        .model-actions .btn {
            min-width: 100px;
        }

        /* =========================================================
           EMPTY / ERROR
           ========================================================= */

        .state-panel {
            grid-column: 1 / -1;

            padding: 60px 25px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.95),
                    rgba(235, 235, 235, 0.95)
                );

            border:
                2px solid
                rgba(255, 23, 68, 0.35);

            border-radius: 16px;

            box-shadow:
                0 0 15px
                rgba(255, 23, 68, 0.10);
        }

        .state-icon {
            width: 50px;
            height: 50px;

            margin:
                0 auto 14px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                rgba(255, 23, 68, 0.06);

            color:
                var(--red);

            border:
                1px solid
                rgba(255, 23, 68, 0.25);

            font-size: 24px;

            font-weight: 900;
        }

        .state-title {
            font-size: 17px;

            font-weight: 900;

            margin-bottom: 6px;
        }

        .state-description {
            color: #777777;

            font-size: 13px;

            line-height: 1.5;
        }

        /* =========================================================
           TOAST
           ========================================================= */

        .toast-container {
            position: fixed;

            right: 22px;
            bottom: 22px;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .toast {
            min-width: 280px;
            max-width: 390px;

            background:
                #171717;

            color:
                #ffffff;

            border-radius: 11px;

            padding:
                13px 16px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.25);

            font-size: 13px;

            animation:
                toastIn 0.25s ease;
        }

        .toast.success {
            border-left:
                4px solid var(--green);
        }

        .toast.error {
            border-left:
                4px solid var(--red);
        }

        .toast.warning {
            border-left:
                4px solid var(--yellow);
        }

        @keyframes toastIn {
            from {
                opacity: 0;

                transform:
                    translateY(12px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* =========================================================
           LOADING
           ========================================================= */

        .page-loading {
            position: fixed;

            inset: 0;

            background:
                rgba(7, 9, 13, 0.58);

            backdrop-filter:
                blur(5px);

            z-index: 9998;

            display: none;

            align-items: center;
            justify-content: center;
        }

        .page-loading.show {
            display: flex;
        }

        .loading-box {
            background:
                rgba(20, 23, 30, 0.96);

            color:
                #ffffff;

            border:
                1px solid
                rgba(255, 23, 68, 0.22);

            border-radius: 14px;

            padding:
                22px 28px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.35),
                0 0 25px
                rgba(255, 23, 68, 0.06);

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 13px;

            font-weight: 700;
        }

        .spinner {
            width: 20px;
            height: 20px;

            border:
                3px solid
                rgba(255, 255, 255, 0.12);

            border-top-color:
                var(--red);

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }

        /* =========================================================
           COMPATIBILITY
           ========================================================= */

        #modelTableBody {
            display: none !important;
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */

        @media (max-width: 1100px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .main-content {
                padding:
                    105px
                    22px
                    40px;
            }
        }

        @media (max-width: 800px) {

            .main-content {
                width: 100%;

                padding:
                    90px
                    18px
                    35px;
            }

            .page-header {
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                width: 100%;
            }
        }

        @media (max-width: 560px) {

            .main-content {
                padding:
                    88px
                    13px
                    30px;
            }

            .stats-grid {
                grid-template-columns:
                    1fr 1fr;

                gap: 9px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-value {
                font-size: 21px;
            }

            .models-grid {
                grid-template-columns:
                    1fr;
            }

            .toolbar {
                flex-direction: column;

                align-items: stretch;
            }

            .search-box {
                min-width: 0;
            }

            .filter-select {
                width: 100%;
            }

            .model-card {
                padding: 16px;
            }

            .page-title h1 {
                font-size: 25px;
            }

            .model-meta {
                grid-template-columns:
                    1fr 1fr;
            }

            .toast-container {
                left: 13px;
                right: 13px;
                bottom: 13px;
            }

            .toast {
                min-width: 0;
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<!-- =============================================================
     SHARED ADMIN NAVIGATION
     ============================================================= -->

<div id="adminNavigation"></div>


<!-- =============================================================
     MAIN
     ============================================================= -->

<main class="main-content">

    <header class="page-header">

        <div class="page-title">

            <h1>
                Models
            </h1>

            <p>
                Model tersedia otomatis dari folder model
                di repository GEN-Z.AI
            </p>

        </div>

        <div class="header-actions">

            <button
                type="button"
                id="refreshModelsBtn"
                class="btn btn-secondary"
            >
                ↻ Refresh
            </button>

        </div>

    </header>


    <!-- =========================================================
         STATS
         ========================================================= -->

    <section class="stats-grid">

        <div class="stat-card">

            <div class="stat-label">
                Total Model
            </div>

            <div
                id="totalModels"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Model Aktif
            </div>

            <div
                id="activeModels"
                class="stat-value green"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Model Nonaktif
            </div>

            <div
                id="inactiveModels"
                class="stat-value"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Provider
            </div>

            <div
                id="totalProviders"
                class="stat-value red"
            >
                0
            </div>

        </div>

    </section>


    <!-- =========================================================
         SEARCH / FILTER
         ========================================================= -->

    <section class="toolbar">

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>

            <input
                type="search"
                id="modelSearch"
                autocomplete="off"
                placeholder="Cari model, model ID, provider..."
            >

        </div>


        <select
            id="modelStatusFilter"
            class="filter-select"
        >

            <option value="all">
                Semua Status
            </option>

            <option value="active">
                Aktif
            </option>

            <option value="inactive">
                Nonaktif
            </option>

        </select>


        <select
            id="modelProviderFilter"
            class="filter-select"
        >

            <option value="all">
                Semua Provider
            </option>

        </select>

    </section>


    <!-- =========================================================
         MODEL GRID
         ========================================================= -->

    <section class="models-wrapper">

        <div
            id="modelsTable"
            class="models-grid"
        >

            <div class="state-panel">

                <div class="state-icon">

<!-- =============================================================
     PAGE BOOTSTRAP
     ============================================================= -->

<script type="module">

    const sleep = (ms) =>
        new Promise(resolve => setTimeout(resolve, ms));


    /* =========================================================
       TOAST
       ========================================================= */

    function showToast(
        message,
        type = "success"
    ) {

        const container =
            document.getElementById(
                "toastContainer"
            );

        if (!container) {
            return;
        }

        const toast =
            document.createElement("div");

        toast.className =
            `toast ${type}`;

        toast.textContent =
            String(message || "");

        container.appendChild(toast);

        setTimeout(() => {

            toast.style.opacity = "0";

            toast.style.transform =
                "translateY(8px)";

            toast.style.transition =
                "opacity .2s ease, transform .2s ease";

            setTimeout(() => {

                toast.remove();

            }, 220);

        }, 3500);
    }


    /* =========================================================
       LOADING
       ========================================================= */

    function setLoading(show) {

        const element =
            document.getElementById(
                "pageLoading"
            );

        if (!element) {
            return;
        }

        element.classList.toggle(
            "show",
            Boolean(show)
        );
    }


    /* =========================================================
       STATS
       ========================================================= */

    function updateStats(models) {

        const list =
            Array.isArray(models)
                ? models
                : [];

        const total =
            list.length;

        const active =
            list.filter(model => {

                return String(
                    model?.status || ""
                )
                    .trim()
                    .toLowerCase() === "active";

            }).length;

        const inactive =
            list.filter(model => {

                const status =
                    String(
                        model?.status || ""
                    )
                        .trim()
                        .toLowerCase();

                return (
                    status === "inactive" ||
                    status === "disabled" ||
                    status === "nonaktif"
                );

            }).length;

        const providerSet =
            new Set();

        list.forEach(model => {

            const provider =
                String(
                    model?.provider_id ||
                    model?.providerId ||
                    model?.provider_code ||
                    model?.provider ||
                    ""
                ).trim();

            if (provider) {
                providerSet.add(provider);
            }

        });

        const providerCount =
            providerSet.size;


        const totalElement =
            document.getElementById(
                "totalModels"
            );

        const activeElement =
            document.getElementById(
                "activeModels"
            );

        const inactiveElement =
            document.getElementById(
                "inactiveModels"
            );

        const providersElement =
            document.getElementById(
                "totalProviders"
            );


        if (totalElement) {
            totalElement.textContent =
                String(total);
        }

        if (activeElement) {
            activeElement.textContent =
                String(active);
        }

        if (inactiveElement) {
            inactiveElement.textContent =
                String(inactive);
        }

        if (providersElement) {
            providersElement.textContent =
                String(providerCount);
        }
    }


    /* =========================================================
       GET MODEL DATA MODULE
       ========================================================= */

    function getModelsData() {

        return (
            window.GENZModelsData ||
            null
        );
    }


    /* =========================================================
       GET TABLE MODULE
       ========================================================= */

    function getModelTable() {

        return (
            window.GENZModelTable ||
            null
        );
    }


    /* =========================================================
       GET UI MODULE
       ========================================================= */

    function getModelsUI() {

        return (
            window.GENZModelsUI ||
            null
        );
    }


    /* =========================================================
       WAIT FOR MODULES
       ========================================================= */

    async function waitForModules() {

        const maxAttempts = 160;

        for (
            let attempt = 0;
            attempt < maxAttempts;
            attempt++
        ) {

            const data =
                getModelsData();

            const table =
                getModelTable();

            const ui =
                getModelsUI();


            if (
                data &&
                typeof data.loadModels ===
                    "function" &&
                table
            ) {

                return true;
            }


            if (
                data &&
                table &&
                ui
            ) {

                return true;
            }


            await sleep(50);
        }

        return false;
    }


    /* =========================================================
       LOAD ALL MODELS
       ========================================================= */

    async function loadAllModels(
        force = false
    ) {

        const data =
            getModelsData();

        if (
            !data ||
            typeof data.loadModels !==
                "function"
        ) {

            throw new Error(
                "GENZModelsData.loadModels() tidak tersedia."
            );
        }


        /*
         * Semua model dari registry dimuat.
         *
         * includeInactive sengaja true agar
         * filter aktif/nonaktif dapat bekerja.
         */

        const result =
            await data.loadModels({
                force: Boolean(force),
                includeInactive: true
            });


        return Array.isArray(result)
            ? result
            : [];
    }


    /* =========================================================
       APPLY MODELS
       ========================================================= */

    function applyModels(
        models
    ) {

        const list =
            Array.isArray(models)
                ? models
                : [];


        const table =
            getModelTable();


        if (
            table &&
            typeof table.setModels ===
                "function"
        ) {

            table.setModels(list);

            table.render();
        }
        else {

            throw new Error(
                "GENZModelTable belum tersedia."
            );
        }


        updateStats(list);


        const ui =
            getModelsUI();


        if (
            ui &&
            typeof ui.syncSearch ===
                "function"
        ) {

            try {

                ui.syncSearch(list);

            }
            catch (error) {

                console.warn(
                    "[Models] syncSearch warning:",
                    error
                );

            }

        }


        return list;
    }


    /* =========================================================
       INITIALIZE
       ========================================================= */

    async function initializePage() {

        setLoading(true);

        try {

            const ready =
                await waitForModules();


            if (!ready) {

                throw new Error(
                    "Module Models GEN-Z.AI belum siap."
                );
            }


            const ui =
                getModelsUI();


            if (
                ui &&
                typeof ui.initialize ===
                    "function"
            ) {

                await ui.initialize();


                const table =
                    getModelTable();


                if (
                    table &&
                    typeof table.getModels ===
                        "function"
                ) {

                    const current =
                        table.getModels();

                    updateStats(current);

                    return;
                }
            }


            const models =
                await loadAllModels(false);

            applyModels(models);

        }
        catch (error) {

            console.error(
                "[Models] initialization error:",
                error
            );


            const table =
                getModelTable();


            if (
                table &&
                typeof table.renderError ===
                    "function"
            ) {

                table.renderError(
                    error?.message ||
                    "Gagal memuat model."
                );

            }


            showToast(
                error?.message ||
                "Gagal memuat model.",
                "error"
            );

        }
        finally {

            setLoading(false);
        }
    }


    /* =========================================================
       REFRESH
       ========================================================= */

    const refreshButton =
        document.getElementById(
            "refreshModelsBtn"
        );


    if (refreshButton) {

        refreshButton.addEventListener(
            "click",
            async () => {

                if (
                    refreshButton.disabled
                ) {
                    return;
                }


                refreshButton.disabled =
                    true;

                setLoading(true);


                try {

                    const models =
                        await loadAllModels(true);


                    applyModels(models);


                    showToast(
                        `${models.length} model berhasil dimuat dari registry.`,
                        "success"
                    );

                }
                catch (error) {

                    console.error(
                        "[Models] refresh error:",
                        error
                    );


                    showToast(
                        error?.message ||
                        "Gagal memperbarui model.",
                        "error"
                    );

                }
                finally {

                    setLoading(false);

                    refreshButton.disabled =
                        false;
                }
            }
        );

    }


    /* =========================================================
       AUTH CHECK
       ========================================================= */

    async function checkAdminAccess() {

        /*
         * Supabase client berasal dari
         * admin-control/supabase.js.
         */

        for (
            let attempt = 0;
            attempt < 100;
            attempt++
        ) {

            const client =
                window.GENZ_SUPABASE ||
                window.supabaseClient ||
                null;


            if (
                client &&
                client.auth &&
                typeof client
                    .auth
                    .getUser ===
                    "function"
            ) {

                try {

                    const {
                        data,
                        error
                    } =
                        await client
                            .auth
                            .getUser();


                    if (error) {

                        console.warn(
                            "[Models] auth check:",
                            error
                        );

                    }


                    /*
                     * Auth guard utama tetap
                     * menangani redirect.
                     */

                    if (!data?.user) {
                        return true;
                    }


                    return true;

                }
                catch (error) {

                    console.warn(
                        "[Models] auth check failed:",
                        error
                    );

                    return true;
                }
            }


            await sleep(50);
        }


        return true;
    }


    /* =========================================================
       START PAGE
       ========================================================= */

    (async () => {

        try {

            await checkAdminAccess();

            await initializePage();

        }
        catch (error) {

            console.error(
                "[Models] page startup error:",
                error
            );

            setLoading(false);

            showToast(
                error?.message ||
                "Gagal menjalankan halaman Models.",
                "error"
            );

        }

    })();

</script>
