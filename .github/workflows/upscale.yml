      - name: Upscale + Interpolate (2-pass, target < 45MB)
        run: |
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 input.mp4)
          DURATION_INT=$(printf "%.0f" "$DURATION")

          # Target 45 MB (buffer 5 MB dari limit 50 MB Supabase)
          TARGET_MB=45
          AUDIO_KBPS=128
          TOTAL_KBPS=$(( TARGET_MB * 8 * 1024 / DURATION_INT ))
          VIDEO_KBPS=$(( TOTAL_KBPS - AUDIO_KBPS ))

          echo "Duration: ${DURATION_INT}s"
          echo "Target video bitrate: ${VIDEO_KBPS} kbps"

          # PASS 1
          ffmpeg -y -i input.mp4 \
            -vf "scale=${{ steps.target.outputs.target_width }}:${{ steps.target.outputs.target_height }}:flags=lanczos,unsharp=5:5:0.8:3:3:0.4,minterpolate=fps=48:mi_mode=mci:mc_mode=aobmc:vsbmc=1" \
            -c:v libx264 \
            -preset medium \
            -b:v ${VIDEO_KBPS}k \
            -pass 1 \
            -an \
            -f mp4 \
            -y /dev/null

          # PASS 2
          ffmpeg -y -i input.mp4 \
            -vf "scale=${{ steps.target.outputs.target_width }}:${{ steps.target.outputs.target_height }}:flags=lanczos,unsharp=5:5:0.8:3:3:0.4,minterpolate=fps=48:mi_mode=mci:mc_mode=aobmc:vsbmc=1" \
            -c:v libx264 \
            -preset medium \
            -b:v ${VIDEO_KBPS}k \
            -maxrate $(( VIDEO_KBPS * 2 ))k \
            -bufsize $(( VIDEO_KBPS * 4 ))k \
            -pass 2 \
            -c:a aac -b:a ${AUDIO_KBPS}k \
            -movflags +faststart \
            output.mp4

          ls -lh output.mp4
          echo "Upscale + interpolate selesai."

      - name: Upload to Supabase Storage
        id: upload
        env:
          SUPABASE_URL: ${{ secrets.GENZ_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.GENZ_SUPABASE_SERVICE_KEY }}
          HISTORY_ID: ${{ inputs.history_id }}
        run: |
          FILENAME="upscale-${HISTORY_ID}-$(date +%s).mp4"
          BUCKET="dashboard-upscales"
          KEY="outputs/${FILENAME}"

          echo "Uploading to Supabase: ${BUCKET}/${KEY}..."
          ls -lh output.mp4

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/${BUCKET}/${KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @output.mp4)

          echo "HTTP status: ${HTTP_CODE}"
          cat /tmp/resp.txt

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Upload gagal: ${HTTP_CODE}"
            exit 1
          fi

          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${KEY}"
          echo "public_url=$PUBLIC_URL" >> $GITHUB_OUTPUT
          echo "✅ Uploaded: $PUBLIC_URL"
