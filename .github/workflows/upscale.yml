name: Upscale + Smooth Video

on:
  workflow_dispatch:
    inputs:
      history_id:
        description: "ID row generation_history yang mau diupscale"
        required: true
        type: string
      source_url:
        description: "URL video sumber"
        required: true
        type: string
      user_id:
        description: "User ID (untuk refund kalau gagal)"
        required: true
        type: string
      credit_cost:
        description: "Credit yang sudah dipotong (untuk refund)"
        required: true
        type: string
        default: "1"
      target_resolution:
        description: "Resolusi sisi panjang target"
        required: true
        type: choice
        options:
          - 1080p
          - 1k
          - 2k
          - 4k
        default: "2k"
      source_object_path:
        description: "Object Storage sementara yang dihapus setelah pemrosesan"
        required: false
        type: string
        default: ""

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download source video
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_OBJECT_PATH: ${{ inputs.source_object_path }}
        run: |
          echo "Downloading video..."
          if [ -n "$SOURCE_OBJECT_PATH" ]; then
            curl -L --fail --retry 3 --max-filesize 104857600 -o input.mp4 "$SOURCE_URL"
          else
            curl -L --fail --retry 3 -o input.mp4 "$SOURCE_URL"
          fi
          ls -lh input.mp4

      - name: Probe source video
        id: probe
        env:
          SOURCE_OBJECT_PATH: ${{ inputs.source_object_path }}
          MAX_DURATION_SECONDS: "180"
        run: |
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 input.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 input.mp4)
          FORMAT_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 input.mp4)
          STREAM_DURATION=$(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 input.mp4)
          FRAME_RATE=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 input.mp4)
          if [ -z "$FRAME_RATE" ] || [ "$FRAME_RATE" = "0/0" ]; then
            FRAME_RATE=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 input.mp4)
          fi

          PACKET_DURATION=$(ffprobe -v error -select_streams v:0 \
            -show_entries packet=pts_time,duration_time -of csv=p=0 input.mp4 | awk -F, '
              function is_number(value) {
                return value ~ /^[0-9]+([.][0-9]+)?$/
              }
              is_number($1) {
                pts = $1 + 0
                if (!found) {
                  first_pts = pts
                  found = 1
                }
                if (found && has_previous && pts > previous_pts) {
                  last_delta = pts - previous_pts
                }
                previous_pts = pts
                has_previous = 1
                last_pts = pts
                if (is_number($2) && $2 > 0) {
                  last_duration = $2
                } else {
                  last_duration = 0
                }
              }
              END {
                if (found) {
                  end_pts = last_pts + (last_duration > 0 ? last_duration : last_delta)
                  if (end_pts > first_pts) {
                    printf "%.6f", end_pts - first_pts
                  }
                }
              }')

          is_valid_duration() {
            awk -v duration="$1" 'BEGIN { exit !(duration ~ /^[0-9]+([.][0-9]+)?$/ && duration > 0) }'
          }

          DURATION="$STREAM_DURATION"
          if ! is_valid_duration "$DURATION"; then
            DURATION="$FORMAT_DURATION"
          fi

          if is_valid_duration "$PACKET_DURATION" &&
            { ! is_valid_duration "$DURATION" ||
              awk -v metadata="$DURATION" -v packets="$PACKET_DURATION" 'BEGIN { exit !(packets - metadata > 0.5) }'; }; then
            DURATION="$PACKET_DURATION"
          fi

          RATE_FPS=$(awk -F/ '{
            if ($2 > 0) rate = $1 / $2
            else rate = $1
            if (rate > 0) printf "%.6f", rate
          }' <<< "$FRAME_RATE")

          if ! awk -v rate="$RATE_FPS" 'BEGIN { exit !(rate > 0 && rate <= 120) }'; then
            FRAME_COUNT=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 input.mp4)
            RATE_FPS=$(awk -v frames="$FRAME_COUNT" -v duration="$PACKET_DURATION" 'BEGIN {
              if (frames ~ /^[0-9]+$/ && duration > 0) printf "%.6f", frames / duration
            }')
          fi
          if ! awk -v rate="$RATE_FPS" 'BEGIN { exit !(rate > 0 && rate <= 120) }'; then
            RATE_FPS="30"
          fi

          if ! is_valid_duration "$DURATION" ||
            awk -v duration="$DURATION" 'BEGIN { exit !(duration < 0.5) }' ||
            { [ -n "$SOURCE_OBJECT_PATH" ] &&
              awk -v duration="$DURATION" -v maximum="$MAX_DURATION_SECONDS" 'BEGIN { exit !(duration > maximum) }'; }; then
            if is_valid_duration "$PACKET_DURATION"; then
              DURATION="$PACKET_DURATION"
            elif [ -z "$FRAME_COUNT" ]; then
              FRAME_COUNT=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 input.mp4)
            fi
            if ! is_valid_duration "$PACKET_DURATION" &&
              awk -v frames="$FRAME_COUNT" -v rate="$RATE_FPS" 'BEGIN { exit !(frames ~ /^[0-9]+$/ && rate > 0) }'; then
              DURATION=$(awk -v frames="$FRAME_COUNT" -v rate="$RATE_FPS" 'BEGIN { printf "%.6f", frames / rate }')
            fi
          fi

          echo "Duration metadata: container=${FORMAT_DURATION}s, video_stream=${STREAM_DURATION}s, packet_timing=${PACKET_DURATION:-unavailable}, frame_count=${FRAME_COUNT:-unneeded}, frame_rate=${FRAME_RATE}, effective_fps=${RATE_FPS}"

          if [ -z "$WIDTH" ] || [ -z "$HEIGHT" ] || ! is_valid_duration "$DURATION"; then
            echo "Tidak dapat membaca dimensi atau menghitung durasi video."
            exit 1
          fi

          if [ -n "$SOURCE_OBJECT_PATH" ]; then
            if ! awk -v duration="$DURATION" -v maximum="$MAX_DURATION_SECONDS" 'BEGIN { exit !(duration > 0 && duration <= maximum) }'; then
              echo "Durasi video terukur ${DURATION} detik, melebihi batas ${MAX_DURATION_SECONDS} detik."
              exit 1
            fi
          fi

          echo "width=$WIDTH" >> $GITHUB_OUTPUT
          echo "height=$HEIGHT" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "frame_rate=$RATE_FPS" >> $GITHUB_OUTPUT
          echo "Source: ${WIDTH}x${HEIGHT}, ${DURATION}s, ${RATE_FPS}fps"

      - name: Calculate target resolution
        id: target
        env:
          SOURCE_WIDTH: ${{ steps.probe.outputs.width }}
          SOURCE_HEIGHT: ${{ steps.probe.outputs.height }}
          SOURCE_FRAME_RATE: ${{ steps.probe.outputs.frame_rate }}
          TARGET_RESOLUTION: ${{ inputs.target_resolution }}
        run: |
          case "$TARGET_RESOLUTION" in
            1080p) EDGE=1080 ;;
            1k) EDGE=1024 ;;
            2k) EDGE=2560 ;;
            4k) EDGE=3840 ;;
            *) echo "Target resolusi tidak valid."; exit 1 ;;
          esac

          W="$SOURCE_WIDTH"
          H="$SOURCE_HEIGHT"

          if [ "$TARGET_RESOLUTION" = "1080p" ]; then
            if [ "$W" -ge "$H" ]; then
              TH="$EDGE"
              TW=$(( W * EDGE / H ))
            else
              TW="$EDGE"
              TH=$(( H * EDGE / W ))
            fi
          elif [ "$W" -ge "$H" ]; then
            TW="$EDGE"
            TH=$(( H * EDGE / W ))
          else
            TH="$EDGE"
            TW=$(( W * EDGE / H ))
          fi

          TW=$(( TW / 2 * 2 ))
          TH=$(( TH / 2 * 2 ))
          if [ "$TW" -lt 2 ]; then TW=2; fi
          if [ "$TH" -lt 2 ]; then TH=2; fi

          FPS=$(awk -v rate="$SOURCE_FRAME_RATE" 'BEGIN { value=int(rate + 0.5); if (value < 1) value=24; if (value > 60) value=60; print value }')
          if [ "$FPS" -lt 1 ]; then FPS=24; fi
          OUTPUT_FPS=$(( FPS * 2 ))
          if [ "$OUTPUT_FPS" -gt 60 ]; then OUTPUT_FPS=60; fi

          echo "target_width=$TW" >> $GITHUB_OUTPUT
          echo "target_height=$TH" >> $GITHUB_OUTPUT
          echo "target_fps=$OUTPUT_FPS" >> $GITHUB_OUTPUT
          echo "Target: ${TW}x${TH} at ${OUTPUT_FPS}fps"

      - name: Upscale + Interpolate (2-pass, target < 45MB)
        env:
          DURATION: ${{ steps.probe.outputs.duration }}
          TARGET_WIDTH: ${{ steps.target.outputs.target_width }}
          TARGET_HEIGHT: ${{ steps.target.outputs.target_height }}
          TARGET_FPS: ${{ steps.target.outputs.target_fps }}
        run: |
          DURATION_INT=$(awk -v duration="$DURATION" 'BEGIN { value=int(duration + 0.5); if (value < 1) value=1; print value }')

          # Target 45 MB (buffer 5 MB dari limit 50 MB Supabase free)
          TARGET_MB=45
          AUDIO_KBPS=128
          TOTAL_KBPS=$(( TARGET_MB * 8 * 1024 / DURATION_INT ))
          VIDEO_KBPS=$(( TOTAL_KBPS - AUDIO_KBPS ))

          FILTER="minterpolate=fps=${TARGET_FPS}:mi_mode=mci:mc_mode=aobmc:vsbmc=1:me_mode=bidir:mb_size=16,scale=${TARGET_WIDTH}:${TARGET_HEIGHT}:flags=lanczos,unsharp=5:5:0.8:3:3:0.4"

          echo "Duration: ${DURATION_INT}s"
          echo "Output: ${TARGET_WIDTH}x${TARGET_HEIGHT} at ${TARGET_FPS}fps"
          echo "Target total bitrate: ${TOTAL_KBPS} kbps"
          echo "Target video bitrate: ${VIDEO_KBPS} kbps"

          # PASS 1 — analyze
          echo "=== PASS 1 ==="
          ffmpeg -y -i input.mp4 \
            -vf "$FILTER" \
            -c:v libx264 \
            -preset medium \
            -b:v ${VIDEO_KBPS}k \
            -pass 1 \
            -an \
            -f mp4 \
            -y /dev/null

          # PASS 2 — final encode
          echo "=== PASS 2 ==="
          ffmpeg -y -i input.mp4 \
            -vf "$FILTER" \
            -c:v libx264 \
            -preset medium \
            -b:v ${VIDEO_KBPS}k \
            -maxrate $(( VIDEO_KBPS * 2 ))k \
            -bufsize $(( VIDEO_KBPS * 4 ))k \
            -pass 2 \
            -c:a aac -b:a ${AUDIO_KBPS}k \
            -movflags +faststart \
            output.mp4

          ls -lh output.mp4
          echo "Upscale + interpolate selesai."

      - name: Upload to Supabase Storage
        id: upload
        env:
          SUPABASE_URL: ${{ secrets.GENZ_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.GENZ_SUPABASE_SERVICE_KEY }}
          HISTORY_ID: ${{ inputs.history_id }}
        run: |
          FILENAME="upscale-${HISTORY_ID}-$(date +%s).mp4"
          BUCKET="dashboard-upscales"
          KEY="outputs/${FILENAME}"

          echo "Uploading to Supabase: ${BUCKET}/${KEY}..."
          ls -lh output.mp4

          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST \
            "${SUPABASE_URL}/storage/v1/object/${BUCKET}/${KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @output.mp4)

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response body:"
          cat /tmp/resp.txt
          echo ""

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Upload gagal dengan status ${HTTP_CODE}"
            exit 1
          fi

          PUBLIC_URL="${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${KEY}"
          echo "public_url=$PUBLIC_URL" >> $GITHUB_OUTPUT
          echo "✅ Uploaded: $PUBLIC_URL"

      - name: Update history row — success
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.GENZ_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.GENZ_SUPABASE_SERVICE_KEY }}
          HISTORY_ID: ${{ inputs.history_id }}
          PUBLIC_URL: ${{ steps.upload.outputs.public_url }}
        run: |
          curl --fail -X PATCH \
            "${SUPABASE_URL}/rest/v1/generation_history?id=eq.${HISTORY_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"success\",
              \"result_url\": \"${PUBLIC_URL}\",
              \"completed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }"

          echo "History row updated (success)."

      - name: Refund credit and mark failed
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.GENZ_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.GENZ_SUPABASE_SERVICE_KEY }}
          HISTORY_ID: ${{ inputs.history_id }}
          USER_ID: ${{ inputs.user_id }}
          CREDIT_COST: ${{ inputs.credit_cost }}
        run: |
          curl -X PATCH \
            "${SUPABASE_URL}/rest/v1/generation_history?id=eq.${HISTORY_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"status\": \"failed\",
              \"error_message\": \"Upscale gagal di GitHub Actions\"
            }"

          curl -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/refund_generate_credits" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"p_user_id\": \"${USER_ID}\",
              \"p_amount\": ${CREDIT_COST}
            }"

          echo "Refund done."

      - name: Delete temporary uploaded source
        if: always() && inputs.source_object_path != ''
        env:
          SUPABASE_URL: ${{ secrets.GENZ_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.GENZ_SUPABASE_SERVICE_KEY }}
          SOURCE_OBJECT_PATH: ${{ inputs.source_object_path }}
        run: |
          if ! curl --fail --silent --show-error \
            -X DELETE \
            "${SUPABASE_URL}/storage/v1/object/dashboard-videos/${SOURCE_OBJECT_PATH}" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}"; then
            echo "::warning::Temporary source video could not be removed from Storage."
          fi
