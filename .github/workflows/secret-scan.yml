name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: v8.30.1

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
          name="gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          # GitHub Releases can temporarily return 5xx (including 504).
          # Retry downloads, but still fail closed and verify the checksum below.
          curl -sSfL --retry 6 --retry-max-time 180 --connect-timeout 15 --max-time 60 "${base}/gitleaks_${GITLEAKS_VERSION#v}_checksums.txt" -o checksums.txt
          curl -sSfL --retry 6 --retry-max-time 180 --connect-timeout 15 --max-time 60 "${base}/${name}" -o "${name}"
          grep " ${name}$" checksums.txt | sha256sum --check --strict
          tar -xzf "${name}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks detect --source . --redact --verbose --no-banner --config .gitleaks.toml

      - name: Scan working tree
        run: gitleaks dir . --redact --verbose --no-banner --config .gitleaks.toml
