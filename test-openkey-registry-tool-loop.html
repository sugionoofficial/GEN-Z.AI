<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GEN-Z.AI - OpenKey Registry Tool Loop Test
    </title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #080808;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: #e00000;
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        pre {
            margin-top: 25px;
            padding: 20px;
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #111;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        OpenKey Registry Tool Loop Test
    </h1>

    <p>
        Menguji OpenKey → runToolLoop → Tool Registry → Tool Executor → OpenKey.
    </p>

    <button
        id="runTest"
        type="button"
    >
        RUN TEST
    </button>

    <div
        id="status"
        class="status"
    >
        Status: siap
    </div>

    <pre id="result">Belum ada hasil.</pre>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="module">

/* =========================================================
   CONFIG
   ---------------------------------------------------------
   Gunakan config project yang SAMA dengan project GEN-Z.AI.
========================================================= */

const SUPABASE_URL =
    "MASUKKAN_SUPABASE_URL_ANDA";


const SUPABASE_ANON_KEY =
    "MASUKKAN_SUPABASE_ANON_KEY_ANDA";


/* =========================================================
   SUPABASE
========================================================= */

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   DOM
========================================================= */

const runTestButton =
    document.getElementById(
        "runTest"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const resultElement =
    document.getElementById(
        "result"
    );


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text
) {

    statusElement.textContent =
        `Status: ${text}`;

}


/* =========================================================
   RUN TEST
========================================================= */

async function runTest() {

    runTestButton.disabled =
        true;


    resultElement.textContent =
        "";


    try {

        setStatus(
            "memeriksa session..."
        );


        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (
            error
        ) {

            throw error;

        }


        const session =
            data?.session;


        if (
            !session?.access_token
        ) {

            throw new Error(
                "Tidak ada session Supabase. Silakan login terlebih dahulu."
            );

        }


        setStatus(
            "menjalankan Registry Tool Loop..."
        );


        const response =
            await fetch(
                "/api/test-openkey-registry-tool-loop",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${session.access_token}`

                    },

                    body:
                        JSON.stringify({})

                }
            );


        const text =
            await response.text();


        let result;


        try {

            result =
                JSON.parse(
                    text
                );

        }
        catch {

            result = {

                success:
                    false,

                status:
                    response.status,

                raw:
                    text

            };

        }


        resultElement.textContent =
            JSON.stringify(
                result,
                null,
                2
            );


        if (
            !response.ok ||
            !result.success
        ) {

            setStatus(
                `GAGAL (${response.status})`
            );

            return;

        }


        setStatus(
            "PASS"
        );

    }
    catch (
        error
    ) {

        console.error(
            error
        );


        resultElement.textContent =
            JSON.stringify(
                {

                    success:
                        false,

                    error:
                        error.message ||
                        String(error)

                },
                null,
                2
            );


        setStatus(
            "ERROR"
        );

    }
    finally {

        runTestButton.disabled =
            false;

    }

}


/* =========================================================
   EVENT
========================================================= */

runTestButton.addEventListener(
    "click",
    runTest
);

</script>

</body>
</html>
