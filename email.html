<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>GEN-Z.AI - Temp Gmail</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background: #0a0a0a;
      color: #eee;
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h1 {
      color: #ff3d3d;
      text-shadow: 0 0 10px rgba(255, 0, 0, .4);
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }
    button {
      padding: 10px 18px;
      margin: 4px 4px 4px 0;
      cursor: pointer;
      border: 1px solid rgba(255, 50, 50, .3);
      border-radius: 8px;
      background: rgba(255, 0, 0, .08);
      color: #ff4a4a;
      font-weight: 600;
      font-size: 13px;
      transition: all .18s ease;
    }
    button:hover:not(:disabled) {
      background: rgba(255, 0, 0, .15);
      border-color: rgba(255, 50, 50, .5);
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    button.secondary {
      border-color: rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .03);
      color: #ccc;
    }
    .box {
      border: 1px solid #333;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, .015);
    }
    .email-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .email-text {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 14px;
      color: #4ade80;
      word-break: break-all;
      flex: 1;
      min-width: 200px;
    }
    .msg-item {
      cursor: pointer;
      padding: 12px 10px;
      border-bottom: 1px solid #222;
      transition: background .15s ease;
    }
    .msg-item:hover { background: #1a1a1a; }
    .msg-item:last-child { border-bottom: none; }
    .msg-subject {
      font-weight: 600;
      color: #fff;
      font-size: 13px;
      margin-bottom: 2px;
    }
    .msg-from {
      font-size: 11px;
      color: #888;
    }
    .hidden { display: none !important; }
    .status {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }
    .status.error { color: #ff5555; }
    .status.success { color: #4ade80; }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, .2);
      border-top-color: #ff4a4a;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg-body {
      background: #fff;
      color: #000;
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
      overflow-x: auto;
      font-size: 13px;
    }
    .msg-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }

    /* Penyesuaian dengan sidebar navigation */
    @media (min-width: 769px) {
      body {
        max-width: none;
        margin: 0;
        padding: 30px 30px 30px calc(248px + 30px);
      }
      .email-container {
        max-width: 720px;
        margin: 0 auto;
      }
    }
    @media (max-width: 768px) {
      body {
        padding: 70px 20px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Container konten -->
  <div class="email-container">

    <h1>GEN-Z.AI — Temp Gmail</h1>
    <div class="subtitle">Generate email @gmail.com sementara untuk verifikasi & testing.</div>

    <div>
      <button id="btn-generate">📧 Generate Email Gmail</button>
      <button id="btn-refresh" class="secondary hidden">🔄 Refresh Inbox</button>
    </div>

    <div id="status" class="status"></div>

    <div id="email-display" class="box hidden">
      <div class="email-display">
        <span class="email-text" id="email-text">-</span>
        <button id="btn-copy" class="secondary" style="margin:0;">📋 Salin</button>
      </div>
      <div style="margin-top:10px; font-size:12px; color:#888;">
        Gunakan alamat ini untuk verifikasi akun. Klik "Refresh Inbox" untuk membaca email yang diterima.
      </div>
    </div>

    <div id="inbox" class="box hidden">
      <h3 style="margin-top:0; font-size:15px; color:#fff;">📥 Pesan Masuk</h3>
      <div id="message-list"></div>
    </div>

    <div id="message-view" class="box hidden">
      <h3 style="margin-top:0; font-size:15px; color:#fff;">📩 Isi Pesan</h3>
      <div class="msg-meta"><strong>Subject:</strong> <span id="msg-subject">-</span></div>
      <div class="msg-meta"><strong>Dari:</strong> <span id="msg-from">-</span></div>
      <div class="msg-body" id="message-content"></div>
      <button onclick="document.getElementById('message-view').classList.add('hidden')" class="secondary" style="margin-top:10px;">Tutup</button>
    </div>

  </div>

  <!-- =========================================================
       DEPENDENSI NAVIGATION (WAJIB, urutan harus begini)
  ========================================================== -->

  <!-- 1. Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>

  <!-- 2. Config (path absolut karena email.html di root) -->
  <script src="/assets/js/config.js"></script>

  <!-- 3. Navigation (path absolut) -->
  <script src="/navigation/navigation.js?v=announcements-neon-20261016"></script>

  <!-- =========================================================
       TEMPMAIL LOGIC
  ========================================================== -->
  <script>
    let currentEmail = '';
    let autoRefreshTimer = null;

    const statusEl = document.getElementById('status');
    const btnGenerate = document.getElementById('btn-generate');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnCopy = document.getElementById('btn-copy');

    function setStatus(message, type) {
      statusEl.textContent = message || '';
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function setLoading(btn, isLoading, originalText) {
      if (isLoading) {
        btn.disabled = true;
        btn.dataset.originalText = btn.innerHTML;
        btn.innerHTML = '<span class="spinner"></span>' + originalText;
      } else {
        btn.disabled = false;
        if (btn.dataset.originalText) btn.innerHTML = btn.dataset.originalText;
      }
    }

    async function tempmailRequest(url, options = {}) {
      if (window.GENZNavigationReady) {
        await window.GENZNavigationReady;
      }

      const client = window.GENZ_SUPABASE || window.supabaseClient;
      if (!client?.auth?.getSession) {
        throw new Error('Session Supabase tidak tersedia. Silakan login kembali.');
      }

      const { data, error } = await client.auth.getSession();
      const accessToken = data?.session?.access_token;
      if (error || !accessToken) {
        throw new Error('Silakan login terlebih dahulu untuk menggunakan TempMail.');
      }

      const response = await fetch(url, {
        ...options,
        headers: {
          ...options.headers,
          Authorization: `Bearer ${accessToken}`
        }
      });
      const result = await response.json();
      if (!response.ok) {
        throw new Error(result.error || 'Permintaan TempMail gagal.');
      }
      return result;
    }

    // ===================== GENERATE EMAIL =====================
    btnGenerate.addEventListener('click', async () => {
      setLoading(btnGenerate, true, 'Menghubungi server...');
      setStatus('');
      try {
        const data = await tempmailRequest('/api/tempmail?action=create', { method: 'POST' });

        if (data.email) {
          currentEmail = data.email;

          document.getElementById('email-text').textContent = data.email;
          document.getElementById('email-display').classList.remove('hidden');
          document.getElementById('inbox').classList.add('hidden');
          document.getElementById('message-view').classList.add('hidden');
          btnRefresh.classList.remove('hidden');

          setStatus('✅ Email berhasil dibuat. Klik "Refresh Inbox" untuk cek pesan masuk.', 'success');

          if (autoRefreshTimer) clearInterval(autoRefreshTimer);
          autoRefreshTimer = setInterval(() => {
            if (currentEmail) checkMessages(true);
          }, 15000);
        } else {
          setStatus('❌ Gagal generate email: ' + (data.error || 'Unknown error'), 'error');
        }
      } catch (err) {
        setStatus('❌ Error: ' + err.message, 'error');
      } finally {
        setLoading(btnGenerate, false);
      }
    });

    // ===================== COPY EMAIL =====================
    btnCopy.addEventListener('click', async () => {
      if (!currentEmail) return;
      try {
        await navigator.clipboard.writeText(currentEmail);
        btnCopy.textContent = '✅ Tersalin';
        setTimeout(() => { btnCopy.textContent = '📋 Salin'; }, 1500);
      } catch {
        const temp = document.createElement('textarea');
        temp.value = currentEmail;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        btnCopy.textContent = '✅ Tersalin';
        setTimeout(() => { btnCopy.textContent = '📋 Salin'; }, 1500);
      }
    });

    // ===================== CEK PESAN MASUK =====================
    async function checkMessages(silent = false) {
      if (!currentEmail) {
        setStatus('⚠️ Generate email dulu.', 'error');
        return;
      }
      if (!silent) setStatus('🔄 Memuat pesan...');

      try {
        const messages = await tempmailRequest(
          `/api/tempmail?action=messages&email=${encodeURIComponent(currentEmail)}`
        );
        const list = document.getElementById('message-list');
        list.innerHTML = '';

        if (Array.isArray(messages) && messages.length > 0) {
          messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'msg-item';
            div.innerHTML = `
              <div class="msg-subject">${msg.subject || '(tanpa subject)'}</div>
              <div class="msg-from">Dari: ${msg.from_addr || '-'}</div>
            `;
            div.addEventListener('click', () => showMessage(msg.id));
            list.appendChild(div);
          });
          if (!silent) setStatus(`✅ ${messages.length} pesan ditemukan.`, 'success');
        } else {
          list.innerHTML = '<p style="color:#888; font-size:13px;">Belum ada pesan. Tunggu beberapa saat lalu refresh.</p>';
          if (!silent) setStatus('📭 Belum ada pesan masuk.', 'success');
        }
        document.getElementById('inbox').classList.remove('hidden');
      } catch (err) {
        setStatus('❌ Error cek pesan: ' + err.message, 'error');
      }
    }

    btnRefresh.addEventListener('click', () => checkMessages(false));

    // ===================== TAMPILKAN ISI PESAN =====================
    async function showMessage(id) {
      setStatus('🔄 Memuat isi pesan...');
      try {
        const msg = await tempmailRequest(
          `/api/tempmail?action=message&email=${encodeURIComponent(currentEmail)}&messageId=${encodeURIComponent(id)}`
        );

        document.getElementById('msg-subject').textContent = msg.subject || '-';
        document.getElementById('msg-from').textContent = msg.from_addr || '-';

        const content = msg.body_html || msg.body_text || '<em>Tidak ada konten</em>';
        document.getElementById('message-content').innerHTML = content;

        document.getElementById('message-view').classList.remove('hidden');
        setStatus('');
      } catch (err) {
        setStatus('❌ Error memuat pesan: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
