<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>GEN-Z.AI - Temp Gmail</title>
  <style>
    * { box-sizing: border-box; }
    html {
      background: #000000;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background: #000000;
      color: #eee;
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h1 {
      color: #ff3d3d;
      text-shadow: 0 0 10px rgba(255, 0, 0, .4);
      font-size: 22px;
      margin-bottom: 4px;
    }
    h3 {
      margin-top: 0;
      font-size: 15px;
      color: #fff;
    }
    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }
    button {
      padding: 10px 18px;
      margin: 4px 4px 4px 0;
      cursor: pointer;
      border: 1px solid rgba(255, 50, 50, .3);
      border-radius: 8px;
      background: rgba(255, 0, 0, .08);
      color: #ff4a4a;
      font-weight: 600;
      font-size: 13px;
      transition: all .18s ease;
    }
    button:hover:not(:disabled) {
      background: rgba(255, 0, 0, .15);
      border-color: rgba(255, 50, 50, .5);
    }
    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    button.secondary {
      border-color: rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .03);
      color: #ccc;
    }
    .box {
      border: 1px solid #333;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, .015);
    }
    .email-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .email-text {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 14px;
      color: #4ade80;
      word-break: break-all;
      flex: 1;
      min-width: 200px;
    }
    .msg-item {
      cursor: pointer;
      padding: 12px 10px;
      border-bottom: 1px solid #222;
      transition: background .15s ease;
      text-align: left;
      width: 100%;
      display: block;
      background: transparent;
      color: inherit;
    }
    .msg-item:hover,
    .msg-item:focus-visible { background: #1a1a1a; outline: none; }
    .msg-item:focus-visible { box-shadow: inset 0 0 0 2px rgba(255, 74, 74, .55); }
    .msg-item:last-child { border-bottom: none; }
    .msg-subject {
      font-weight: 600;
      color: #fff;
      font-size: 13px;
      margin-bottom: 2px;
      word-break: break-word;
    }
    .msg-from {
      font-size: 11px;
      color: #888;
      word-break: break-word;
    }
    .msg-preview {
      font-size: 11px;
      color: #6f6f6f;
      margin-top: 3px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .hidden { display: none !important; }
    .status {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }
    .status.error { color: #ff5555; }
    .status.success { color: #4ade80; }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, .2);
      border-top-color: #ff4a4a;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .inbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .inbox-meta {
      font-size: 11px;
      color: #7a7a7a;
    }
    .msg-frame {
      width: 100%;
      height: 460px;
      border: 0;
      border-radius: 8px;
      background: #ffffff;
      display: block;
    }
    .msg-text {
      background: #ffffff;
      color: #000;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0 0;
      overflow-x: auto;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
    }
    .msg-meta {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .msg-attachment {
      display: inline-block;
      font-size: 11px;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 2px 8px;
      margin: 2px 4px 2px 0;
    }
    .empty-state {
      color: #888;
      font-size: 13px;
      margin: 0;
    }
    .notice h1 {
      font-size: 20px;
    }
    .email-container {
      visibility: hidden;
    }

    /* Penyesuaian dengan sidebar navigation.
       Padding kiri diatur otomatis oleh navigation.js (body padding-left),
       jadi di sini cukup memberi jarak atas/kanan/bawah. */
    @media (min-width: 769px) {
      body {
        max-width: none;
        margin: 0;
        padding-top: 30px;
        padding-right: 30px;
        padding-bottom: 30px;
      }
      .email-container {
        max-width: 720px;
        margin: 0 auto;
      }
    }
    @media (max-width: 768px) {
      body {
        padding: 70px 20px 20px;
      }
      .msg-frame {
        height: 380px;
      }
    }

    /* ====== LIGHT MODE PASS ====== */
    html[data-genz-theme="light"] .msg-subject {
      color: #172033;
    }
  </style>

  <link rel="stylesheet" href="/assets/css/tempmail-light.css?v=light-theme-20261108">

<body>

  <!-- Container konten -->
  <div class="email-container">

    <h1>GEN-Z.AI — Temp Gmail</h1>
    <div class="subtitle">Generate email @gmail.com sementara untuk verifikasi &amp; testing.</div>

    <div>
      <button id="btn-generate" type="button">📧 Buat Email</button>
      <button id="btn-refresh" type="button" class="secondary hidden">🔄 Refresh Inbox</button>
      <button id="btn-diagnostics" type="button" class="secondary">🔍 Cek Konfigurasi</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div id="diagnostics" class="box hidden">
      <h3>🔍 Diagnostik TempMail</h3>
      <div id="diagnostics-list"></div>
    </div>

    <div id="email-display" class="box hidden">
      <div class="email-display">
        <span class="email-text" id="email-text">-</span>
        <button id="btn-copy" type="button" class="secondary" style="margin:0;">📋 Salin</button>
      </div>
      <div style="margin-top:10px; font-size:12px; color:#888;">
        Gunakan alamat ini untuk verifikasi akun. Inbox diperbarui otomatis setiap 15 detik; klik "Refresh Inbox" untuk cek manual.
      </div>
    </div>

    <div id="inbox" class="box hidden">
      <div class="inbox-header">
        <h3>📥 Pesan Masuk</h3>
        <span class="inbox-meta" id="inbox-meta"></span>
      </div>
      <div id="message-list"></div>
    </div>

    <div id="message-view" class="box hidden">
      <h3>📩 Isi Pesan</h3>
      <div class="msg-meta"><strong>Subject:</strong> <span id="msg-subject">-</span></div>
      <div class="msg-meta"><strong>Dari:</strong> <span id="msg-from">-</span></div>
      <div class="msg-meta hidden" id="msg-attachments-row"><strong>Lampiran:</strong> <span id="msg-attachments"></span></div>

      <!--
        Isi email dirender di dalam iframe sandbox tanpa
        allow-scripts/allow-same-origin. Email dari pengirim luar
        tidak boleh bisa membaca session Supabase di localStorage
        halaman ini (XSS), dan CSP di srcdoc memblokir resource lain.
      -->
      <iframe
        id="message-frame"
        class="msg-frame hidden"
        sandbox=""
        referrerpolicy="no-referrer"
        title="Isi pesan email"></iframe>
      <pre id="message-text" class="msg-text hidden"></pre>

      <button id="btn-close-message" type="button" class="secondary" style="margin-top:10px;">Tutup</button>
    </div>

  </div>

  <!-- =========================================================
       DEPENDENSI NAVIGATION (WAJIB, urutan harus begini)
  ========================================================== -->

  <!-- 1. Supabase client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js" crossorigin="anonymous"></script>

  <!-- 2. Config (path absolut karena email.html di root) -->
  <script src="/assets/js/config.js"></script>

  <!-- 3. Navigation (path absolut) -->
  <script src="/navigation/navigation.js?v=tempmail-20261108"></script>

  <!-- =========================================================
       TEMPMAIL LOGIC
  ========================================================== -->
  <script>
    (() => {
      "use strict";

      const AUTO_REFRESH_MS = 15000;
      const BODY_CSP = "default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; font-src https: data:; form-action 'none'; base-uri 'none'";

      let currentEmail = "";
      let autoRefreshTimer = null;
      let refreshInFlight = null;
      let lastMessageCount = -1;

      const emailContainer = document.querySelector(".email-container");
      const statusEl = document.getElementById("status");
      const btnGenerate = document.getElementById("btn-generate");
      const btnRefresh = document.getElementById("btn-refresh");
      const btnCopy = document.getElementById("btn-copy");
      const btnCloseMessage = document.getElementById("btn-close-message");
      const emailDisplay = document.getElementById("email-display");
      const emailText = document.getElementById("email-text");
      const inbox = document.getElementById("inbox");
      const inboxMeta = document.getElementById("inbox-meta");
      const messageList = document.getElementById("message-list");
      const messageView = document.getElementById("message-view");
      const msgSubject = document.getElementById("msg-subject");
      const msgFrom = document.getElementById("msg-from");
      const msgAttachmentsRow = document.getElementById("msg-attachments-row");
      const msgAttachments = document.getElementById("msg-attachments");
      const messageFrame = document.getElementById("message-frame");
      const messageText = document.getElementById("message-text");
      const btnDiagnostics = document.getElementById("btn-diagnostics");
      const diagnosticsBox = document.getElementById("diagnostics");
      const diagnosticsList = document.getElementById("diagnostics-list");

      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

      function setStatus(message, type) {
        statusEl.textContent = message || "";
        statusEl.className = "status" + (type ? " " + type : "");
      }

      function setLoading(btn, isLoading, text) {
        if (isLoading) {
          btn.disabled = true;
          if (!btn.dataset.originalText) btn.dataset.originalText = btn.innerHTML;
          btn.innerHTML = '<span class="spinner"></span>' + text;
        } else {
          btn.disabled = false;
          if (btn.dataset.originalText) {
            btn.innerHTML = btn.dataset.originalText;
            delete btn.dataset.originalText;
          }
        }
      }

      function showNotice(message) {
        if (!emailContainer) return;
        emailContainer.classList.add("notice");
        emailContainer.textContent = "";
        const heading = document.createElement("h1");
        heading.textContent = "Akses terbatas";
        const subtitle = document.createElement("div");
        subtitle.className = "subtitle";
        subtitle.textContent = message;
        emailContainer.append(heading, subtitle);
        emailContainer.style.visibility = "visible";
      }

      async function resolveRole() {
        if (window.GENZNavigationReady) {
          try {
            await Promise.race([window.GENZNavigationReady, sleep(12000)]);
          } catch {
            /* lanjut memakai role yang tersedia */
          }
        } else {
          const deadline = Date.now() + 8000;
          while (!window.GENZNavigation && Date.now() < deadline) {
            await sleep(150);
          }
        }

        const role = window.GENZNavigation?.getRole?.() || window.GENZ_NAVIGATION_ROLE || "";
        return String(role).trim().toLowerCase();
      }

      /*
       * Guard tampilan: halaman hanya dirender untuk admin/owner.
       * Ini bukan pengamanan utama — server (/api/tempmail) tetap
       * memeriksa JWT + role pada setiap request.
       */
      const tempmailAccessReady = (async () => {
        const role = await resolveRole();

        if (role !== "admin" && role !== "owner") {
          if (!window.GENZNavigation && !window.GENZ_NAVIGATION_ROLE) {
            showNotice("Navigasi belum siap dimuat. Muat ulang halaman ini, lalu coba lagi.");
          } else {
            showNotice("Fitur ini hanya tersedia untuk role admin atau owner.");
          }
          return false;
        }

        if (emailContainer) emailContainer.style.visibility = "visible";
        return true;
      })();

      async function getAccessToken(forceRefresh = false) {
        let refreshedToken = "";

        if (window.GENZSession?.ensureFreshSession) {
          try {
            const session = await window.GENZSession.ensureFreshSession({ force: forceRefresh });
            if (session?.access_token) refreshedToken = String(session.access_token);
          } catch {
            /* lanjut dengan session yang tersedia di client */
          }
        }

        const client = window.GENZ_SUPABASE || window.supabaseClient;
        if (!client?.auth?.getSession) {
          if (refreshedToken) return refreshedToken;
          throw new Error("Session Supabase tidak tersedia. Silakan login kembali.");
        }

        const { data, error } = await client.auth.getSession();
        const clientToken = data?.session?.access_token;

        /*
         * Token hasil ensureFreshSession() adalah token yang baru
         * divalidasi/di-refresh, jadi dipakai lebih dulu. getSession()
         * hanya cadangan bila helper session tidak menyediakan token.
         */
        const accessToken = refreshedToken || clientToken;

        if (error || !accessToken) {
          throw new Error("Silakan login terlebih dahulu untuk menggunakan TempMail.");
        }

        return accessToken;
      }

      /*
       * Semua request TempMail:
       * - token selalu disegarkan (ensureFreshSession) sebelum dipakai
       * - 401 sekali dicoba ulang dengan token baru
       * - body non-JSON (mis. halaman error Cloudflare) tidak membuat
       *   pesan error "Unexpected token"
       */
      async function tempmailRequest(url, options = {}, attempt = 0) {
        if (!(await tempmailAccessReady)) {
          throw new Error("Fitur ini hanya tersedia untuk role admin atau owner.");
        }

        const accessToken = await getAccessToken(attempt > 0);

        const response = await fetch(url, {
          ...options,
          cache: "no-store",
          headers: {
            ...(options.headers || {}),
            Authorization: `Bearer ${accessToken}`
          }
        });

        const raw = await response.text();
        let payload = null;
        if (raw) {
          try {
            payload = JSON.parse(raw);
          } catch {
            payload = null;
          }
        }

        if (response.status === 401 && attempt === 0) {
          return tempmailRequest(url, options, 1);
        }

        if (!response.ok) {
          const parts = [
            String(payload?.error || payload?.detail || `Permintaan TempMail gagal (HTTP ${response.status}).`)
          ];
          if (payload?.error && payload?.detail) parts.push("Detail: " + String(payload.detail));
          if (payload?.hint) parts.push("Hint: " + String(payload.hint));
          throw new Error(parts.join(" "));
        }

        if (payload === null) {
          throw new Error("Respons server TempMail tidak valid. Coba lagi.");
        }

        return payload;
      }

      function startAutoRefresh() {
        stopAutoRefresh();
        autoRefreshTimer = window.setInterval(() => {
          if (!currentEmail || document.hidden) return;
          void checkMessages(true);
        }, AUTO_REFRESH_MS);
      }

      function stopAutoRefresh() {
        if (autoRefreshTimer) {
          clearInterval(autoRefreshTimer);
          autoRefreshTimer = null;
        }
      }

      function applyAlias(email) {
        currentEmail = String(email || "");
        emailText.textContent = currentEmail;
        emailDisplay.classList.remove("hidden");
        btnRefresh.classList.remove("hidden");
        startAutoRefresh();
      }

      function renderAttachments(attachments) {
        msgAttachments.textContent = "";
        const list = Array.isArray(attachments) ? attachments : [];

        if (!list.length) {
          msgAttachmentsRow.classList.add("hidden");
          return;
        }

        for (const file of list) {
          const chip = document.createElement("span");
          chip.className = "msg-attachment";
          const name = file?.filename || "lampiran";
          const size = Number(file?.size) > 0
            ? ` (${Math.max(1, Math.round(Number(file.size) / 1024))} KB)`
            : "";
          chip.textContent = name + size;
          msgAttachments.appendChild(chip);
        }

        msgAttachmentsRow.classList.remove("hidden");
      }

      function closeMessageBody() {
        messageFrame.removeAttribute("srcdoc");
        messageFrame.classList.add("hidden");
        messageText.textContent = "";
        messageText.classList.add("hidden");
      }

      function renderMessageBody(message) {
        closeMessageBody();

        const html = typeof message?.bodyHtml === "string" ? message.bodyHtml.trim() : "";
        const text = typeof message?.bodyText === "string" ? message.bodyText : "";

        if (html) {
          messageFrame.srcdoc = [
            "<!DOCTYPE html><html><head><meta charset=\"utf-8\">",
            `<meta http-equiv="Content-Security-Policy" content="${BODY_CSP}">`,
            "<base target=\"_blank\">",
            "<style>html,body{margin:0;padding:12px;background:#fff;color:#101828;",
            "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;",
            "font-size:14px;line-height:1.5;word-break:break-word}",
            "img{max-width:100%;height:auto}a{color:#0b63ce}",
            "table{max-width:100%}</style></head><body>",
            html,
            "</body></html>"
          ].join("");
          messageFrame.classList.remove("hidden");
          return;
        }

        messageText.textContent = text || "Tidak ada konten pada pesan ini.";
        messageText.classList.remove("hidden");
      }

      function formatClock(date) {
        try {
          return date.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        } catch {
          return "";
        }
      }

      function renderMessages(messages, silent) {
        messageList.textContent = "";

        if (!messages.length) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "Belum ada pesan. Tunggu beberapa saat lalu refresh.";
          messageList.appendChild(empty);
          inboxMeta.textContent = "Diperbarui " + formatClock(new Date());
          if (!silent) setStatus("📭 Belum ada pesan masuk.", "success");
          inbox.classList.remove("hidden");
          lastMessageCount = 0;
          return;
        }

        for (const message of messages) {
          const item = document.createElement("div");
          item.className = "msg-item";
          item.setAttribute("role", "button");
          item.tabIndex = 0;

          const subject = document.createElement("div");
          subject.className = "msg-subject";
          subject.textContent = message.subject || "(tanpa subject)";

          const from = document.createElement("div");
          from.className = "msg-from";
          from.textContent = "Dari: " + (message.from || "-");

          item.append(subject, from);

          if (message.preview) {
            const preview = document.createElement("div");
            preview.className = "msg-preview";
            preview.textContent = message.preview;
            item.appendChild(preview);
          }

          const openMessage = () => {
            void showMessage(message.id);
          };

          item.addEventListener("click", openMessage);
          item.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openMessage();
            }
          });

          messageList.appendChild(item);
        }

        inboxMeta.textContent = `${messages.length} pesan · diperbarui ${formatClock(new Date())}`;
        inbox.classList.remove("hidden");

        if (!silent || messages.length !== lastMessageCount) {
          setStatus(`📬 ${messages.length} pesan ditemukan.`, "success");
        }
        lastMessageCount = messages.length;
      }

      async function checkMessages(silent = false) {
        if (!currentEmail) {
          if (!silent) setStatus("⚠️ Buat email dulu.", "error");
          return;
        }

        if (refreshInFlight) return refreshInFlight;

        const requestedEmail = currentEmail;
        if (!silent) setStatus("🔄 Memuat pesan...");

        refreshInFlight = (async () => {
          try {
            const messages = await tempmailRequest(
              `/api/tempmail?action=messages&email=${encodeURIComponent(requestedEmail)}`
            );

            // Abaikan hasil lama bila alias sudah berganti saat request berjalan.
            if (requestedEmail !== currentEmail) return;

            renderMessages(Array.isArray(messages) ? messages : [], silent);
          } catch (error) {
            setStatus("❌ Gagal memuat inbox: " + error.message, "error");
          } finally {
            refreshInFlight = null;
          }
        })();

        return refreshInFlight;
      }

      async function showMessage(id) {
        if (!id) {
          setStatus("❌ Pesan ini tidak memiliki ID yang valid.", "error");
          return;
        }

        setStatus("🔄 Memuat isi pesan...");

        try {
          const message = await tempmailRequest(
            `/api/tempmail?action=message&email=${encodeURIComponent(currentEmail)}&messageId=${encodeURIComponent(id)}`
          );

          msgSubject.textContent = message.subject || "(tanpa subject)";
          msgFrom.textContent = message.from || "-";
          renderAttachments(message.attachments);
          renderMessageBody(message);
          messageView.classList.remove("hidden");

          try {
            messageView.scrollIntoView({ behavior: "smooth", block: "start" });
          } catch {
            /* browser lama: abaikan */
          }

          setStatus("");
        } catch (error) {
          setStatus("❌ Gagal memuat pesan: " + error.message, "error");
        }
      }

      async function loadExistingAlias() {
        if (!(await tempmailAccessReady)) return;

        setStatus("🔄 Memeriksa email aktif...");

        try {
          const alias = await tempmailRequest("/api/tempmail?action=alias");

          if (alias?.email) {
            applyAlias(alias.email);
            setStatus("✅ Email aktif dimuat.", "success");
            await checkMessages(true);
          } else {
            setStatus("Belum ada email. Klik \"Buat Email\" untuk membuat alamat baru.");
          }
        } catch (error) {
          setStatus("❌ " + error.message, "error");
        }
      }

      /* ===================== DIAGNOSTIK KONFIGURASI =====================
         Menjawab error "Periksa konfigurasi Supabase dan provider":
         action=diagnostics melaporkan tiap tahap tanpa membocorkan secret. */
      function appendDiagnosticsLine(parent, text, className) {
        const line = document.createElement("div");
        line.className = className;
        line.textContent = text;
        parent.appendChild(line);
      }

      function renderDiagnostics(data) {
        diagnosticsList.replaceChildren();
        appendDiagnosticsLine(
          diagnosticsList,
          data?.ok ? "✅ Semua pemeriksaan lulus." : "❌ Ada konfigurasi yang belum siap.",
          "msg-subject"
        );

        const config = data?.config || {};
        appendDiagnosticsLine(
          diagnosticsList,
          "SUPABASE_URL=" + Boolean(config.supabase_url) +
            " · ANON_KEY=" + Boolean(config.supabase_anon_key) +
            " · SERVICE_ROLE_KEY=" + Boolean(config.supabase_service_role_key) +
            " · TEMPMAIL_API_URL=" + Boolean(config.tempmail_api_url) +
            (config.tempmail_api_host ? " (" + config.tempmail_api_host + ")" : "") +
            (config.tempmail_api_self_reference ? " ⚠️ self-reference" : "") +
            " · provider=" + (config.preferred_provider || "gmail"),
          "msg-meta"
        );

        for (const check of Array.isArray(data?.checks) ? data.checks : []) {
          const item = document.createElement("div");
          item.className = "msg-item";
          appendDiagnosticsLine(
            item,
            (check.ok ? "✅ " : "❌ ") + check.name + " · HTTP " + (check.status ?? "-"),
            "msg-subject"
          );
          if (check.detail) appendDiagnosticsLine(item, "Detail: " + String(check.detail), "msg-meta");
          if (check.hint) appendDiagnosticsLine(item, "Hint: " + String(check.hint), "msg-meta");
          if (Array.isArray(check.endpoints) && check.endpoints.length) {
            const probeLine = check.endpoints.map(entry =>
              entry.path + "=" + (entry.status || "network-error") +
              (entry.json ? " (JSON)" : " (non-JSON)")
            ).join(", ");
            appendDiagnosticsLine(item, "Probe: " + probeLine, "msg-meta");
          }
          if (check.capabilities && Object.keys(check.capabilities).length) {
            const caps = check.capabilities;
            appendDiagnosticsLine(
              item,
              "Endpoint inti: /api/email=" + Boolean(caps.create_email) +
                " · /messages=" + Boolean(caps.messages) +
                " · /api/providers=" + Boolean(caps.providers) +
                " · /api/health=" + Boolean(caps.health),
              "msg-meta"
            );
          }
          if (Array.isArray(check.providers)) {
            const providersMissing = Array.isArray(check.endpoints) &&
              check.endpoints.some(entry => entry.path === "/api/providers" && entry.status === 404);
            const list = check.providers.length
              ? check.providers.map(entry => entry.name + (entry.disabled ? " (nonaktif)" : " (aktif)")).join(", ")
              : (providersMissing
                  ? "/api/providers tidak tersedia (endpoint opsional, bukan kerusakan)"
                  : "tidak ada data provider");
            appendDiagnosticsLine(item, "Provider: " + list, "msg-meta");
          }
          diagnosticsList.appendChild(item);
        }
        diagnosticsBox.classList.remove("hidden");
      }

      btnDiagnostics.addEventListener("click", async () => {
        setLoading(btnDiagnostics, true, "Memeriksa...");
        try {
          const data = await tempmailRequest("/api/tempmail?action=diagnostics");
          renderDiagnostics(data);
          setStatus(
            data?.ok
              ? "✅ Konfigurasi TempMail siap."
              : "⚠️ Ada pemeriksaan yang gagal — lihat detail diagnostik di bawah.",
            data?.ok ? "success" : "error"
          );
        } catch (error) {
          setStatus("❌ Error diagnostik: " + error.message, "error");
        } finally {
          setLoading(btnDiagnostics, false);
        }
      });

      btnGenerate.addEventListener("click", async () => {
        setLoading(btnGenerate, true, "Menghubungi server...");
        setStatus("");

        try {
          const data = await tempmailRequest("/api/tempmail?action=create", { method: "POST" });

          if (!data?.email) {
            throw new Error("Server tidak mengembalikan alamat email.");
          }

          applyAlias(data.email);
          messageView.classList.add("hidden");
          closeMessageBody();
          setStatus(
            data.reused
              ? "✅ Email aktif dipakai kembali (alamat tidak berubah)."
              : "✅ Email berhasil dibuat.",
            "success"
          );
          await checkMessages(true);
        } catch (error) {
          setStatus("❌ Gagal membuat email: " + error.message, "error");
        } finally {
          setLoading(btnGenerate, false);
        }
      });

      btnCopy.addEventListener("click", async () => {
        if (!currentEmail) return;

        const markCopied = () => {
          btnCopy.textContent = "✅ Tersalin";
          setTimeout(() => { btnCopy.textContent = "📋 Salin"; }, 1500);
        };

        try {
          await navigator.clipboard.writeText(currentEmail);
          markCopied();
        } catch {
          try {
            const temp = document.createElement("textarea");
            temp.value = currentEmail;
            temp.setAttribute("readonly", "readonly");
            temp.style.position = "fixed";
            temp.style.opacity = "0";
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            markCopied();
          } catch {
            setStatus("❌ Gagal menyalin. Salin manual dari alamat di atas.", "error");
          }
        }
      });

      btnRefresh.addEventListener("click", () => {
        void checkMessages(false);
      });

      btnCloseMessage.addEventListener("click", () => {
        messageView.classList.add("hidden");
        closeMessageBody();
      });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && currentEmail) {
          void checkMessages(true);
        }
      });

      window.addEventListener("pagehide", stopAutoRefresh);

      void (async () => {
        if (await tempmailAccessReady) {
          await loadExistingAlias();
        }
      })();
    })();
  </script>
</body>
</html>
