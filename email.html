<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinaapi - Temp Mail</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #0a0a0a; color: #eee; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .box { border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 8px; }
    .msg-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #222; }
    .msg-item:hover { background: #1a1a1a; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Chinaapi - Temp Gmail</h1>
  <button id="btn-generate">Generate Email Gmail</button>

  <div id="email-display" class="box hidden">
    <strong>Email Kamu:</strong> <span id="email-text"></span>
    <br><button id="btn-check">Cek Pesan Masuk</button>
  </div>

  <div id="inbox" class="box hidden">
    <h3>Pesan Masuk</h3>
    <div id="message-list"></div>
  </div>

  <div id="message-view" class="box hidden">
    <h3>Isi Pesan</h3>
    <div id="message-content"></div>
    <button onclick="document.getElementById('message-view').classList.add('hidden')">Tutup</button>
  </div>

  <script>
    let currentEmail = '';
    let currentToken = '';

    document.getElementById('btn-generate').addEventListener('click', async () => {
      const res = await fetch('/tempmail?action=create', { method: 'POST' });
      const data = await res.json();
      if (data.email) {
        currentEmail = data.email;
        currentToken = data.token;
        document.getElementById('email-text').textContent = data.email;
        document.getElementById('email-display').classList.remove('hidden');
        document.getElementById('inbox').classList.add('hidden');
        document.getElementById('message-view').classList.add('hidden');
      } else {
        alert('Gagal generate email: ' + (data.error || 'Unknown error'));
      }
    });

    document.getElementById('btn-check').addEventListener('click', async () => {
      const res = await fetch(`/tempmail?action=messages&email=${encodeURIComponent(currentEmail)}&token=${encodeURIComponent(currentToken)}`);
      const messages = await res.json();
      const list = document.getElementById('message-list');
      list.innerHTML = '';
      if (Array.isArray(messages) && messages.length > 0) {
        messages.forEach(msg => {
          const div = document.createElement('div');
          div.className = 'msg-item';
          div.textContent = `${msg.subject} — ${msg.from_addr}`;
          div.addEventListener('click', () => showMessage(msg.id));
          list.appendChild(div);
        });
      } else {
        list.innerHTML = '<p>Belum ada pesan.</p>';
      }
      document.getElementById('inbox').classList.remove('hidden');
    });

    async function showMessage(id) {
      const res = await fetch(`/tempmail?action=message&email=${encodeURIComponent(currentEmail)}&token=${encodeURIComponent(currentToken)}&messageId=${encodeURIComponent(id)}`);
      const msg = await res.json();
      document.getElementById('message-content').innerHTML = `
        <p><strong>Subject:</strong> ${msg.subject || '-'}</p>
        <p><strong>Dari:</strong> ${msg.from_addr || '-'}</p>
        <hr>
        <div>${msg.body_html || msg.body_text || 'Tidak ada konten'}</div>
      `;
      document.getElementById('message-view').classList.remove('hidden');
    }
  </script>
</body>
</html>
