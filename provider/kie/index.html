<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GEN-Z.AI — KIE Terminal</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/config.js"></script>

    <style>
        :root {
            --bg: #05070b;
            --panel: #0c1017;
            --panel-soft: #111722;
            --border: rgba(255,255,255,.08);
            --text: #f5f7fb;
            --muted: #8d97a8;
            --accent: #8b5cf6;
            --accent-2: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(99,102,241,.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 100% 0%,
                    rgba(139,92,246,.12),
                    transparent 28%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        .app {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );

            font-weight: 900;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 900;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 9px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            padding: 7px 10px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: rgba(255,255,255,.025);

            color: var(--muted);

            font-size: 9px;
            font-weight: 800;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--success);
        }

        .terminal {
            border: 1px solid var(--border);
            border-radius: 20px;

            overflow: hidden;

            background:
                linear-gradient(
                    180deg,
                    rgba(17,23,34,.94),
                    rgba(8,11,16,.96)
                );

            box-shadow:
                0 30px 100px rgba(0,0,0,.35);
        }

        .terminal-header {
            min-height: 62px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            padding: 0 18px;

            border-bottom: 1px solid var(--border);
        }

        .terminal-title {
            font-size: 12px;
            font-weight: 850;
        }

        .terminal-subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 8px;
        }

        .terminal-body {
            padding: 18px;
        }

        .grid {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 14px;
        }

        .field {
            min-width: 0;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: #b5bdca;

            font-size: 9px;
            font-weight: 800;
        }

        input,
        textarea,
        select {
            width: 100%;

            border: 1px solid var(--border);
            border-radius: 11px;

            outline: none;

            background: rgba(0,0,0,.22);

            color: var(--text);
        }

        input,
        select {
            height: 42px;
            padding: 0 11px;

            font-size: 10px;
        }

        textarea {
            min-height: 130px;

            padding: 11px;

            resize: vertical;

            font-size: 10px;
            line-height: 1.6;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(139,92,246,.45);

            box-shadow:
                0 0 0 4px rgba(139,92,246,.06);
        }

        select option {
            background: #111722;
        }

        .model-card {
            margin-bottom: 16px;
            padding: 14px;

            border: 1px solid rgba(139,92,246,.16);
            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    rgba(139,92,246,.08),
                    rgba(99,102,241,.025)
                );
        }

        .model-label {
            color: var(--muted);

            font-size: 8px;

            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .model-id {
            margin-top: 6px;

            color: #d8ccff;

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 11px;
            font-weight: 800;

            word-break: break-all;
        }

        .model-name {
            margin-top: 6px;

            color: #dce2ec;

            font-size: 10px;
            font-weight: 700;
        }

        .model-source {
            margin-top: 5px;

            color: #626d7d;

            font-size: 8px;
        }

        .workflow-info {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 10px;

            margin-bottom: 16px;
        }

        .info-box {
            padding: 10px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: rgba(255,255,255,.02);
        }

        .info-label {
            color: var(--muted);

            font-size: 7px;

            text-transform: uppercase;
            letter-spacing: .1em;
        }

        .info-value {
            margin-top: 5px;

            color: #dce2ec;

            font-size: 9px;
            font-weight: 800;

            word-break: break-word;
        }

        .parameter-description {
            margin-top: 5px;

            color: #6f7a8c;

            font-size: 7px;
            line-height: 1.5;
        }

        .required {
            color: #fca5a5;
        }

        .loading {
            color: var(--muted);
        }

        .error {
            color: #fca5a5;
        }

        .actions {
            display: flex;
            justify-content: flex-end;

            gap: 9px;

            margin-top: 16px;
        }

        .button {
            min-height: 42px;

            padding: 0 16px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: rgba(255,255,255,.035);

            color: #e9edf4;

            cursor: pointer;

            font-size: 10px;
            font-weight: 800;
        }

        .button:hover {
            background: rgba(255,255,255,.06);
        }

        .button.primary {
            border-color: transparent;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );

            color: #fff;
        }

        .button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .response {
            margin-top: 16px;

            padding: 14px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: rgba(0,0,0,.2);
        }

        .response-title {
            margin-bottom: 9px;

            color: #aeb7c5;

            font-size: 9px;
            font-weight: 800;
        }

        pre {
            margin: 0;

            max-height: 360px;

            overflow: auto;

            white-space: pre-wrap;
            word-break: break-word;

            color: #9faabd;

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 8px;
            line-height: 1.6;
        }

        .notice {
            margin-top: 14px;

            padding: 11px 13px;

            border: 1px solid rgba(245,158,11,.12);
            border-radius: 11px;

            background: rgba(245,158,11,.045);

            color: #bcae8a;

            font-size: 8px;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {

            .app {
                padding: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .workflow-info {
                grid-template-columns: 1fr;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                G
            </div>

            <div>

                <div class="brand-title">
                    GEN-Z.AI
                </div>

                <div class="brand-subtitle">
                    KIE.AI PROVIDER TERMINAL
                </div>

            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            KIE TERMINAL
        </div>

    </header>


    <main class="terminal">

        <div class="terminal-header">

            <div>

                <div class="terminal-title">
                    KIE Model Terminal
                </div>

                <div class="terminal-subtitle">
                    Konfigurasi model dan parameter dibaca dari Supabase
                </div>

            </div>

        </div>


        <div class="terminal-body">

            <div class="model-card">

                <div class="model-label">
                    Active Model
                </div>

                <div
                    id="modelId"
                    class="model-id loading"
                >
                    Membaca model...
                </div>

                <div
                    id="modelName"
                    class="model-name"
                ></div>

                <div class="model-source">
                    Source: public.kie_models
                </div>

            </div>


            <div
                id="workflowInfo"
                class="workflow-info hidden"
            >

                <div class="info-box">

                    <div class="info-label">
                        Workflow
                    </div>

                    <div
                        id="workflowValue"
                        class="info-value"
                    >
                        -
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Variant
                    </div>

                    <div
                        id="variantValue"
                        class="info-value"
                    >
                        -
                    </div>

                </div>

            </div>


            <div
                id="parameterGrid"
                class="grid"
            ></div>


            <div class="actions">

                <button
                    id="backButton"
                    class="button"
                    type="button"
                >
                    Kembali
                </button>

                <button
                    id="generateButton"
                    class="button primary"
                    type="button"
                    disabled
                >
                    Jalankan Model
                </button>

            </div>


            <div
                id="notice"
                class="notice hidden"
            ></div>


            <div class="response">

                <div class="response-title">
                    Terminal Response
                </div>

                <pre id="responseOutput">Menunggu konfigurasi...</pre>

            </div>

        </div>

    </main>

</div>


<script>
(function () {

    "use strict";


    const SUPABASE_URL =
        window.GENZ_CONFIG &&
        window.GENZ_CONFIG.SUPABASE_URL;


    const SUPABASE_KEY =
        window.GENZ_CONFIG &&
        window.GENZ_CONFIG.SUPABASE_KEY;


    const modelIdElement =
        document.getElementById("modelId");


    const modelNameElement =
        document.getElementById("modelName");


    const workflowInfoElement =
        document.getElementById("workflowInfo");


    const workflowValueElement =
        document.getElementById("workflowValue");


    const variantValueElement =
        document.getElementById("variantValue");


    const parameterGridElement =
        document.getElementById("parameterGrid");


    const generateButton =
        document.getElementById("generateButton");


    const backButton =
        document.getElementById("backButton");


    const noticeElement =
        document.getElementById("notice");


    const responseOutput =
        document.getElementById("responseOutput");


    let supabase = null;

    let activeModel = null;

    let activeWorkflow = null;

    let activeVariant = null;

    let activeParameters = [];

    let activeAdapter = null;


    function getRequestedModelId() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const fromUrl =
            params.get("model") ||
            params.get("model_id");


        if (fromUrl) {
            return fromUrl.trim();
        }


        const fromSession =
            sessionStorage.getItem(
                "GENZ_ACTIVE_MODEL_ID"
            );


        if (fromSession) {
            return fromSession.trim();
        }


        const fromLocal =
            localStorage.getItem(
                "GENZ_ACTIVE_MODEL_ID"
            );


        if (fromLocal) {
            return fromLocal.trim();
        }


        return "";
    }


    function getRequestedWorkflowId() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        return (
            params.get("workflow_id") ||
            sessionStorage.getItem(
                "GENZ_ACTIVE_WORKFLOW_ID"
            ) ||
            ""
        ).trim();
    }


    function getRequestedVariantId() {

        const params =
            new URLSearchParams(
                window.location.search
            );


        return (
            params.get("variant_id") ||
            sessionStorage.getItem(
                "GENZ_ACTIVE_VARIANT_ID"
            ) ||
            ""
        ).trim();
    }


    function showNotice(message) {

        noticeElement.textContent =
            message;

        noticeElement.classList.remove(
            "hidden"
        );

    }


    function hideNotice() {

        noticeElement.textContent = "";

        noticeElement.classList.add(
            "hidden"
        );

    }


    function setResponse(data) {

        try {

            responseOutput.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        } catch {

            responseOutput.textContent =
                String(data);

        }

    }


    function modelIdToFileName(modelId) {

        return modelId
            .replaceAll("/", "-")
            .replaceAll("_", "-")
            .toLowerCase();

    }


    async function loadAdapter(modelId) {

        const fileName =
            modelIdToFileName(modelId);


        return import(
            `./${fileName}.js`
        );

    }


    function getParameterValue(parameter) {

        const element =
            document.getElementById(
                `parameter-${parameter.id}`
            );


        if (!element) {
            return undefined;
        }


        if (
            parameter.type === "boolean"
        ) {

            return element.checked;

        }


        if (
            parameter.type === "number" ||
            parameter.type === "integer"
        ) {

            if (
                element.value === ""
            ) {
                return undefined;
            }

            return Number(
                element.value
            );

        }


        if (
            parameter.type === "array" ||
            parameter.type === "object"
        ) {

            if (
                !element.value.trim()
            ) {
                return undefined;
            }


            try {

                return JSON.parse(
                    element.value
                );

            } catch {

                throw new Error(
                    `Parameter ${parameter.parameter_name} harus berupa JSON yang valid.`
                );

            }

        }


        const value =
            element.value.trim();


        if (!value) {
            return undefined;
        }


        return value;

    }


    function createInput(parameter) {

        const wrapper =
            document.createElement("div");


        wrapper.className =
            "field";


        const label =
            document.createElement("label");


        label.htmlFor =
            `parameter-${parameter.id}`;


        label.textContent =
            parameter.label ||
            parameter.parameter_name;


        if (parameter.required) {

            const required =
                document.createElement("span");

            required.className =
                "required";

            required.textContent =
                " *";

            label.appendChild(
                required
            );

        }


        wrapper.appendChild(label);


        let input;


        const enumValues =
            Array.isArray(
                parameter.enum_values
            )
                ? parameter.enum_values
                : null;


        if (
            enumValues &&
            enumValues.length
        ) {

            input =
                document.createElement(
                    "select"
                );


            const placeholder =
                document.createElement(
                    "option"
                );

            placeholder.value = "";

            placeholder.textContent =
                "Pilih...";

            input.appendChild(
                placeholder
            );


            enumValues.forEach(
                function (value) {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        String(value);

                    option.textContent =
                        String(value);

                    input.appendChild(
                        option
                    );

                }
            );

        } else if (
            parameter.type === "boolean"
        ) {

            input =
                document.createElement(
                    "input"
                );

            input.type =
                "checkbox";


            input.style.width =
                "20px";

            input.style.height =
                "20px";

        } else if (
            parameter.type === "string" &&
            (
                parameter.parameter_name
                    .toLowerCase()
                    .includes("prompt") ||
                parameter.parameter_name
                    .toLowerCase()
                    .includes("description")
            )
        ) {

            input =
                document.createElement(
                    "textarea"
                );

        } else if (
            parameter.type === "array" ||
            parameter.type === "object"
        ) {

            input =
                document.createElement(
                    "textarea"
                );


            input.placeholder =
                parameter.type === "array"
                    ? "[]"
                    : "{}";

        } else {

            input =
                document.createElement(
                    "input"
                );


            if (
                parameter.type === "number" ||
                parameter.type === "integer"
            ) {

                input.type =
                    "number";


                if (
                    parameter.min_value !== null &&
                    parameter.min_value !== undefined
                ) {

                    input.min =
                        parameter.min_value;

                }


                if (
                    parameter.max_value !== null &&
                    parameter.max_value !== undefined
                ) {

                    input.max =
                        parameter.max_value;

                }

            } else if (
                parameter.type === "url"
            ) {

                input.type =
                    "url";

            } else {

                input.type =
                    "text";

            }

        }


        input.id =
            `parameter-${parameter.id}`;


        input.dataset.parameterName =
            parameter.parameter_name;


        input.dataset.apiMapping =
            parameter.api_mapping ||
            "";


        if (
            parameter.default_value !== null &&
            parameter.default_value !== undefined
        ) {

            if (
                parameter.type === "boolean"
            ) {

                input.checked =
                    Boolean(
                        parameter.default_value
                    );

            } else if (
                typeof parameter.default_value ===
                "object"
            ) {

                input.value =
                    JSON.stringify(
                        parameter.default_value
                    );

            } else {

                input.value =
                    String(
                        parameter.default_value
                    );

            }

        }


        if (
            parameter.description
        ) {

            const description =
                document.createElement(
                    "div"
                );


            description.className =
                "parameter-description";


            description.textContent =
                parameter.description;


            wrapper.appendChild(
                input
            );

            wrapper.appendChild(
                description
            );

        } else {

            wrapper.appendChild(
                input
            );

        }


        if (
            parameter.parameter_name ===
            "prompt"
        ) {

            wrapper.classList.add(
                "full"
            );

        }


        return wrapper;

    }


    function renderParameters(parameters) {

        parameterGridElement.innerHTML =
            "";


        activeParameters =
            Array.isArray(parameters)
                ? parameters
                : [];


        activeParameters.forEach(
            function (parameter) {

                parameterGridElement.appendChild(
                    createInput(parameter)
                );

            }
        );


        if (
            !activeParameters.length
        ) {

            parameterGridElement.innerHTML =
                `
                    <div class="field full">
                        <div class="notice">
                            Tidak ada parameter aktif untuk workflow/variant ini.
                        </div>
                    </div>
                `;

        }

    }


    function filterWorkflow() {

        const requestedWorkflowId =
            getRequestedWorkflowId();


        if (
            requestedWorkflowId
        ) {

            const found =
                window.KIE_CONFIG.workflows.find(
                    function (workflow) {

                        return (
                            workflow.id ===
                            requestedWorkflowId
                        );

                    }
                );


            if (found) {
                return found;
            }

        }


        return (
            window.KIE_CONFIG.workflows[0] ||
            null
        );

    }


    function filterVariant(workflowId) {

        const requestedVariantId =
            getRequestedVariantId();


        const variants =
            window.KIE_CONFIG.variants.filter(
                function (variant) {

                    return (
                        variant.workflow_id ===
                        workflowId
                    );

                }
            );


        if (
            requestedVariantId
        ) {

            const found =
                variants.find(
                    function (variant) {

                        return (
                            variant.id ===
                            requestedVariantId
                        );

                    }
                );


            if (found) {
                return found;
            }

        }


        return variants[0] || null;

    }


    function filterParameters(
        workflowId,
        variantId
    ) {

        return window.KIE_CONFIG.parameters.filter(
            function (parameter) {

                if (
                    parameter.workflow_id !==
                    workflowId
                ) {
                    return false;
                }


                if (
                    parameter.variant_id &&
                    parameter.variant_id !==
                    variantId
                ) {
                    return false;
                }


                return true;

            }
        );

    }


    async function loadConfig() {

        hideNotice();

        generateButton.disabled =
            true;


        if (
            !SUPABASE_URL ||
            !SUPABASE_KEY
        ) {

            throw new Error(
                "Konfigurasi Supabase tidak tersedia."
            );

        }


        supabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const {
            data: sessionData
        } =
            await supabase.auth.getSession();


        const accessToken =
            sessionData &&
            sessionData.session &&
            sessionData.session.access_token;


        if (!accessToken) {

            throw new Error(
                "Session user tidak tersedia."
            );

        }


        const requestedModelId =
            getRequestedModelId();


        const query =
            new URLSearchParams();


        if (requestedModelId) {

            query.set(
                "model_id",
                requestedModelId
            );

        }


        const response =
            await fetch(
                `/api/kie-config?${query.toString()}`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${accessToken}`
                    }
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Gagal membaca konfigurasi KIE."
            );

        }


        window.KIE_CONFIG =
            result;


        if (
            !result.models ||
            !result.models.length
        ) {

            throw new Error(
                "Tidak ada model KIE ACTIVE."
            );

        }


        activeModel =
            result.models.find(
                function (model) {

                    return (
                        !requestedModelId ||
                        model.model_id ===
                        requestedModelId
                    );

                }
            ) ||
            result.models[0];


        if (!activeModel) {

            throw new Error(
                "Model KIE tidak ditemukan."
            );

        }


        modelIdElement.textContent =
            activeModel.model_id;


        modelIdElement.classList.remove(
            "loading",
            "error"
        );


        modelNameElement.textContent =
            activeModel.model_name ||
            activeModel.model_family ||
            "";


        sessionStorage.setItem(
            "GENZ_ACTIVE_MODEL_ID",
            activeModel.model_id
        );


        localStorage.setItem(
            "GENZ_ACTIVE_MODEL_ID",
            activeModel.model_id
        );


        const modelWorkflows =
            result.workflows.filter(
                function (workflow) {

                    return (
                        workflow.model_id ===
                        activeModel.id
                    );

                }
            );


        window.KIE_CONFIG.workflows =
            modelWorkflows;


        if (!modelWorkflows.length) {

            throw new Error(
                `Model ${activeModel.model_id} belum memiliki workflow aktif.`
            );

        }


        activeWorkflow =
            filterWorkflow();


        if (!activeWorkflow) {

            throw new Error(
                "Workflow KIE tidak ditemukan."
            );

        }


        window.KIE_CONFIG.variants =
            result.variants.filter(
                function (variant) {

                    const workflow =
                        modelWorkflows.find(
                            function (item) {

                                return (
                                    item.id ===
                                    variant.workflow_id
                                );

                            }
                        );


                    return Boolean(
                        workflow
                    );

                }
            );


        activeVariant =
            filterVariant(
                activeWorkflow.id
            );


        if (
            activeVariant
        ) {

            sessionStorage.setItem(
                "GENZ_ACTIVE_VARIANT_ID",
                activeVariant.id
            );

        }


        workflowValueElement.textContent =
            activeWorkflow.workflow_key ||
            activeWorkflow.workflow_type ||
            activeWorkflow.operation ||
            activeWorkflow.id;


        variantValueElement.textContent =
            activeVariant
                ? (
                    activeVariant.label ||
                    activeVariant.variant_key
                )
                : "Default";


        workflowInfoElement.classList.remove(
            "hidden"
        );


        const parameters =
            filterParameters(
                activeWorkflow.id,
                activeVariant
                    ? activeVariant.id
                    : null
            );


        renderParameters(
            parameters
        );


        try {

            activeAdapter =
                await loadAdapter(
                    activeModel.model_id
                );

        } catch (adapterError) {

            activeAdapter = null;

            showNotice(
                `Adapter untuk model ${activeModel.model_id} belum tersedia.`
            );

            setResponse({
                success: false,
                type: "ADAPTER_NOT_FOUND",
                model:
                    activeModel.model_id,
                message:
                    adapterError.message
            });

            return;

        }


        generateButton.disabled =
            typeof activeAdapter.generate !==
            "function";


        setResponse({
            success: true,
            type: "MODEL_READY",
            provider:
                result.provider ||
                "kie",
            model:
                activeModel.model_id,
            model_name:
                activeModel.model_name,
            workflow:
                activeWorkflow.workflow_key,
            variant:
                activeVariant
                    ? activeVariant.variant_key
                    : null,
            parameters:
                activeParameters.map(
                    function (parameter) {

                        return {
                            name:
                                parameter.parameter_name,

                            api_mapping:
                                parameter.api_mapping,

                            required:
                                parameter.required,

                            default:
                                parameter.default_value
                        };

                    }
                )
        });

    }


    async function runGenerate() {

        hideNotice();


        if (!activeModel) {

            showNotice(
                "Model belum siap."
            );

            return;

        }


        if (!activeWorkflow) {

            showNotice(
                "Workflow belum siap."
            );

            return;

        }


        if (
            !activeAdapter ||
            typeof activeAdapter.generate !==
            "function"
        ) {

            showNotice(
                "Adapter model tidak tersedia."
            );

            return;

        }


        const input = {};


        try {

            activeParameters.forEach(
                function (parameter) {

                    const value =
                        getParameterValue(
                            parameter
                        );


                    if (
                        value !== undefined
                    ) {

                        input[
                            parameter.parameter_name
                        ] = value;

                    }

                }
            );

        } catch (error) {

            showNotice(
                error.message
            );

            return;

        }


        const missing =
            activeParameters.filter(
                function (parameter) {

                    return (
                        parameter.required &&
                        (
                            input[
                                parameter.parameter_name
                            ] === undefined ||
                            input[
                                parameter.parameter_name
                            ] === null ||
                            input[
                                parameter.parameter_name
                            ] === ""
                        )
                    );

                }
            );


        if (missing.length) {

            showNotice(
                "Parameter wajib belum diisi: " +
                missing
                    .map(
                        function (parameter) {

                            return parameter.label ||
                                parameter.parameter_name;

                        }
                    )
                    .join(", ")
            );

            return;

        }


        generateButton.disabled =
            true;


        responseOutput.textContent =
            "Mengirim request...";


        try {

            const result =
                await activeAdapter.generate({

                    model:
                        activeModel.model_id,

                    workflow:
                        activeWorkflow.workflow_key,

                    variant:
                        activeVariant
                            ? activeVariant.variant_key
                            : undefined,

                    input

                });


            setResponse(
                result
            );

        } catch (error) {

            showNotice(
                error.message ||
                "Generation gagal."
            );


            setResponse({
                success: false,

                error:
                    error.message ||
                    String(error)
            });

        } finally {

            generateButton.disabled =
                !activeAdapter ||
                typeof activeAdapter.generate !==
                "function";

        }

    }


    generateButton.addEventListener(
        "click",
        runGenerate
    );


    backButton.addEventListener(
        "click",
        function () {

            if (
                window.history.length > 1
            ) {

                window.history.back();

                return;

            }


            window.location.href =
                "/provider/";

        }
    );


    loadConfig()
        .catch(
            function (error) {

                modelIdElement.textContent =
                    "Konfigurasi gagal dimuat.";

                modelIdElement.classList.remove(
                    "loading"
                );

                modelIdElement.classList.add(
                    "error"
                );


                showNotice(
                    error.message ||
                    "Gagal membaca konfigurasi KIE."
                );


                setResponse({
                    success: false,

                    error:
                        error.message ||
                        String(error)
                });

            }
        );

})();
</script>

</body>
</html>
