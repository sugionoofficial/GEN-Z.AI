<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GEN-Z.AI — KIE Terminal</title>

    <style>
        :root {
            --bg: #05070b;
            --panel: #0c1017;
            --panel-soft: #111722;
            --border: rgba(255,255,255,.08);
            --text: #f5f7fb;
            --muted: #8d97a8;
            --accent: #8b5cf6;
            --accent-2: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(99,102,241,.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 100% 0%,
                    rgba(139,92,246,.12),
                    transparent 28%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        .app {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );
            font-weight: 900;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 900;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 9px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,.025);
            color: var(--muted);
            font-size: 9px;
            font-weight: 800;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .terminal {
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            background:
                linear-gradient(
                    180deg,
                    rgba(17,23,34,.94),
                    rgba(8,11,16,.96)
                );
            box-shadow:
                0 30px 100px rgba(0,0,0,.35);
        }

        .terminal-header {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
        }

        .terminal-title {
            font-size: 12px;
            font-weight: 850;
        }

        .terminal-subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 8px;
        }

        .terminal-body {
            padding: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);
            gap: 14px;
        }

        .field {
            min-width: 0;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #b5bdca;
            font-size: 9px;
            font-weight: 800;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: rgba(0,0,0,.22);
            color: var(--text);
        }

        input,
        select {
            height: 42px;
            padding: 0 11px;
            font-size: 10px;
        }

        textarea {
            min-height: 130px;
            padding: 11px;
            resize: vertical;
            font-size: 10px;
            line-height: 1.6;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(139,92,246,.45);
            box-shadow:
                0 0 0 4px rgba(139,92,246,.06);
        }

        select option {
            background: #111722;
        }

        .model-card {
            padding: 14px;
            border: 1px solid rgba(139,92,246,.16);
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    rgba(139,92,246,.08),
                    rgba(99,102,241,.025)
                );
        }

        .model-label {
            color: var(--muted);
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .model-id {
            margin-top: 6px;
            color: #d8ccff;
            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;
            font-size: 11px;
            font-weight: 800;
            word-break: break-all;
        }

        .model-source {
            margin-top: 5px;
            color: #626d7d;
            font-size: 8px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            margin-top: 16px;
        }

        .button {
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: rgba(255,255,255,.035);
            color: #e9edf4;
            cursor: pointer;
            font-size: 10px;
            font-weight: 800;
        }

        .button:hover {
            background: rgba(255,255,255,.06);
        }

        .button.primary {
            border-color: transparent;
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );
            color: #fff;
        }

        .button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .response {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: rgba(0,0,0,.2);
        }

        .response-title {
            margin-bottom: 9px;
            color: #aeb7c5;
            font-size: 9px;
            font-weight: 800;
        }

        pre {
            margin: 0;
            max-height: 360px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #9faabd;
            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;
            font-size: 8px;
            line-height: 1.6;
        }

        .notice {
            margin-top: 14px;
            padding: 11px 13px;
            border: 1px solid rgba(245,158,11,.12);
            border-radius: 11px;
            background: rgba(245,158,11,.045);
            color: #bcae8a;
            font-size: 8px;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .app {
                padding: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                G
            </div>

            <div>
                <div class="brand-title">
                    GEN-Z.AI
                </div>

                <div class="brand-subtitle">
                    KIE.AI PROVIDER TERMINAL
                </div>
            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            KIE TERMINAL
        </div>

    </header>

    <main class="terminal">

        <div class="terminal-header">

            <div>
                <div class="terminal-title">
                    KIE Model Terminal
                </div>

                <div class="terminal-subtitle">
                    Dispatcher untuk seluruh model KIE.AI
                </div>
            </div>

        </div>

        <div class="terminal-body">

            <div
                id="modelCard"
                class="model-card"
            >

                <div class="model-label">
                    Active Model
                </div>

                <div
                    id="modelId"
                    class="model-id"
                >
                    Membaca model...
                </div>

                <div class="model-source">
                    Source: Supabase / Generate
                </div>

            </div>

            <div class="grid">

                <div class="field full">

                    <label for="prompt">
                        Prompt
                    </label>

                    <textarea
                        id="prompt"
                        placeholder="Masukkan prompt..."
                    ></textarea>

                </div>

                <div class="field">

                    <label for="ratio">
                        Aspect Ratio
                    </label>

                    <select id="ratio">

                        <option value="9:16">
                            9:16
                        </option>

                        <option value="16:9">
                            16:9
                        </option>

                        <option value="1:1">
                            1:1
                        </option>

                        <option value="4:3">
                            4:3
                        </option>

                        <option value="3:4">
                            3:4
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label for="duration">
                        Duration
                    </label>

                    <select id="duration">

                        <option value="5">
                            5 seconds
                        </option>

                        <option value="8" selected>
                            8 seconds
                        </option>

                        <option value="10">
                            10 seconds
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label for="resolution">
                        Resolution
                    </label>

                    <select id="resolution">

                        <option value="720p">
                            720p
                        </option>

                        <option value="1080p">
                            1080p
                        </option>

                        <option value="4k">
                            4K
                        </option>

                    </select>

                </div>

            </div>

            <div class="actions">

                <button
                    id="backButton"
                    class="button"
                    type="button"
                >
                    Kembali
                </button>

                <button
                    id="generateButton"
                    class="button primary"
                    type="button"
                >
                    Jalankan Model
                </button>

            </div>

            <div
                id="notice"
                class="notice hidden"
            ></div>

            <div class="response">

                <div class="response-title">
                    Terminal Response
                </div>

                <pre id="responseOutput">Menunggu request...</pre>

            </div>

        </div>

    </main>

</div>

<script>
(function () {

    "use strict";

    const API_ENDPOINT = "/api/generate";

    const modelIdElement =
        document.getElementById("modelId");

    const promptElement =
        document.getElementById("prompt");

    const ratioElement =
        document.getElementById("ratio");

    const durationElement =
        document.getElementById("duration");

    const resolutionElement =
        document.getElementById("resolution");

    const generateButton =
        document.getElementById("generateButton");

    const backButton =
        document.getElementById("backButton");

    const noticeElement =
        document.getElementById("notice");

    const responseOutput =
        document.getElementById("responseOutput");


    function getModelId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const fromUrl =
            params.get("model") ||
            params.get("model_id");

        if (fromUrl) {
            return fromUrl.trim();
        }

        const fromStorage =
            sessionStorage.getItem(
                "GENZ_ACTIVE_MODEL_ID"
            );

        if (fromStorage) {
            return fromStorage.trim();
        }

        const localStorageModel =
            localStorage.getItem(
                "GENZ_ACTIVE_MODEL_ID"
            );

        if (localStorageModel) {
            return localStorageModel.trim();
        }

        return "";
    }


    function setResponse(data) {

        try {

            responseOutput.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        } catch {

            responseOutput.textContent =
                String(data);

        }
    }


    function showNotice(message) {

        noticeElement.textContent =
            message;

        noticeElement.classList.remove(
            "hidden"
        );

    }


    function hideNotice() {

        noticeElement.classList.add(
            "hidden"
        );

        noticeElement.textContent = "";

    }


    function getRequestPayload() {

        return {

            provider: "kie_ai",

            model:
                getModelId(),

            prompt:
                promptElement.value.trim(),

            ratio:
                ratioElement.value,

            duration:
                durationElement.value,

            resolution:
                resolutionElement.value

        };

    }


    async function generate() {

        hideNotice();

        const payload =
            getRequestPayload();

        if (!payload.model) {

            showNotice(
                "Model belum tersedia. Pilih model aktif dari Generate/Admin Model terlebih dahulu."
            );

            return;

        }

        if (!payload.prompt) {

            showNotice(
                "Prompt belum diisi."
            );

            promptElement.focus();

            return;

        }

        generateButton.disabled = true;

        generateButton.textContent =
            "Mengirim...";

        setResponse({
            status: "processing",
            message:
                "Request sedang dikirim ke backend."
        });

        try {

            const response =
                await fetch(
                    API_ENDPOINT,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

            const contentType =
                response.headers.get(
                    "content-type"
                ) || "";

            let data;

            if (
                contentType.includes(
                    "application/json"
                )
            ) {

                data =
                    await response.json();

            } else {

                const text =
                    await response.text();

                data = {
                    success: response.ok,
                    status: response.status,
                    response: text
                };

            }

            setResponse(data);

            if (!response.ok) {

                showNotice(
                    data?.error ||
                    data?.message ||
                    "Request gagal."
                );

                return;

            }

            if (data?.success === false) {

                showNotice(
                    data?.error ||
                    "Request ditolak backend."
                );

                return;

            }

        } catch (error) {

            console.error(
                "KIE terminal error:",
                error
            );

            setResponse({
                success: false,
                error:
                    error?.message ||
                    "Tidak dapat terhubung ke backend."
            });

            showNotice(
                error?.message ||
                "Tidak dapat terhubung ke backend."
            );

        } finally {

            generateButton.disabled =
                false;

            generateButton.textContent =
                "Jalankan Model";

        }

    }


    function initialize() {

        const modelId =
            getModelId();

        if (modelId) {

            modelIdElement.textContent =
                modelId;

        } else {

            modelIdElement.textContent =
                "Belum ada model aktif";

            showNotice(
                "Terminal belum menerima model_id dari Supabase/Generate."
            );

        }

    }


    generateButton.addEventListener(
        "click",
        generate
    );


    backButton.addEventListener(
        "click",
        function () {

            if (
                document.referrer &&
                document.referrer.includes(
                    window.location.host
                )
            ) {

                window.history.back();

                return;

            }

            window.location.href =
                "../../generate/index.html";

        }
    );


    initialize();

})();
</script>

</body>
</html>
