<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GEN-Z.AI — KIE Terminal</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/config.js"></script>

    <style>
        :root {
            --bg: #05070b;
            --panel: #0c1017;
            --panel-soft: #111722;
            --border: rgba(255,255,255,.08);
            --text: #f5f7fb;
            --muted: #8d97a8;
            --accent: #8b5cf6;
            --accent-2: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(99,102,241,.14),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 100% 0%,
                    rgba(139,92,246,.12),
                    transparent 28%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        .app {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );
            font-weight: 900;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 900;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 9px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255,255,255,.025);
            color: var(--muted);
            font-size: 9px;
            font-weight: 800;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .terminal {
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            background:
                linear-gradient(
                    180deg,
                    rgba(17,23,34,.94),
                    rgba(8,11,16,.96)
                );
            box-shadow:
                0 30px 100px rgba(0,0,0,.35);
        }

        .terminal-header {
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
        }

        .terminal-title {
            font-size: 12px;
            font-weight: 850;
        }

        .terminal-subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 8px;
        }

        .terminal-body {
            padding: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);
            gap: 14px;
        }

        .field {
            min-width: 0;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            color: #b5bdca;
            font-size: 9px;
            font-weight: 800;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            background: rgba(0,0,0,.22);
            color: var(--text);
        }

        input,
        select {
            height: 42px;
            padding: 0 11px;
            font-size: 10px;
        }

        textarea {
            min-height: 130px;
            padding: 11px;
            resize: vertical;
            font-size: 10px;
            line-height: 1.6;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(139,92,246,.45);
            box-shadow:
                0 0 0 4px rgba(139,92,246,.06);
        }

        select option {
            background: #111722;
        }

        .model-card {
            margin-bottom: 16px;
            padding: 14px;
            border: 1px solid rgba(139,92,246,.16);
            border-radius: 13px;
            background:
                linear-gradient(
                    135deg,
                    rgba(139,92,246,.08),
                    rgba(99,102,241,.025)
                );
        }

        .model-label {
            color: var(--muted);
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .model-id {
            margin-top: 6px;
            color: #d8ccff;
            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;
            font-size: 11px;
            font-weight: 800;
            word-break: break-all;
        }

        .model-name {
            margin-top: 6px;
            color: #dce2ec;
            font-size: 10px;
            font-weight: 700;
        }

        .model-source {
            margin-top: 5px;
            color: #626d7d;
            font-size: 8px;
        }

        .loading {
            color: var(--muted);
        }

        .error {
            color: #fca5a5;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            margin-top: 16px;
        }

        .button {
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: rgba(255,255,255,.035);
            color: #e9edf4;
            cursor: pointer;
            font-size: 10px;
            font-weight: 800;
        }

        .button:hover {
            background: rgba(255,255,255,.06);
        }

        .button.primary {
            border-color: transparent;
            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );
            color: #fff;
        }

        .button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .response {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: rgba(0,0,0,.2);
        }

        .response-title {
            margin-bottom: 9px;
            color: #aeb7c5;
            font-size: 9px;
            font-weight: 800;
        }

        pre {
            margin: 0;
            max-height: 360px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #9faabd;
            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;
            font-size: 8px;
            line-height: 1.6;
        }

        .notice {
            margin-top: 14px;
            padding: 11px 13px;
            border: 1px solid rgba(245,158,11,.12);
            border-radius: 11px;
            background: rgba(245,158,11,.045);
            color: #bcae8a;
            font-size: 8px;
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            .app {
                padding: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                G
            </div>

            <div>
                <div class="brand-title">
                    GEN-Z.AI
                </div>

                <div class="brand-subtitle">
                    KIE.AI PROVIDER TERMINAL
                </div>
            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            KIE TERMINAL
        </div>

    </header>

    <main class="terminal">

        <div class="terminal-header">

            <div>
                <div class="terminal-title">
                    KIE Model Terminal
                </div>

                <div class="terminal-subtitle">
                    Model dipilih dari Supabase
                </div>
            </div>

        </div>

        <div class="terminal-body">

            <div class="model-card">

                <div class="model-label">
                    Active Model
                </div>

                <div
                    id="modelId"
                    class="model-id loading"
                >
                    Membaca model...
                </div>

                <div
                    id="modelName"
                    class="model-name"
                ></div>

                <div class="model-source">
                    Source: public.kie_models
                </div>

            </div>

            <div class="grid">

                <div class="field full">

                    <label for="prompt">
                        Prompt
                    </label>

                    <textarea
                        id="prompt"
                        placeholder="Masukkan prompt..."
                    ></textarea>

                </div>

                <div class="field">

                    <label for="ratio">
                        Aspect Ratio
                    </label>

                    <select id="ratio">

                        <option value="9:16">
                            9:16
                        </option>

                        <option value="16:9">
                            16:9
                        </option>

                        <option value="1:1">
                            1:1
                        </option>

                        <option value="4:3">
                            4:3
                        </option>

                        <option value="3:4">
                            3:4
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label for="duration">
                        Duration
                    </label>

                    <select id="duration">

                        <option value="5">
                            5 seconds
                        </option>

                        <option
                            value="8"
                            selected
                        >
                            8 seconds
                        </option>

                        <option value="10">
                            10 seconds
                        </option>

                    </select>

                </div>

                <div class="field">

                    <label for="resolution">
                        Resolution
                    </label>

                    <select id="resolution">

                        <option value="720p">
                            720p
                        </option>

                        <option value="1080p">
                            1080p
                        </option>

                        <option value="4k">
                            4K
                        </option>

                    </select>

                </div>

            </div>

            <div class="actions">

                <button
                    id="backButton"
                    class="button"
                    type="button"
                >
                    Kembali
                </button>

                <button
                    id="generateButton"
                    class="button primary"
                    type="button"
                    disabled
                >
                    Jalankan Model
                </button>

            </div>

            <div
                id="notice"
                class="notice hidden"
            ></div>

            <div class="response">

                <div class="response-title">
                    Terminal Response
                </div>

                <pre id="responseOutput">Menunggu model...</pre>

            </div>

        </div>

    </main>

</div>

<script>
(function () {

    "use strict";

    const SUPABASE_URL =
        window.GENZ_CONFIG &&
        window.GENZ_CONFIG.SUPABASE_URL;

    const SUPABASE_KEY =
        window.GENZ_CONFIG &&
        window.GENZ_CONFIG.SUPABASE_KEY;

    const modelIdElement =
        document.getElementById("modelId");

    const modelNameElement =
        document.getElementById("modelName");

    const promptElement =
        document.getElementById("prompt");

    const ratioElement =
        document.getElementById("ratio");

    const durationElement =
        document.getElementById("duration");

    const resolutionElement =
        document.getElementById("resolution");

    const generateButton =
        document.getElementById("generateButton");

    const backButton =
        document.getElementById("backButton");

    const noticeElement =
        document.getElementById("notice");

    const responseOutput =
        document.getElementById("responseOutput");

    let activeModel = null;
    let activeAdapter = null;


    function getRequestedModelId() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const fromUrl =
            params.get("model") ||
            params.get("model_id");

        if (fromUrl) {
            return fromUrl.trim();
        }

        const fromSession =
            sessionStorage.getItem(
                "GENZ_ACTIVE_MODEL_ID"
            );

        if (fromSession) {
            return fromSession.trim();
        }

        const fromLocal =
            localStorage.getItem(
                "GENZ_ACTIVE_MODEL_ID"
            );

        if (fromLocal) {
            return fromLocal.trim();
        }

        return "";
    }


    function showNotice(message) {

        noticeElement.textContent =
            message;

        noticeElement.classList.remove(
            "hidden"
        );

    }


    function hideNotice() {

        noticeElement.textContent = "";

        noticeElement.classList.add(
            "hidden"
        );

    }


    function setResponse(data) {

        try {

            responseOutput.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        } catch {

            responseOutput.textContent =
                String(data);

        }

    }


    function modelIdToFileName(modelId) {

        return modelId
            .replaceAll("/", "-")
            .replaceAll("_", "-")
            .toLowerCase();

    }


    async function loadAdapter(modelId) {

        const fileName =
            modelIdToFileName(modelId);

        const modulePath =
            `./${fileName}.js`;

        return import(modulePath);

    }


    async function loadModel() {

        hideNotice();

        generateButton.disabled = true;

        const requestedModelId =
            getRequestedModelId();

        if (!SUPABASE_URL || !SUPABASE_KEY) {

            modelIdElement.textContent =
                "Konfigurasi Supabase tidak tersedia.";

            modelIdElement.classList.remove(
                "loading"
            );

            modelIdElement.classList.add(
                "error"
            );

            showNotice(
                "GENZ_CONFIG tidak tersedia."
            );

            return;

        }

        try {

            const supabase =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

            let query =
                supabase
                    .from("kie_models")
                    .select(
                        "id,provider,model_family,model_id,model_name,status,documentation_url,metadata"
                    )
                    .eq(
                        "provider",
                        "kie"
                    )
                    .eq(
                        "status",
                        "ACTIVE"
                    );

            if (requestedModelId) {

                query =
                    query.eq(
                        "model_id",
                        requestedModelId
                    );

            } else {

                query =
                    query.order(
                        "model_name",
                        {
                            ascending: true
                        }
                    ).limit(1);

            }

            const {
                data,
                error
            } = await query;

            if (error) {
                throw error;
            }

            if (!data || !data.length) {

                throw new Error(
                    requestedModelId
                        ? `Model "${requestedModelId}" tidak ditemukan atau tidak ACTIVE.`
                        : "Tidak ada model KIE ACTIVE di Supabase."
                );

            }

            activeModel = data[0];

            modelIdElement.textContent =
                activeModel.model_id;

            modelIdElement.classList.remove(
                "loading",
                "error"
            );

            modelNameElement.textContent =
                activeModel.model_name ||
                activeModel.model_family ||
                "";

            sessionStorage.setItem(
                "GENZ_ACTIVE_MODEL_ID",
                activeModel.model_id
            );

            localStorage.setItem(
                "GENZ_ACTIVE_MODEL_ID",
                activeModel.model_id
            );

            try {

                activeAdapter =
                    await loadAdapter(
                        activeModel.model_id
                    );

            } catch (adapterError) {

                activeAdapter = null;

                showNotice(
                    `Adapter untuk model ${activeModel.model_id} belum tersedia.`
                );

                setResponse({
                    success: false,
                    type: "ADAPTER_NOT_FOUND",
                    model: activeModel.model_id,
                    message:
                        adapterError.message
                });

                return;

            }

            generateButton.disabled =
                typeof activeAdapter.generate !==
                "function";

            setResponse({
                success: true,
                type: "MODEL_READY",
                provider: "kie",
                model:
                    activeModel.model_id,
                model_name:
                    activeModel.model_name,
                adapter:
                    `./${modelIdToFileName(activeModel.model_id)}.js`
            });

        } catch (error) {

            modelIdElement.textContent =
                "Model gagal dimuat.";

            modelIdElement.classList.remove(
                "loading"
            );

            modelIdElement.classList.add(
                "error"
            );

            showNotice(
                error.message ||
                "Gagal membaca model KIE."
            );

            setResponse({
                success: false,
                error:
                    error.message ||
                    String(error)
            });

        }

    }


    async function runGenerate() {

        hideNotice();

        if (!activeModel) {

            showNotice(
                "Model belum siap."
            );

            return;

        }

        if (
            !activeAdapter ||
            typeof activeAdapter.generate !==
            "function"
        ) {

            showNotice(
                "Adapter model tidak tersedia."
            );

            return;

        }

        const prompt =
            promptElement.value.trim();

        if (!prompt) {

            showNotice(
                "Prompt wajib diisi."
            );

            promptElement.focus();

            return;

        }

        generateButton.disabled = true;

        responseOutput.textContent =
            "Mengirim request...";

        try {

            const result =
                await activeAdapter.generate({

                    prompt,

                    ratio:
                        ratioElement.value,

                    duration:
                        durationElement.value,

                    resolution:
                        resolutionElement.value

                });

            setResponse(result);

        } catch (error) {

            showNotice(
                error.message ||
                "Generation gagal."
            );

            setResponse({
                success: false,
                error:
                    error.message ||
                    String(error)
            });

        } finally {

            generateButton.disabled =
                !activeAdapter ||
                typeof activeAdapter.generate !==
                "function";

        }

    }


    generateButton.addEventListener(
        "click",
        runGenerate
    );


    backButton.addEventListener(
        "click",
        function () {

            if (
                window.history.length > 1
            ) {

                window.history.back();

                return;

            }

            window.location.href =
                "/provider/";

        }
    );


    loadModel();

})();
</script>

</body>
</html>
