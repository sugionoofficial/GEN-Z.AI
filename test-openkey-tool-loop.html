<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GEN-Z.AI - OpenKey Tool Loop Test
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 40px 20px;

            background:
                #090909;

            color:
                #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        .container {

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

        }

        h1 {

            margin: 0 0 10px;

            font-size: 28px;

        }

        .description {

            margin-bottom: 30px;

            color:
                #a8a8a8;

            line-height: 1.6;

        }

        .card {

            padding: 24px;

            border:
                1px solid #292929;

            border-radius: 14px;

            background:
                #111111;

            box-shadow:
                0 0 30px
                rgba(255, 0, 0, 0.08);

        }

        button {

            border: 0;

            border-radius: 10px;

            padding:
                13px 20px;

            background:
                #d60000;

            color:
                #ffffff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

        }

        button:hover {

            background:
                #f00000;

        }

        button:disabled {

            opacity: 0.5;

            cursor:
                not-allowed;

        }

        .status {

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            background:
                #181818;

            color:
                #cccccc;

            white-space:
                pre-wrap;

            line-height:
                1.6;

        }

        .result {

            margin-top: 20px;

            padding: 20px;

            border-radius: 10px;

            background:
                #050505;

            border:
                1px solid #242424;

            overflow-x:
                auto;

        }

        pre {

            margin: 0;

            white-space:
                pre-wrap;

            word-break:
                break-word;

            color:
                #d7d7d7;

            line-height:
                1.6;

        }

        .success {

            color:
                #62e66f;

        }

        .error {

            color:
                #ff5b5b;

        }

    </style>

</head>


<body>

<div class="container">

    <h1>
        OpenKey Tool Loop Test
    </h1>


    <div class="description">

        Pengujian internal GEN-Z.AI untuk memastikan
        autentikasi Supabase, credential OpenKey,
        OpenKey chat, tool calling, eksekusi tool,
        dan final response bekerja dalam satu alur.

    </div>


    <div class="card">

        <button
            id="runTest"
            type="button"
        >
            Jalankan Test
        </button>


        <div
            id="status"
            class="status"
        >
            Siap menjalankan test.
        </div>


        <div
            id="result"
            class="result"
            hidden
        >

            <pre
                id="resultOutput"
            ></pre>

        </div>

    </div>

</div>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

(function () {

    "use strict";


    /* =====================================================
       CONFIG
    ===================================================== */

    const SUPABASE_URL =
        "https://boeamhglmvkatnycluaa.supabase.co";


    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZWFtaGdsbXZrYXRueWNsdWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NDU0NTgsImV4cCI6MjEwNTAyMTQ1OH0.DGMQVaQSdkVAtq3wdFfw2lmU2s7XhgZWAki3TL0X7pQ";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const runButton =
        document.getElementById(
            "runTest"
        );


    const statusElement =
        document.getElementById(
            "status"
        );


    const resultElement =
        document.getElementById(
            "result"
        );


    const resultOutput =
        document.getElementById(
            "resultOutput"
        );


    /* =====================================================
       VALIDATE CONFIG
    ===================================================== */

    if (
        SUPABASE_URL.startsWith(
            "GANTI_"
        ) ||
        SUPABASE_ANON_KEY.startsWith(
            "GANTI_"
        )
    ) {

        statusElement.innerHTML =
            '<span class="error">' +
            'Supabase URL / Anon Key belum diisi.' +
            '</span>';

        runButton.disabled =
            true;

        return;

    }


    /* =====================================================
       CREATE SUPABASE CLIENT
    ===================================================== */

    const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* =====================================================
       STATUS HELPER
    ===================================================== */

    function setStatus(
        message,
        type = ""
    ) {

        statusElement.innerHTML =
            type
                ? `<span class="${type}">${message}</span>`
                : message;

    }


    /* =====================================================
       OUTPUT
    ===================================================== */

    function showResult(
        data
    ) {

        resultElement.hidden =
            false;

        resultOutput.textContent =
            JSON.stringify(
                data,
                null,
                4
            );

    }


    /* =====================================================
       RUN TEST
    ===================================================== */

    runButton.addEventListener(
        "click",
        async function () {

            runButton.disabled =
                true;


            resultElement.hidden =
                true;


            resultOutput.textContent =
                "";


            try {

                setStatus(
                    "Memeriksa Supabase session..."
                );


                /* =========================================
                   GET SESSION
                ========================================= */

                const {
                    data,
                    error
                } =
                    await supabase.auth.getSession();


                if (
                    error
                ) {

                    throw new Error(
                        `Supabase session error: ${error.message}`
                    );

                }


                const session =
                    data?.session;


                if (
                    !session ||
                    !session.access_token
                ) {

                    throw new Error(
                        "Tidak ada session Supabase aktif. Login ke GEN-Z.AI terlebih dahulu."
                    );

                }


                setStatus(
                    "Session Supabase ditemukan. Memanggil OpenKey Tool Loop..."
                );


                /* =========================================
                   CALL TEST API
                ========================================= */

                const response =
                    await fetch(
                        "/api/test-openkey-tool-loop",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                Authorization:
                                    `Bearer ${session.access_token}`

                            },

                            body:
                                JSON.stringify({

                                    test:
                                        true

                                })

                        }
                    );


                const responseText =
                    await response.text();


                let responseData;


                try {

                    responseData =
                        JSON.parse(
                            responseText
                        );

                }
                catch {

                    responseData = {

                        success:
                            false,

                        status:
                            response.status,

                        raw:
                            responseText

                    };

                }


                showResult(
                    responseData
                );


                /* =========================================
                   RESULT
                ========================================= */

                if (
                    response.ok &&
                    responseData.success ===
                        true
                ) {

                    setStatus(
                        "OPENKEY TOOL LOOP BERHASIL.",
                        "success"
                    );

                }
                else {

                    setStatus(
                        "OPENKEY TOOL LOOP GAGAL.",
                        "error"
                    );

                }

            }
            catch (error) {

                console.error(
                    "[OpenKey Tool Loop Test]",
                    error
                );


                showResult({

                    success:
                        false,

                    error:
                        error.message ||
                        String(
                            error
                        )

                });


                setStatus(
                    "Test gagal: " +
                    (
                        error.message ||
                        String(
                            error
                        )
                    ),
                    "error"
                );

            }
            finally {

                runButton.disabled =
                    false;

            }

        }
    );

})();

</script>

</body>

</html>
