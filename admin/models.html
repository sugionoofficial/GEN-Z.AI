<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Models - GEN-Z.AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e9edf2);
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 22px 16px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .brand-sub {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .nav a {
            text-decoration: none;
            color: #374151;
            padding: 12px 13px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav a:hover {
            background: #f3f4f6;
        }

        .nav a.active {
            background: #111827;
            color: #ffffff;
        }

        .logout {
            margin-top: 25px;
            width: 100%;
            border: 0;
            background: #f3f4f6;
            color: #111827;
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .logout:hover {
            background: #e5e7eb;
        }

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .page-subtitle {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .user-info {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.05);
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .card-title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .card-subtitle {
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-dark {
            background: #111827;
            color: #ffffff;
        }

        .btn-dark:hover {
            background: #1f2937;
        }

        .message {
            margin: 18px 20px 0;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 760px;
        }

        th,
        td {
            padding: 15px 18px;
            text-align: left;
            border-bottom: 1px solid #eef0f3;
            font-size: 13px;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 11px;
            letter-spacing: 0.5px;
            font-weight: 800;
        }

        td {
            color: #1f2937;
        }

        tr:hover td {
            background: #fafafa;
        }

        .provider-name {
            font-weight: 700;
        }

        .model-id {
            font-family: monospace;
            font-size: 12px;
            background: #f3f4f6;
            padding: 5px 7px;
            border-radius: 5px;
            display: inline-block;
        }

        .credit {
            font-weight: 800;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.inactive {
            background: #f3f4f6;
            color: #4b5563;
        }

        .status.maintenance {
            background: #fef3c7;
            color: #92400e;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: #6b7280;
        }

        .empty strong {
            display: block;
            color: #111827;
            margin-bottom: 8px;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 20px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 600px) {
            .layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #e5e7eb;
            }

            .nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">GEN-Z.AI</div>
        <div class="brand-sub">ADMIN CONTROL</div>

        <nav class="nav">
            <a href="dashboard.html">DASHBOARD</a>
            <a href="generate.html">GENERATE</a>
            <a href="history.html">HISTORY</a>
            <a href="admin-panel.html">ADMIN PANEL</a>
            <a href="models.html" class="active">MODELS</a>
            <a href="providers.html">PROVIDERS</a>
            <a href="credit.html">CREDIT</a>
        </nav>

        <button class="logout" onclick="logout()">
            LOG OUT
        </button>

    </aside>

    <main class="main">

        <div class="topbar">

            <div>
                <h1 class="page-title">MODEL MANAGEMENT</h1>
                <div class="page-subtitle">
                    Kelola dan pantau model AI yang tersedia di GEN-Z.AI
                </div>
            </div>

            <div class="user-info" id="userInfo">
                Memuat...
            </div>

        </div>

        <section class="card">

            <div class="card-header">

                <div>
                    <h2 class="card-title">AI MODELS</h2>
                    <div class="card-subtitle">
                        Daftar model berdasarkan provider yang terdaftar.
                    </div>
                </div>

                <button
                    class="btn btn-dark"
                    onclick="loadModels()"
                    id="refreshButton"
                >
                    REFRESH
                </button>

            </div>

            <div id="message" class="message"></div>

            <div id="modelContainer">

                <div class="loading">
                    Memuat model...
                </div>

            </div>

        </section>

    </main>

</div>

<script>

const supabaseClient = supabase.createClient(
    GENZ_CONFIG.SUPABASE_URL,
    GENZ_CONFIG.SUPABASE_KEY
);

let currentUser = null;
let providerCache = [];

function showMessage(text, type = "success") {

    const message = document.getElementById("message");

    message.textContent = text;
    message.className = "message " + type;

}

function clearMessage() {

    const message = document.getElementById("message");

    message.textContent = "";
    message.className = "message";

}

async function checkAuth() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (!session || !session.user) {

        window.location.href = "../index.html";
        return false;

    }

    currentUser = session.user;

    const {
        data: profile,
        error
    } = await supabaseClient
        .from("profiles")
        .select("id,email,name,role,status,credits")
        .eq("id", currentUser.id)
        .single();

    if (error || !profile) {

        await supabaseClient.auth.signOut();

        window.location.href = "../index.html";
        return false;

    }

    if (
        !["ADMIN", "OWNER"].includes(profile.role) ||
        profile.status !== "active"
    ) {

        window.location.href = "../user/dashboard.html";
        return false;

    }

    document.getElementById("userInfo").textContent =
        profile.email + " • " + profile.role;

    return true;
}

async function loadProviders() {

    const {
        data,
        error
    } = await supabaseClient
        .from("providers")
        .select(`
            id,
            provider_id,
            provider_name,
            description,
            status,
            is_default
        `)
        .order("created_at", {
            ascending: false
        });

    if (error) {

        throw error;

    }

    providerCache = data || [];

}

function getProviderName(providerId) {

    const provider = providerCache.find(
        item => item.id === providerId
    );

    if (provider) {

        return provider.provider_name;

    }

    return providerId || "-";

}

function getProviderStatus(providerId) {

    const provider = providerCache.find(
        item => item.id === providerId
    );

    if (provider) {

        return provider.status;

    }

    return null;

}

async function loadModels() {

    clearMessage();

    const container =
        document.getElementById("modelContainer");

    const refreshButton =
        document.getElementById("refreshButton");

    container.innerHTML = `
        <div class="loading">
            Memuat model...
        </div>
    `;

    refreshButton.disabled = true;
    refreshButton.textContent = "LOADING...";

    try {

        await loadProviders();

        const {
            data,
            error
        } = await supabaseClient
            .from("models")
            .select(`
                id,
                provider_id,
                model_id,
                model_name,
                description,
                credit_cost,
                min_duration,
                max_duration,
                supported_ratios,
                supported_resolutions,
                status,
                created_at,
                updated_at
            `)
            .order("created_at", {
                ascending: false
            });

        if (error) {

            throw error;

        }

        if (!data || data.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <strong>BELUM ADA MODEL</strong>
                    <span>
                        Belum ada model AI yang terdaftar di database.
                    </span>
                </div>
            `;

            return;
        }

        let html = `
            <div class="table-wrap">
                <table>

                    <thead>
                        <tr>
                            <th>PROVIDER</th>
                            <th>MODEL ID</th>
                            <th>MODEL NAME</th>
                            <th>CREDIT</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>

                    <tbody>
        `;

        data.forEach(model => {

            const providerName =
                getProviderName(model.provider_id);

            const status =
                String(model.status || "inactive")
                    .toLowerCase();

            html += `
                <tr>

                    <td>
                        <div class="provider-name">
                            ${escapeHtml(providerName)}
                        </div>
                    </td>

                    <td>
                        <span class="model-id">
                            ${escapeHtml(model.model_id || "-")}
                        </span>
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(model.model_name || "-")}
                        </strong>
                    </td>

                    <td>
                        <span class="credit">
                            ${Number(model.credit_cost || 0)}
                        </span>
                    </td>

                    <td>
                        <span class="status ${status}">
                            ${escapeHtml(status)}
                        </span>
                    </td>

                </tr>
            `;

        });

        html += `
                    </tbody>

                </table>
            </div>
        `;

        container.innerHTML = html;

    } catch (error) {

        console.error("MODEL ERROR:", error);

        container.innerHTML = `
            <div class="empty">
                <strong>GAGAL MEMUAT MODEL</strong>
                <span>
                    ${escapeHtml(error.message || "Terjadi kesalahan.")}
                </span>
            </div>
        `;

        showMessage(
            "Gagal mengambil data model dari database.",
            "error"
        );

    } finally {

        refreshButton.disabled = false;
        refreshButton.textContent = "REFRESH";

    }

}

function escapeHtml(value) {

    if (value === null || value === undefined) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href = "../index.html";

}

async function init() {

    const authenticated = await checkAuth();

    if (!authenticated) {

        return;

    }

    await loadModels();

}

init();

</script>

</body>
</html>
