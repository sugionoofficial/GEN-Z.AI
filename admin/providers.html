<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="stylesheet" href="../assets/css/admin-premium.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Providers - GEN-Z.AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e9edf2);
            color: #111827;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #fff;
            border-right: 1px solid #e5e7eb;
            padding: 22px 16px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .brand-sub {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 28px;
            letter-spacing: 1px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .nav a {
            text-decoration: none;
            color: #374151;
            padding: 12px 13px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover {
            background: #f3f4f6;
        }

        .nav a.active {
            background: #111827;
            color: #fff;
        }

        .logout {
            margin-top: 25px;
            width: 100%;
            border: 0;
            background: #f3f4f6;
            color: #111827;
            padding: 11px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .page-subtitle {
            margin-top: 6px;
            color: #6b7280;
            font-size: 14px;
        }

        .user-info {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
        }

        .card {
            background: rgba(255, 255, 255, .96);
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, .05);
            overflow: hidden;
        }

        .card-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .card-title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .card-subtitle {
            margin-top: 5px;
            color: #6b7280;
            font-size: 13px;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-dark {
            background: #111827;
            color: #fff;
        }

        .btn-edit {
            background: #f3f4f6;
            color: #111827;
        }

        .btn-delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .message {
            margin: 18px 20px 0;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #eef0f3;
            font-size: 13px;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 11px;
            letter-spacing: .5px;
            font-weight: 800;
        }

        tr:hover td {
            background: #fafafa;
        }

        .provider-name {
            font-weight: 800;
        }

        .provider-id {
            display: inline-block;
            font-family: monospace;
            background: #f3f4f6;
            padding: 5px 7px;
            border-radius: 5px;
            font-size: 12px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status.active {
            background: #dcfce7;
            color: #166534;
        }

        .status.inactive {
            background: #f3f4f6;
            color: #4b5563;
        }

        .status.maintenance {
            background: #fef3c7;
            color: #92400e;
        }

        .default-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 4px 7px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 9px;
            font-weight: 800;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .empty {
            padding: 60px 20px;
            text-align: center;
            color: #6b7280;
        }

        .empty strong {
            display: block;
            color: #111827;
            margin-bottom: 8px;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #6b7280;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 560px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .2);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .close {
            border: 0;
            background: transparent;
            font-size: 22px;
            cursor: pointer;
            color: #6b7280;
        }

        .form {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
            color: #374151;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 11px 12px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #111827;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
                padding: 20px;
            }
        }

        @media (max-width: 600px) {
            .layout {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #e5e7eb;
            }

            .nav {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">GEN-Z.AI</div>
        <div class="brand-sub">ADMIN CONTROL</div>

        <nav class="nav">
            <a href="dashboard.html">DASHBOARD</a>
            <a href="generate.html">GENERATE</a>
            <a href="history.html">HISTORY</a>
            <a href="admin-panel.html">ADMIN PANEL</a>
            <a href="models.html">MODELS</a>
            <a href="providers.html" class="active">PROVIDERS</a>
            <a href="credit.html">CREDIT</a>
        </nav>

        <button class="logout" onclick="logout()">
            LOG OUT
        </button>

    </aside>

    <main class="main">

        <div class="topbar">

            <div>
                <h1 class="page-title">PROVIDER MANAGEMENT</h1>

                <div class="page-subtitle">
                    Kelola provider AI yang digunakan GEN-Z.AI
                </div>
            </div>

            <div class="user-info" id="userInfo">
                Memuat...
            </div>

        </div>

        <section class="card">

            <div class="card-header">

                <div>
                    <h2 class="card-title">
                        AI PROVIDERS
                    </h2>

                    <div class="card-subtitle">
                        Provider ID digunakan oleh sistem backend.
                    </div>
                </div>

                <button
                    class="btn btn-dark"
                    onclick="openCreateProvider()"
                >
                    + PROVIDER
                </button>

            </div>

            <div
                id="message"
                class="message"
            ></div>

            <div id="providerContainer">

                <div class="loading">
                    Memuat provider...
                </div>

            </div>

        </section>

    </main>

</div>


<div
    class="modal"
    id="providerModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3
                class="modal-title"
                id="modalTitle"
            >
                TAMBAH PROVIDER
            </h3>

            <button
                class="close"
                onclick="closeProviderModal()"
            >
                ×
            </button>

        </div>

        <div class="form">

            <div class="form-group">

                <label for="providerId">
                    PROVIDER ID
                </label>

                <input
                    type="text"
                    id="providerId"
                    placeholder="contoh: chinaapi"
                >

            </div>

            <div class="form-group">

                <label for="providerName">
                    PROVIDER NAME
                </label>

                <input
                    type="text"
                    id="providerName"
                    placeholder="contoh: ByteDance"
                >

            </div>

            <div class="form-group">

                <label for="providerDescription">
                    DESCRIPTION
                </label>

                <textarea
                    id="providerDescription"
                    placeholder="Deskripsi provider..."
                ></textarea>

            </div>

            <div class="form-group">

                <label for="providerStatus">
                    STATUS
                </label>

                <select id="providerStatus">

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                    <option value="maintenance">
                        Maintenance
                    </option>

                </select>

            </div>

            <div class="checkbox-row">

                <input
                    type="checkbox"
                    id="providerDefault"
                >

                <label for="providerDefault">
                    Jadikan default provider
                </label>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn"
                onclick="closeProviderModal()"
            >
                BATAL
            </button>

            <button
                class="btn btn-dark"
                id="providerSaveButton"
                onclick="saveProvider()"
            >
                SIMPAN
            </button>

        </div>

    </div>

</div>


<script>

const supabaseClient = supabase.createClient(
    GENZ_CONFIG.SUPABASE_URL,
    GENZ_CONFIG.SUPABASE_KEY
);

let currentUser = null;
let editId = null;

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}

function clearMessage() {

    const message =
        document.getElementById("message");

    message.textContent = "";

    message.className =
        "message";

}

async function checkAuth() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (
        !session ||
        !session.user
    ) {

        window.location.href =
            "../index.html";

        return false;

    }

    currentUser =
        session.user;

    const {
        data: profile,
        error
    } = await supabaseClient
        .from("profiles")
        .select(
            "id,email,name,role,status,credits"
        )
        .eq(
            "id",
            currentUser.id
        )
        .single();

    if (
        error ||
        !profile
    ) {

        await supabaseClient.auth.signOut();

        window.location.href =
            "../index.html";

        return false;

    }

    if (
        !["ADMIN", "OWNER"].includes(
            profile.role
        ) ||
        profile.status !== "active"
    ) {

        window.location.href =
            "../user/dashboard.html";

        return false;

    }

    document.getElementById(
        "userInfo"
    ).textContent =
        profile.email +
        " • " +
        profile.role;

    return true;

}

async function loadProviders() {

    const container =
        document.getElementById(
            "providerContainer"
        );

    container.innerHTML = `
        <div class="loading">
            Memuat provider...
        </div>
    `;

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("providers")
            .select(`
                id,
                provider_id,
                provider_name,
                description,
                status,
                is_default,
                created_at,
                updated_at
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

        if (error) {

            throw error;

        }

        if (
            !data ||
            data.length === 0
        ) {

            container.innerHTML = `
                <div class="empty">

                    <strong>
                        BELUM ADA PROVIDER
                    </strong>

                    <span>
                        Tambahkan provider AI pertama.
                    </span>

                </div>
            `;

            return;

        }

        let html = `
            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>PROVIDER</th>
                            <th>PROVIDER ID</th>
                            <th>DESCRIPTION</th>
                            <th>STATUS</th>
                            <th>DEFAULT</th>
                            <th>ACTION</th>
                        </tr>

                    </thead>

                    <tbody>
        `;

        data.forEach(provider => {

            const status =
                String(
                    provider.status ||
                    "inactive"
                ).toLowerCase();

            html += `
                <tr>

                    <td>

                        <div class="provider-name">
                            ${escapeHtml(
                                provider.provider_name
                            )}
                        </div>

                    </td>

                    <td>

                        <span class="provider-id">
                            ${escapeHtml(
                                provider.provider_id
                            )}
                        </span>

                    </td>

                    <td>
                        ${escapeHtml(
                            provider.description ||
                            "-"
                        )}
                    </td>

                    <td>

                        <span
                            class="status ${status}"
                        >
                            ${escapeHtml(status)}
                        </span>

                    </td>

                    <td>

                        ${
                            provider.is_default
                            ? `
                                <span class="default-badge">
                                    DEFAULT
                                </span>
                            `
                            : "-"
                        }

                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="btn btn-edit"
                                onclick="editProvider(
                                    '${provider.id}',
                                    '${escapeAttribute(provider.provider_id)}',
                                    '${escapeAttribute(provider.provider_name)}',
                                    '${escapeAttribute(provider.description || "")}',
                                    '${escapeAttribute(provider.status)}',
                                    ${provider.is_default ? "true" : "false"}
                                )"
                            >
                                EDIT
                            </button>

                            <button
                                class="btn btn-delete"
                                onclick="deleteProvider(
                                    '${provider.id}',
                                    '${escapeAttribute(provider.provider_name)}'
                                )"
                            >
                                HAPUS
                            </button>

                        </div>

                    </td>

                </tr>
            `;

        });

        html += `
                    </tbody>

                </table>

            </div>
        `;

        container.innerHTML =
            html;

    } catch (error) {

        console.error(
            "PROVIDER ERROR:",
            error
        );

        container.innerHTML = `
            <div class="empty">

                <strong>
                    GAGAL MEMUAT PROVIDER
                </strong>

                <span>
                    ${escapeHtml(
                        error.message ||
                        "Terjadi kesalahan."
                    )}
                </span>

            </div>
        `;

        showMessage(
            "Gagal mengambil data provider.",
            "error"
        );

    }

}

function escapeAttribute(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\r/g, "\\r")
        .replace(/\n/g, "\\n");

}

function openCreateProvider() {

    editId = null;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "TAMBAH PROVIDER";

    document.getElementById(
        "providerId"
    ).value = "";

    document.getElementById(
        "providerName"
    ).value = "";

    document.getElementById(
        "providerDescription"
    ).value = "";

    document.getElementById(
        "providerStatus"
    ).value =
        "active";

    document.getElementById(
        "providerDefault"
    ).checked =
        false;

    document.getElementById(
        "providerModal"
    ).classList.add("show");

}

function editProvider(
    id,
    providerId,
    providerName,
    description,
    status,
    isDefault
) {

    editId = id;

    document.getElementById(
        "modalTitle"
    ).textContent =
        "EDIT PROVIDER";

    document.getElementById(
        "providerId"
    ).value =
        providerId;

    document.getElementById(
        "providerName"
    ).value =
        providerName;

    document.getElementById(
        "providerDescription"
    ).value =
        description;

    document.getElementById(
        "providerStatus"
    ).value =
        status;

    document.getElementById(
        "providerDefault"
    ).checked =
        isDefault;

    document.getElementById(
        "providerModal"
    ).classList.add("show");

}

function closeProviderModal() {

    document.getElementById(
        "providerModal"
    ).classList.remove("show");

    editId = null;

}

async function saveProvider() {

    clearMessage();

    const button =
        document.getElementById(
            "providerSaveButton"
        );

    const providerId =
        document.getElementById(
            "providerId"
        ).value.trim();

    const providerName =
        document.getElementById(
            "providerName"
        ).value.trim();

    const description =
        document.getElementById(
            "providerDescription"
        ).value.trim();

    const status =
        document.getElementById(
            "providerStatus"
        ).value;

    const isDefault =
        document.getElementById(
            "providerDefault"
        ).checked;

    if (!providerId) {

        showMessage(
            "Provider ID wajib diisi.",
            "error"
        );

        return;

    }

    if (!providerName) {

        showMessage(
            "Provider Name wajib diisi.",
            "error"
        );

        return;

    }

    button.disabled = true;
    button.textContent =
        "MENYIMPAN...";

    try {

        let result;

        if (editId) {

            result =
                await supabaseClient
                    .rpc(
                        "admin_update_provider",
                        {
                            p_id: editId,
                            p_provider_id:
                                providerId,
                            p_provider_name:
                                providerName,
                            p_description:
                                description ||
                                null,
                            p_status:
                                status,
                            p_is_default:
                                isDefault
                        }
                    );

        } else {

            result =
                await supabaseClient
                    .rpc(
                        "admin_create_provider",
                        {
                            p_provider_id:
                                providerId,
                            p_provider_name:
                                providerName,
                            p_description:
                                description ||
                                null,
                            p_status:
                                status,
                            p_is_default:
                                isDefault
                        }
                    );

        }

        if (result.error) {

            throw result.error;

        }

        closeProviderModal();

        showMessage(
            editId
                ? "Provider berhasil diperbarui."
                : "Provider berhasil ditambahkan.",
            "success"
        );

        await loadProviders();

    } catch (error) {

        console.error(
            "SAVE PROVIDER ERROR:",
            error
        );

        showMessage(
            "Gagal menyimpan provider: " +
            (
                error.message ||
                "Terjadi kesalahan."
            ),
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent =
            "SIMPAN";

    }

}

async function deleteProvider(
    id,
    providerName
) {

    const confirmed =
        window.confirm(
            "Hapus provider \"" +
            providerName +
            "\"?"
        );

    if (!confirmed) {

        return;

    }

    clearMessage();

    try {

        const {
            error
        } = await supabaseClient
            .rpc(
                "admin_delete_provider",
                {
                    p_id: id
                }
            );

        if (error) {

            throw error;

        }

        showMessage(
            "Provider berhasil dihapus.",
            "success"
        );

        await loadProviders();

    } catch (error) {

        console.error(
            "DELETE PROVIDER ERROR:",
            error
        );

        showMessage(
            "Gagal menghapus provider: " +
            (
                error.message ||
                "Terjadi kesalahan."
            ),
            "error"
        );

    }

}

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "../index.html";

}

async function init() {

    const authenticated =
        await checkAuth();

    if (!authenticated) {

        return;

    }

    await loadProviders();

}

document.getElementById(
    "providerModal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            closeProviderModal();

        }

    }
);

init();

</script>

</body>
</html>
