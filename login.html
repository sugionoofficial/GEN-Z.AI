<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GEN-Z.AI | Login</title>

    <link
        rel="stylesheet"
        href="assets/css/login.css"
    >

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">

                <h1>
                    GEN-Z.AI
                </h1>

                <p>
                    AI Video Generation Platform
                </p>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    LOGIN
                </button>


                <div
                    id="loginMessage"
                    class="login-message"
                ></div>

            </form>


            <!-- =================================================
                 REGISTER
                 ================================================= -->

            <div class="register-section">

                <div class="register-divider">
                    <span></span>
                    <small>ATAU</small>
                    <span></span>
                </div>


                <p class="register-text">
                    Belum memiliki akun?
                </p>


                <a
                    href="register.html"
                    class="register-button"
                >
                    DAFTAR SEKARANG
                </a>

            </div>

        </section>

    </main>


    <!-- =========================================================
         REGISTER STYLE
         Dibuat di sini agar langsung bekerja tanpa perlu
         mengubah assets/css/login.css
         ========================================================= -->

    <style>

        .register-section {
            margin-top: 22px;
            text-align: center;
        }


        .register-divider {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 17px;
        }


        .register-divider span {
            flex: 1;

            height: 1px;

            background:
                rgba(0,0,0,.09);
        }


        .register-divider small {
            font-size: 8px;
            font-weight: 800;

            letter-spacing: .12em;

            color:
                #98a2b3;
        }


        .register-text {
            margin-bottom: 10px;

            font-size: 10px;

            color:
                #667085;
        }


        .register-button {
            width: 100%;

            min-height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid
                #d0d5dd;

            border-radius: 11px;

            background:
                #ffffff;

            color:
                #101828;

            font-size: 10px;
            font-weight: 850;

            letter-spacing: .05em;

            text-decoration: none;

            transition:
                background .18s ease,
                color .18s ease,
                border-color .18s ease,
                transform .18s ease,
                box-shadow .18s ease;
        }


        .register-button:hover {
            transform:
                translateY(-2px);

            background:
                #111827;

            border-color:
                #111827;

            color:
                #ffffff;

            box-shadow:
                0 10px 25px
                rgba(15,23,42,.12);
        }


        .register-button:active {
            transform:
                translateY(0);
        }


        @media (max-width: 480px) {

            .register-section {
                margin-top: 18px;
            }

            .register-button {
                min-height: 42px;
            }

        }

    </style>


    <!-- =========================================================
         SUPABASE
         ========================================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================================================
         CONFIG
         ========================================================= -->

    <script src="assets/js/config.js"></script>


    <!-- =========================================================
         AUTHENTICATION
         ========================================================= -->

    <script src="assets/js/auth.js"></script>

</body>
</html>
