<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="GEN-Z.AI">
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1C1D44"/>
      <stop offset="55%" stop-color="#12132A"/>
      <stop offset="100%" stop-color="#0A0B18"/>
    </linearGradient>

    <linearGradient id="zGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D3C6FF"/>
      <stop offset="32%" stop-color="#8D7DFF"/>
      <stop offset="72%" stop-color="#6FB4FF"/>
      <stop offset="100%" stop-color="#55D9F2"/>
    </linearGradient>

    <linearGradient id="tileEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8D7DFF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#55D9F2" stop-opacity=".25"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#8D7DFF" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#8D7DFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCD8F5"/>
    </linearGradient>

    <filter id="soft" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#tileBg)"/>
  <rect x="1.0" y="1.0" width="118.0" height="118.0" rx="29.0"
        fill="none" stroke="url(#tileEdge)" stroke-width="1"/>
  <circle cx="60" cy="52" r="46" fill="url(#halo)"/>

  <g transform="translate(60 60) scale(0.62000)">
    <path d="M -50.00 -50.00 H 50.00 V -27.00 H -50.00 Z M -50.00 27.00 H 50.00 V 50.00 H -50.00 Z M 50.00 -50.00 L 50.00 -27.00 L -50.00 50.00 L -50.00 27.00 Z" fill="url(#zGrad)" opacity=".55" filter="url(#soft)"/>
    <path d="M -50.00 -50.00 H 50.00 V -27.00 H -50.00 Z M -50.00 27.00 H 50.00 V 50.00 H -50.00 Z M 50.00 -50.00 L 50.00 -27.00 L -50.00 50.00 L -50.00 27.00 Z" fill="url(#zGrad)"/>
  </g>
</svg>
