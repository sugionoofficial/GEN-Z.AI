name = "genzai"
account_id = "f374e7e2d001dd43253c8d47182e3882"
main = "functions/worker.mjs"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat"]

[vars]
META_REDIRECT_URI = "https://genzai.genzai-f37.workers.dev/api/facebook-oauth-callback"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[limits]
cpu_ms = 300000

[triggers]
crons = ["* * * * *"]

# Cloudflare Workers Builds calls `wrangler preview`; keep this block present
# so preview deployments can be created. Preview-specific bindings should use
# dedicated non-production resources when they are provisioned.
[previews]
